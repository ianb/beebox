# The production nginx site: /etc/nginx/sites-available/beebox.
#
# deploy.sh installs this file on every deploy and reloads nginx only when it
# changed; setup-server.sh installs it at provisioning. Edit it here, never on
# the server: a hand edit is overwritten by the next change to this file.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 50m;

    # The deploy page below is reached through a second error_page redirect
    # (502 -> @hub_unreachable -> 503 -> the page), which nginx follows only
    # with this on. It must be at server level: set inside the named location
    # it does not take effect.
    recursive_error_pages on;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        # The tRPC client uses httpBatchStreamLink: the server writes each
        # procedure's result as a JSONL line the moment it resolves, so a fast
        # query renders without waiting for a slow batch-mate. nginx buffers
        # proxied responses by default, which would re-couple the batch by
        # holding every line until the response completed. There is only this
        # one location (everything is proxied to the hub), so the whole app
        # opts out; responses here are dynamic API/HTML, never large static
        # files where buffering would earn its keep.
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;

        # Only a 502/504 that nginx generates itself (the hub is not listening)
        # comes here. A 5xx the hub sends is its own answer and passes through:
        # there is no proxy_intercept_errors.
        error_page 502 504 = @hub_unreachable;
    }

    # A deploy writes this page before it stops the services and removes it
    # when the deploy's activation exits (deploy/server-bin/bbx-deploy-window).
    # The page's presence is the only "a deploy is running" signal: without it
    # the hub being down is an outage, and the visitor gets the plain 502.
    location @hub_unreachable {
        error_page 503 /__bbx_deploy_in_progress.html;
        if (-f /run/beebox-deploy/deploy-in-progress.html) {
            return 503;
        }
        return 502;
    }

    location = /__bbx_deploy_in_progress.html {
        internal;
        root /run/beebox-deploy;
        # The page may vanish between the test above and this read.
        try_files /deploy-in-progress.html =502;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 30 always;
        # The open page polls for this header's absence to know the site is back.
        add_header X-Beebox-Deploy in-progress always;
    }
}
