# coturn for a Bee Box cloud server: one relay for every box on the host
# (docs/plans/self-hosted-turn.md). deploy/server-bin/bbx-turn-install appends
# the host's addresses and the shared secret from the master store's
# `turn-server` entry and installs the result as /etc/turnserver.conf. Edit this
# file in the repo, never on the server.

listening-port=3478
# Relayed media. origin-firewall.sh opens the same range.
min-port=49160
max-port=49999

# Only credentials the box server signs (TURN REST: HMAC of "<expiry>:<box>").
use-auth-secret
realm=beebox
fingerprint
stale-nonce=600

# Plain TURN on 3478 only; TLS needs a public certificate and a DNS name.
no-tls
no-dtls
no-cli
no-rfc5780
no-stun-backward-compatibility
no-software-attribute

# WebRTC relays UDP only; no TCP relay keeps a TURN user off the host's TCP
# services (nginx, sshd).
no-tcp-relay
no-multicast-peers

# Abuse limits: allocations per username (one page's join: the username holds
# its expiry and box), allocations in total, and bytes per second per
# allocation (about 24 Mbit/s).
user-quota=20
total-quota=600
max-bps=3000000

# Never relay to loopback, private, link-local, or reserved addresses, nor to
# IPv4-mapped IPv6 (coturn GHSA-j8mm-mpf8-gvjg). The host's own public addresses
# stay allowed: two members relayed here reach each other at them.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
# coturn 4.6.1 reads a bare "::" as a range that denies every peer, IPv4
# included; it already refuses the unspecified address (CVE-2020-26262 fix).
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

syslog
