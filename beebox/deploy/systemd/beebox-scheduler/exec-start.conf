# Drop-in: point the scheduler unit at `bbx engine scheduler start`.
#
# Why this exists at all: the unit file itself is written once by
# setup-server.sh and is never regenerated by a deploy (deploy.sh says so where
# it installs these drop-ins). The running unit therefore still says
# `ExecStart=/usr/local/bin/bbx scheduler start`, and that verb moved under `bbx engine`
# when the CLI was split into the box agent's surface and everything else.
#
# The bare `ExecStart=` is the line that matters. ExecStart is a LIST, so a
# drop-in that only adds the new command APPENDS to the unit's existing one:
# systemd would run the old `bbx scheduler start`, fail instantly on a missing verb, and
# mark the unit failed without ever starting the real scheduler. Resetting the list
# first is what makes this a replacement.
#
# Delete this file once setup-server.sh has been re-run on every server, at
# which point the unit says the right thing on its own.
[Service]
ExecStart=
ExecStart=/usr/local/bin/bbx engine scheduler start
