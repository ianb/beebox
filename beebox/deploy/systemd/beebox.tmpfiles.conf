# Runtime and cache directories the units expect, installed as
# /etc/tmpfiles.d/beebox.conf. /run/beebox is a tmpfs path, gone at every boot:
# it holds the box sockets (made by the socket units) and the per-box hub
# secrets (written by the hub user, read by systemd for LoadCredential=), so
# the hub user must be able to create files there. Without this entry a reboot
# leaves the socket units to create it root-only, and the hub fails to start
# (2026-11-11). cloud-init.yaml writes the same lines on a new host; the
# deploy installs this file on every deploy, so an older host gains it too.
d /run/beebox        0775 root   beebox       -
d /var/lib/beebox    0755 root   root         -
d /var/cache/beebox  0755 root   root         -
d /var/cache/beebox/uv 2775 root beebox-boxes -
d /var/cache/beebox/hf 2775 root beebox-boxes -
d /var/log/beebox    0755 root   root         -
d /etc/beebox        2755 beebox beebox-boxes -
d /var/lib/beebox-sched 0750 beebox-sched beebox-sched -
