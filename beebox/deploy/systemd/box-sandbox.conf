# Drop-in: the filesystem and memory view every box process runs in.
#
# Install into BOTH beebox-box@.service.d/ and beebox-pass@.service.d/, so the
# engine serving a box and the scheduler pass over it see the same host.
#
# ProtectSystem=strict makes the whole tree read-only except ReadWritePaths;
# ProtectHome=yes hides /home (the hub user's files, every human home), /root
# and /run/user. TemporaryFileSystem over /var/lib/beebox replaces the boxes'
# parent directory with an empty read-only tmpfs, and BindPaths puts this
# box's own home back: a sibling box's home does not exist in this view,
# whatever its mode. The uv and Docling model caches are shared across boxes
# (group beebox-boxes, setgid, group-writable): Docling fetches a model it
# lacks on first use, so the model cache must be writable too (found on the
# probe VM, 2026-10-24; the provisioner's prefetch cannot name every model).
# NoNewPrivileges: a box runs no sudo (bbx host install only records on a unit
# host; the deploy installs). MemoryHigh throttles and logs, MemoryMax kills:
# the whole cgroup, so the engine, its Claude Code subprocess and a Docling
# run count together. First guess, to be measured (docs/plans/per-box-units.md).
# UMask 0007, not 0077: a box's own group (bbx-<slug>) has one member, so group
# bits on its files open nothing, while a file it writes into a shared cache
# takes the cache's setgid group and must stay readable and writable by the
# sibling boxes (0077 made every cache entry one box's alone). The engine opens
# the few files the hub reads (the box root, .beebox/, hub-meta.json) by hand.
[Service]
UMask=0007
ProtectSystem=strict
ProtectHome=yes
TemporaryFileSystem=/var/lib/beebox:ro
BindPaths=/var/lib/beebox/%i
ReadWritePaths=/var/lib/beebox/%i /var/cache/beebox/uv /var/cache/beebox/hf
PrivateTmp=yes
NoNewPrivileges=yes
MemoryHigh=1G
MemoryMax=2G
