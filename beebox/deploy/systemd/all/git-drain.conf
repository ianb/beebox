# Drop-in: let a service drain its own git writes before systemd kills it.
#
# Install into BOTH beebox-hub.service.d/ and beebox-scheduler.service.d/.
#
# Why: with systemd's default KillMode=control-group the stop signal goes to
# every process in the cgroup, so a `git` that a box child is running is
# signalled by systemd rather than by us, and the SIGKILL that follows can land
# mid-index-write. That leaves a `.git/index.lock` no process owns, and every
# writer in that box — the scheduler, the box agent's auto-commits, a hand-run
# `git commit` — fails on it until a human deletes the file.
#
# KillMode=mixed sends SIGTERM to the main process only. The hub then tears its
# box children down on its own schedule (BOX_KILL_GRACE_MS), and both the hub's
# children and the scheduler drain their in-flight git spans before exiting
# (drainBoxGitLocks). TimeoutStopSec is the backstop, deliberately above those
# in-process budgets so systemd escalates only when our own teardown failed.
[Service]
KillMode=mixed
TimeoutStopSec=60
