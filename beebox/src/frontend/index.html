<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9B6BA6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Bee Box" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Bee Box</title>
    <!-- The shell renders nothing until the box list arrives (BoxValidationLayout,
         hooks/useBoxes.ts). Asking for it here starts that request alongside the
         entry script instead of after it has downloaded and run. A plain fetch
         (lib/boxes.ts) matches this preload; the iOS shell's authenticated fetch
         does not, and fetches again. -->
    <link rel="preload" href="/api/boxes" as="fetch" crossorigin />
    <!-- Boot fallback shown inside #root until React mounts (createRoot replaces
         #root's children). If the app never mounts — e.g. its JS bundle fails to
         load — this stays visible, so a failed load reads as a message, not a
         blank white screen. Pure CSS (style-src allows 'unsafe-inline'; script-src
         does not, so no JS): the "couldn't load" hint fades in only after ~5s, so
         a normal fast load is replaced before it ever appears. -->
    <style>
      #root .app-boot {
        max-width: 22rem;
        margin: 22vh auto 0;
        padding: 0 1.25rem;
        text-align: center;
        font-family: system-ui, -apple-system, sans-serif;
        color: #6b6b6b;
      }
      #root .app-boot-hint {
        margin-top: 0.75rem;
        font-size: 0.8rem;
        color: #9a9a9a;
        opacity: 0;
        animation: app-boot-hint-in 0s linear 5s forwards;
      }
      @keyframes app-boot-hint-in {
        to {
          opacity: 1;
        }
      }
      /* Three index cards take turns lifting off the stack: two cycles,
         finished before the hint appears, so a stuck load stops moving. */
      #root .app-boot-cards {
        position: relative;
        width: 84px;
        height: 56px;
        margin: 0 auto 18px;
      }
      #root .app-boot-cards i {
        position: absolute;
        inset: 0;
        border: 1px solid #d8d0c0;
        border-radius: 3px;
        background:
          linear-gradient(#e7a3a3, #e7a3a3) 0 9px / 100% 1px no-repeat,
          linear-gradient(#a9c3dd, #a9c3dd) 8px 21px / calc(100% - 16px) 1px no-repeat,
          linear-gradient(#a9c3dd, #a9c3dd) 8px 30px / calc(100% - 16px) 1px no-repeat,
          linear-gradient(#a9c3dd, #a9c3dd) 8px 39px / calc(100% - 16px) 1px no-repeat,
          #fffdf7;
        box-shadow: 0 1px 2px #0000001a;
        animation: app-boot-riffle 1600ms ease-in-out 2;
      }
      #root .app-boot-cards i:nth-child(1) { z-index: 3; animation-delay: 300ms; }
      #root .app-boot-cards i:nth-child(2) { z-index: 2; transform: translate(3px, -3px); animation-delay: 830ms; }
      #root .app-boot-cards i:nth-child(3) { z-index: 1; transform: translate(6px, -6px); animation-delay: 1360ms; }
      @keyframes app-boot-riffle {
        30% {
          transform: translate(-6px, -34px) rotate(-9deg);
        }
        55% {
          transform: translate(10px, -14px) rotate(4deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #root .app-boot-cards i {
          animation: none;
        }
      }
      @media (prefers-color-scheme: dark) {
        #root .app-boot {
          color: #b8b8b8;
        }
        #root .app-boot-hint {
          color: #808080;
        }
        #root .app-boot-cards i {
          border-color: #5a5143;
          background-color: #3a352d;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot">
        <div class="app-boot-cards" aria-hidden="true"><i></i><i></i><i></i></div>
        Loading Bee Box&hellip;
        <div class="app-boot-hint">
          If this message stays, the app couldn&rsquo;t load. Try reloading, or sign in again.
        </div>
      </div>
    </div>
    <script type="module" src="/src/main/app.tsx"></script>
  </body>
</html>
