# The agent guide's ledger: the decisions behind `.beebox/agent-guide.md`.
# One row per rule, with its bin and the reason for it; the registry of
# section handles; the size budget. The guide's text says the rules; this
# file says why each one is there. Spec and procedure: docs/agent-guide.md.
# Schema: ledger-schema.ts.

budget:
  # Measured on the test1 clone (`pnpm lint:guide --box <clone> --report`)
  # after each section is binned, so the ceilings ratchet down: `wc -w` of
  # the rendered guide, and the `pnpm agent-context chat` total. Last:
  # 2026-09-26, after INTAKE.
  guide_words: 7230
  always_loaded_words: 12022
  uncited_words_per_section: 60

lint:
  # Sections whose coverage and uncited-words checks are on. Grows as each
  # section is binned.
  covered_sections:
    - THE_LAWS
    - ABOUT_CARDS
    - COMMANDS
    - INTAKE

# Every section handle, in guide order. `referrers` names who points at the
# handle: another handle, or a path relative to the beebox package. Rename a
# handle only with a sweep of its referrers.
registry:
  - handle: THE_LAWS
    governs: the inviolable rules that outrank everything else in the guide
    referrers: []
  - handle: THE_LAW_OF_QUOTING
    governs: the user's expressed words and data are recorded verbatim, never paraphrased
    referrers:
      - THE_LAW_OF_SAVING
      - ABOUT_CARDS
      - PROVENANCE
      - docs/box/provenance.md
      - src/dev/knowledge-audits.yaml
  - handle: THE_LAW_OF_SAVING
    governs: anything worth keeping is saved before the turn ends; chat is not memory
    referrers:
      - THE_LAW_OF_CARDS
  - handle: THE_LAW_OF_CARDS
    governs: saving means writing a card, not loose files or summaries
    referrers:
      - ABOUT_CARDS
  - handle: DOCS
    governs: where the package reference docs and this box's compiled docs are
    referrers:
      - src/dev/knowledge-audits.yaml
  - handle: SPEAKING
    governs: the words to use with the user in place of system vocabulary
    referrers:
      - src/core/box/skills-content-what-can-you-do.ts
      - src/dev/knowledge-audits.yaml
  - handle: ABOUT_CARDS
    governs: what a card is, its shared frontmatter, naming, attachments, and card commands
    referrers:
      - THE_LAW_OF_CARDS
      - COMMANDS
      - SEARCHING
      - src/core/agent-guide/search.ts
      - src/core/reactor/prompts.ts
      - src/schemas/audio.tsx
      - src/schemas/doc.tsx
      - src/schemas/image.tsx
      - src/schemas/memo.ts
      - src/schemas/person.tsx
      - docs/box/provenance.md
      - docs/prompts/review.md
      - src/dev/knowledge-audits.yaml
  - handle: CARD_TYPES
    governs: the catalogue of this box's card types and when to define a new one
    referrers:
      - ABOUT_CARDS
      - src/schemas/registry.ts
      - docs/prompts/lenses.md
      - src/dev/knowledge-audits.yaml
  - handle: QUESTIONS
    governs: when and how to ask the boxholder through a question card
    referrers:
      - TODOS
      - RECORDING
  - handle: TODOS
    governs: when a todo is the right tool and how to capture one
    referrers:
      - src/core/chat/session/prompts.ts
      - docs/box/todos.md
      - docs/box-guidance.md
      - src/dev/knowledge-audits.yaml
  - handle: DIRECTORY_LAYOUT
    governs: the box's directories and the lifecycle stage each one means
    referrers: []
  - handle: BOX_CODE
    governs: where box-authored code lives and which root files are not the agent's to edit
    referrers:
      - src/dev/knowledge-audits.yaml
  - handle: LANDMARKS
    governs: what landmarks are for and when to raise or add one
    referrers: []
  - handle: INTAKE
    governs: how items arrive in the box and the two sorting paths
    referrers:
      - src/dev/knowledge-audits.yaml
  - handle: COMMANDS
    governs: the everyday bbx commands beyond card operations
    referrers:
      - src/dev/knowledge-audits.yaml
  - handle: SEARCHING
    governs: finding cards and engine docs with bbx search
    referrers:
      - src/dev/knowledge-audits.yaml
  - handle: PROCEDURES
    governs: this box's procedures and how to run one
    referrers: []
  - handle: GUIDES
    governs: this box's guide cards and when to read one
    referrers: []
  - handle: SECRETS
    governs: how credentials are declared, granted, and never written down
    referrers:
      - src/core/docs-gen/content.ts
  - handle: TOOLS
    governs: the command-line converters on the box host and installing a missing one
    referrers:
      - src/core/chat/session/prompts.ts
      - src/dev/knowledge-audits.yaml
  - handle: PROVENANCE
    governs: when to use the quote and source tags, pointing at their mechanics
    referrers:
      - THE_LAW_OF_QUOTING
      - ABOUT_CARDS
      - src/core/chat/session/prompts.ts
      - src/schemas/recipe.tsx
      - docs/box/provenance.md
      - docs/box-guidance.md
      - docs/prompts/review.md
      - src/dev/knowledge-audits.yaml
  - handle: HISTORY
    governs: reading git log and its trailers to reconstruct what happened
    referrers:
      - src/dev/knowledge-audits.yaml
  - handle: RECORDING
    governs: which box file each kind of discovered information goes to
    referrers: []
  - handle: PERSONALITY
    governs: the voice compiled from this box's personality card
    referrers: []

# One row per rule. Fields: id, rule, handle, bin (law | core | indirect |
# delete, by the ordered test in docs/agent-guide.md), reason, audits,
# mechanics.
rows:
  # --- THE_LAWS ---
  - id: laws.intro
    rule: The laws outrank everything else in the guide; when one conflicts with convenience, brevity, or smoother prose, the law wins.
    handle: THE_LAWS
    bin: law
    reason: The laws' force depends on the agent reading them as inviolable rather than as tips; the framing is what makes a paraphrase feel like a violation.
    audits: [law-never-paraphrase, law-paraphrase-pressure]
  - id: laws.quoting
    rule: Whatever the user expressed goes into the record in their exact words inside `{% quote %}`, never smoothed, summarized, or restated as your prose.
    handle: THE_LAW_OF_QUOTING
    bin: law
    reason: A paraphrase silently replaces what the user said, and nobody can tell it happened; the guide calls it the one failure the system cannot tolerate.
    audits: [law-never-paraphrase, law-paraphrase-pressure, quote-tag-syntax, quote-no-fabrication, quote-when-to-use, narration-capture-uses-quote-tag]
    mechanics: box-docs/provenance.md
  - id: laws.quoting-errands
    rule: Purely functional instructions need no quote; the law protects the user's expression, not their errands.
    handle: THE_LAW_OF_QUOTING
    bin: law
    reason: The law's own boundary; without it an agent quotes every utterance and the tag stops marking expression.
    audits: [quote-functional-vs-expressive]
  - id: laws.quoting-data
    rule: The user's data values (quantities, units, names, dates) stay as given; convert only when asked and say so, except where a field's schema requires a machine format.
    handle: THE_LAW_OF_QUOTING
    bin: law
    reason: The same silent rewrite applied to data; added after an agent turned "1 tbsp" into "1 T" in a field test.
    audits: [law-data-fidelity-units]
  - id: laws.quoting-transcription
    rule: Fixing a transcriber's error is allowed; when unsure whether a change is a fix or a reword, it is a reword.
    handle: THE_LAW_OF_QUOTING
    bin: law
    reason: The law's one exception, stated with its tiebreak so the exception cannot absorb the rule.
    audits: []
    mechanics: box-docs/provenance.md
  - id: laws.quoting-citation
    rule: A citation wraps `{% quote %}` in `{% source %}`, and the mechanics of both tags are in PROVENANCE.
    handle: THE_LAW_OF_QUOTING
    bin: law
    reason: The law's worked example and its pointer to the mechanics; the law says that you must, PROVENANCE says how.
    audits: [source-vs-quote-composition]
    mechanics: box-docs/provenance.md
  - id: laws.quoting-third-party
    rule: A third party's exact words go in `{% quote from="…" %}` naming the speaker, so they stay distinct from the user's voice.
    handle: THE_LAW_OF_QUOTING
    bin: law
    reason: The verbatim rule extended to other people's words, with the attribution that keeps them from reading as the user's.
    audits: [quote-third-party-from]
  - id: laws.saving
    rule: Chat is not a record; anything worth keeping is saved to a card before the turn ends, and when in doubt, save.
    handle: THE_LAW_OF_SAVING
    bin: law
    reason: Nothing said in chat survives unless saved; an agent that treats the conversation as memory loses what the user told it.
    audits: [narration-capture-uses-quote-tag]
  - id: laws.cards
    rule: Saving means writing a card; loose markdown, in-conversation summaries, and scratch notes do not count as recording.
    handle: THE_LAW_OF_CARDS
    bin: law
    reason: Cards are the unit the box types, validates, versions, and searches; content saved any other way is invisible to all of that.
    audits: [narration-capture-uses-quote-tag]
    mechanics: ABOUT_CARDS

  # --- ABOUT_CARDS ---
  - id: about-cards.shape
    rule: A card is a markdown file with required YAML frontmatter named `Name.type.card`; the filename's suffix is the type and picks the schema.
    handle: ABOUT_CARDS
    bin: core
    reason: Every card an agent reads or writes depends on it, and an agent that guesses the type from a `type:` key or an XML shape writes cards that do not load.
    audits: [card-type-from-filename, memo-xml-structure, memo-yaml-format]
  - id: about-cards.naming
    rule: Name a card in `First_Last` form, capitalized words joined by underscores, not dashes or lowercase slugs.
    handle: ABOUT_CARDS
    bin: core
    reason: Every created card gets a name, and nothing else tells an agent the convention; the example card shows it. The no-duplicate-basename half went with the validation warnings, since the warning names it.
    audits: [card-filename-convention]
  - id: about-cards.title
    rule: "`title:` is the human-readable display title, distinct from the filename."
    handle: ABOUT_CARDS
    bin: core
    reason: Set on most created cards; without it an agent treats the filename as the title. Whether a type requires it is on the type's own doc.
    audits: [doc-with-image-attach-scope]
  - id: about-cards.body-tags
    rule: A card body is markdown plus the box's Markdoc tags, `{% quote %}` for the user's verbatim words and `{% source %}` for provenance.
    handle: ABOUT_CARDS
    bin: core
    reason: One sentence that names the two tags every agent writes and points at the law and at PROVENANCE for how.
    audits: [quote-tag-syntax]
  - id: about-cards.contains
    rule: "`contains:` is one sentence stating what is inside the card, not what it is, carrying the information when it is short, never a list of parts, under 200 characters; write it on create or substantial edit."
    handle: ABOUT_CARDS
    bin: core
    reason: Every card an agent writes has it, and search and listings rank on it; the audits show an agent writes a pointer sentence ("contains scheduling information") without the rule.
    audits: [contains-writing-rule]
  - id: about-cards.contains-commands
    rule: "`bbx contains update <card> --text` confirms a still-accurate sentence and clears the staleness flag; `bbx contains list --missing` / `--stale` finds cards that need one."
    handle: ABOUT_CARDS
    bin: indirect
    reason: Needed only when maintaining `contains:` fields, and the staleness warning itself names the update command.
    audits: [contains-stale-response]
    mechanics: box-docs/bbx-commands.md
  - id: about-cards.symbol
    rule: "Most cards have no `symbol:`; mark only the few someone returns to often, as `{ glyph: … }` (an emoji or a letter or two) or `{ src: <box ref> }`."
    handle: ABOUT_CARDS
    bin: core
    reason: The failure is the reflex to add one to every card an agent creates, which makes the mark worthless; the two shapes stay because they are shorter than a pointer.
    audits: [card-symbol-restraint, card-symbol-image-key]
  - id: about-cards.symbol-colours
    rule: A symbol's `foreground:`/`background:` take `#rgb`, `#rrggbb`, `hsl()`, `hsla()`, `rgb()`, or `rgba()` and nothing else.
    handle: ABOUT_CARDS
    bin: indirect
    reason: Needed only when colouring a symbol, and the validator names the six forms when one is wrong. Moved to the visual-treatment doc; nothing else documented symbols.
    audits: [card-symbol-colours]
    mechanics: box-docs/card-themes.md
  - id: about-cards.prominence
    rule: Leave `prominence:` absent on most cards; when a piece of work is done, mark its one result `primary` and your own working material `background`, never every output `primary`.
    handle: ABOUT_CARDS
    bin: core
    reason: An agent that does not know the field exists either never marks its result or marks every output primary, and both break Browse and the Landmarks page; the default and the one-primary rule are what every writing agent needs.
    audits: [prominence-mark-own-artifact, prominence-housekeeping-directory, prominence-vs-links]
  - id: about-cards.prominence-values
    rule: The tests for `entry-point`, `primary`, and `background`, the landmark rules, the validate thresholds, and how to list what a directory declares.
    handle: ABOUT_CARDS
    bin: indirect
    reason: Forty lines needed only when choosing a value. Moved verbatim to a new package doc; the landmark half is also in the landmark card's rule.
    audits: [prominence-entry-point-choice]
    mechanics: box-docs/prominence.md
  - id: about-cards.theme
    rule: "`theme:` is an optional catalogued visual choice set through Properties; never invent a theme name or stock."
    handle: ABOUT_CARDS
    bin: indirect
    reason: Touched only when styling a card. card-themes.md already stated every fact in the guide's paragraph, so nothing moved; the paragraph went and the mechanics line points there.
    audits: [card-theme-choice]
    mechanics: box-docs/card-themes.md
  - id: about-cards.refs
    rule: Every ref and internal link is written with a leading `/` and resolves from the box root; `attach/…` is the one exception; never `../`.
    handle: ABOUT_CARDS
    bin: core
    reason: Every link and ref an agent writes, in cards and replies; a relative or climbing path is the commonest broken-link cause.
    audits: [internal-links-resolve-to-box-root, links-always-box-root, landmark-ref-box-root, attach-is-the-exception]
  - id: about-cards.refs-legacy-bare
    rule: A bare path resolves relative to the document it is written in, as a legacy form.
    handle: ABOUT_CARDS
    bin: delete
    reason: It describes a form nobody should write; the leading-slash rule already says what to write, and the validator reports a link that does not resolve.
    audits: [internal-links-resolve-to-box-root]
  - id: about-cards.ref-reach
    rule: A ref reaches only the box's own areas; package docs under `node_modules/` are named in plain text, not linked.
    handle: ABOUT_CARDS
    bin: indirect
    reason: Bites only when linking an engine doc from a card, and the link-validation warning reports it.
    audits: [ref-package-doc-plain-text]
    mechanics: box-docs/provenance.md
  - id: about-cards.link-with-title
    rule: When naming another card or file in a card body or a reply, link it with a human title rather than a bare filename.
    handle: ABOUT_CARDS
    bin: core
    reason: Applies to every reply and card body; the chat audit tracks the bare-filename slip.
    audits: [chat-reference-card-as-link, links-always-box-root]
  - id: about-cards.link-fields
    rule: Link-shaped frontmatter uses `ref` for internal and `href` for external targets, inside an object whose sibling fields explain the relation; `retrieved` is date-only ISO.
    handle: ABOUT_CARDS
    bin: indirect
    reason: Bites only when designing a field for a schema or view. Moved to the doc on refs and sources, whose read-when now names link-shaped fields.
    audits: [link-fields-external-href-envelope, link-fields-internal-ref]
    mechanics: box-docs/provenance.md
  - id: about-cards.no-git-metadata
    rule: No `created` or `modified` in frontmatter; Git tracks both.
    handle: ABOUT_CARDS
    bin: delete
    reason: The validator warns on a frontmatter key the type's schema does not declare, which is the substitute; and memo declares `created`, so the blanket rule was wrong for it. The draft had this core.
    audits: [memo-yaml-format]
  - id: about-cards.status-type-specific
    rule: "`status:` values are type-specific; check the type's schema."
    handle: ABOUT_CARDS
    bin: delete
    reason: The type's doc lists its fields and their values, and the card rule loads when the card is in play.
    audits: [find-schema-fields]
  - id: about-cards.not-xml
    rule: Cards are not XML.
    handle: ABOUT_CARDS
    bin: delete
    reason: History; the shape sentence says what a card is. bbx-commands.md's `bbx answer` entry, the last surface that said XML, was corrected against the command.
    audits: [memo-xml-structure]
  - id: about-cards.attachments
    rule: Files a card references live in a sibling `<basename>.attach/` directory, referenced from the body as `attach/…`; create the directory yourself.
    handle: ABOUT_CARDS
    bin: core
    reason: Any card that carries a file; an agent without it puts files in a top-level directory or links them with a relative path.
    audits: [attach-sibling-directory, doc-with-image-attach-scope]
  - id: about-cards.create-with-template
    rule: Prefer `bbx create <path> -t <template>` over writing frontmatter by hand.
    handle: ABOUT_CARDS
    bin: core
    reason: The default way to make a card; the template gets the required fields right.
    audits: [create-question-card]
  - id: about-cards.template-list
    rule: The list of every registered template, one `bbx create` line each.
    handle: ABOUT_CARDS
    bin: delete
    reason: Derivable. `bbx create --list-templates` lists every template the box can use, its own included, and bbx-commands.md lists the built-in ones with their arguments. Replaces the generated `{{create_examples}}` list and its filler.
    audits: [create-question-card]
  - id: about-cards.create-json-two-step
    rule: Array or structured values on the `bbx create` line are JSON; for a complex card, create a minimal one and then edit it.
    handle: ABOUT_CARDS
    bin: indirect
    reason: Usage detail of one command, needed only when passing an array on the command line.
    audits: [create-array-value-json]
    mechanics: box-docs/bbx-commands.md
  - id: about-cards.mv-rm
    rule: Move and delete box content with `bbx mv` / `bbx rm`, never `git mv`, `mv`, `git rm`, or `rm`; `bbx mv` rewrites inbound references and `bbx rm` routes to trash.
    handle: ABOUT_CARDS
    bin: core
    reason: The raw tools succeed silently while breaking every inbound ref or destroying content, so nothing corrects the agent afterward.
    audits: [move-store-content-uses-bbx-mv, move-card-syntax]
  - id: about-cards.validation
    rule: Cards validate on load; a warning after an edit says what to fix, and a commit that includes an invalid card is rejected.
    handle: ABOUT_CARDS
    bin: core
    reason: Every edit; it tells the agent a warning is its to fix now, not noise.
    audits: [validate-card]
  - id: about-cards.validation-warnings
    rule: The catalogue of validation warnings and what each means.
    handle: ABOUT_CARDS
    bin: delete
    reason: Each warning's own text says what is wrong and how to fix it.
    audits: [validate-card]

  # --- COMMANDS ---
  - id: commands.reference
    rule: Card operations are in ABOUT_CARDS; the full `bbx` reference, every flag included, is box-docs/bbx-commands.md.
    handle: COMMANDS
    bin: core
    reason: The section's pointer line; it tells an agent that the short list is not the whole surface and where the rest is.
    audits: [list-bbx-commands]
    mechanics: box-docs/bbx-commands.md
  - id: commands.force-wakeup
    rule: "`bbx force-wakeup [--connector <name>]` runs a real wakeup on the server now and reports what each connector did; it is the only way to answer \"did it sync?\" now."
    handle: COMMANDS
    bin: core
    reason: The everyday sync question, and the obvious alternative (`bbx engine wakeup` from the agent's shell) silently syncs nothing and reports "nothing new".
    audits: [bbx-surface-force-wakeup]
  - id: commands.session
    rule: "`bbx session` reads a past session's transcript (chats, wakeups, job runs)."
    handle: COMMANDS
    bin: core
    reason: Nothing else tells an agent the command exists, and without it an agent hunts JSONL files under ~/.claude. The draft had the whole bullet indirect; the existence stays core, the flags moved.
    audits: [bbx-session-exists, review-previous-chat-session]
  - id: commands.session-flags
    rule: "`bbx session` flags (`--list`, `--latest`, `--dialogue-only`, `--tool-report`, `--since`), and reading a large transcript through a subagent."
    handle: COMMANDS
    bin: indirect
    reason: Usage detail of one command, and `bbx session --help` shows the flags too; bbx-commands.md had no entry, so one was added.
    audits: [bbx-session-how-to-use]
    mechanics: box-docs/bbx-commands.md
  - id: commands.self-note
    rule: From a scheduled run, `bbx chat self-note "<body>"` leaves the boxholder a record in the live chat session that chat does not answer.
    handle: COMMANDS
    bin: core
    reason: Scheduled sub-agents load the guide but not the chat prompt, so the guide is the only place they learn how to report back.
    audits: [bbx-chat-self-note-exists]
  - id: commands.chat-family
    rule: "`bbx chat screenshot`, `whats-changed`, `retranscribe`, and `ask-about-audio`, and when each applies."
    handle: COMMANDS
    bin: delete
    reason: They work only in a live chat session, and the chat system prompt, loaded there, states each with when to use it; bbx-commands.md has the rest. The draft had this indirect.
    audits: [chat-screenshot-when, chat-last-audio-when]
  - id: commands.seen-note
    rule: "While processing a chat-thread card, a note to yourself goes in the `text:` of the `kind: seen` entry you append, not in `bbx chat self-note`."
    handle: COMMANDS
    bin: indirect
    reason: Applies only to chat-thread processing, and the chat-thread card rule already shows the `text:` note; nothing moved.
    audits: [chat-thread-seen-note]
    mechanics: card-chat-thread rule
  - id: commands.health
    rule: "`bbx health` is the agent's to run; `inconclusive` means the check reached no verdict, not that the work failed, so the work is not redone."
    handle: COMMANDS
    bin: indirect
    reason: Needed only when reading scheduled-task health. The guide keeps a one-line pointer so the command is not mistaken for an operator verb; the inconclusive rule moved.
    audits: [health-inconclusive-meaning]
    mechanics: box-docs/bbx-commands.md
  - id: commands.finish
    rule: "`bbx finish <job-file>` is the required closing step of a job: it deletes the job card and commits."
    handle: COMMANDS
    bin: indirect
    reason: Applies only while processing a job, and the reactor prompt and each job type's card rule already say it where the job runs; nothing moved.
    audits: [chat-job-processing]
    mechanics: the reactor prompt (src/core/reactor/prompts.ts) and each job type's card rule
  - id: commands.calendar
    rule: "`bbx calendar [timespan]` lists upcoming events (default 7d; also today, 3d, 2w, 1m)."
    handle: COMMANDS
    bin: core
    reason: Binned indirect first (the calendar skill and bbx-commands.md carry it), but with the line gone the calendar-upcoming-events audit read the .ics files by hand instead, so the line is back. "What's on my calendar" is an everyday ask that does not look like calendar work until the agent is in it.
    audits: [calendar-upcoming-events]
    mechanics: calendar skill
  - id: commands.feedback-skill
    rule: When Bee Box itself behaves confusingly, use the `beebox-system-feedback` skill and record a `.doc.card` in `_config/feedback/`.
    handle: COMMANDS
    bin: delete
    reason: The skill's description, loaded on every turn, says when to use it and what not to use it for, and its body says where the record goes.
    audits: [agent-feedback-skill-opportunity, beebox-system-feedback-boundary]
  - id: commands.search-pointer
    rule: "`bbx search` over `grep` for finding cards by content."
    handle: COMMANDS
    bin: delete
    reason: SEARCHING states it in full.
    audits: [search-over-grep]
  - id: commands.procedure-run
    rule: "`bbx procedure run <name-or-path>` runs a procedure."
    handle: COMMANDS
    bin: delete
    reason: PROCEDURES states it beside the list of this box's procedures.
    audits: [procedure-in-job]
  - id: commands.system-run
    rule: "`bbx engine wakeup`, `bbx reactor`, and `bbx finalize` are run by the system, not the agent."
    handle: COMMANDS
    bin: delete
    reason: The agent recognizes them from git log trailers and bbx-commands.md; the `bbx engine` sentence and the force-wakeup line cover the boundary that matters.
    audits: [bbx-surface-force-wakeup, outbound-notifications]
  - id: commands.engine-not-yours
    rule: Anything under `bbx engine` is an operator or machine command; ask the boxholder instead of running one.
    handle: COMMANDS
    bin: core
    reason: An agent asked to fix a server or sync reaches for these, and several refuse an agent session or do the wrong thing from its shell.
    audits: [bbx-surface-engine-boundary]

  # --- INTAKE ---
  - id: intake.arrival
    rule: Items arrive on their own through the capture UI, connectors, chat, and the Clerk extension, into `_content/inbox/` with job cards in `_bookkeeping/jobs/`; an agent creates and moves cards only as part of its own work.
    handle: INTAKE
    bin: core
    reason: An agent asked where something came from, or how a user adds something, needs the channels; one paragraph carries them, and the per-channel mechanics live on each card type.
    audits: [how-items-enter, user-adds-item, wakeup-intake-flow]
  - id: intake.users-do-not-place-files
    rule: Never tell users to put or place files in directories; they use the web UI, chat, or external services.
    handle: INTAKE
    bin: core
    reason: A reply-shaping rule that bites on any turn where the user asks how to add something, and the trick-question audit shows the temptation.
    audits: [dont-tell-user-to-place-files]
  - id: intake.jobs-vs-triage
    rule: A job (a reactor work order in `_bookkeeping/jobs/`) is not a triaged item (an inbox item routed to a category); the intake → triage → handle pipeline runs only when invoked directly.
    handle: INTAKE
    bin: indirect
    reason: Matters only when working the inbox pipeline or the reactor; moved verbatim to triage.md, whose read-when now names the distinction.
    audits: [triage-vs-reactor-flow, triage-pipeline-stages]
    mechanics: box-docs/triage.md
  - id: intake.capture-detail
    rule: The capture pipeline (preparation worker, timeline, the `<capture>` message, `bbx scan-import` batches landing in the inbox).
    handle: INTAKE
    bin: indirect
    reason: Needed only when handling a capture; card-capture-session.md and the chat prompt already stated every fact, so nothing moved.
    audits: [capture-message-meaning]
    mechanics: box-docs/card-capture-session.md
  - id: intake.clerk-detail
    rule: The Clerk extension's webpage card shape, its commentary card, "Save page", and where a capture lands.
    handle: INTAKE
    bin: indirect
    reason: Needed only when handling a captured page. The webpage card rule already had the shape; the "Save page" and landing sentences moved to it.
    audits: [webpage-vs-commentary]
    mechanics: box-docs/card-webpage.md
  - id: intake.connector-detail
    rule: Working with what connectors sync is the drive, calendar, and email skills; each connector's shape is in connectors.md.
    handle: INTAKE
    bin: delete
    reason: The three skills' descriptions, loaded on every turn, say when to use them, and the box-docs index line for connectors.md says when to read it.
    audits: [drive-mount-folder]
  - id: intake.bbx-create
    rule: "`bbx create` creates cards from templates when the agent needs one."
    handle: INTAKE
    bin: delete
    reason: ABOUT_CARDS states it; the arrival paragraph keeps the clause that the agent creates cards only for its own work.
    audits: [create-question-card]

