<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Static study of a paper card stack with a context tab</title>
  <desc id="desc">A blue paper card labeled A possible card stack sits over two offset cards titled One note, three stocks and Quotes and attribution. A Project notes tab rises from its top edge. A caption says the placement is authored and does not imply automatic relatedness.</desc>
  <defs>
    <filter id="raised" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#493c28" flood-opacity=".14"/>
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#493c28" flood-opacity=".12"/>
    </filter>
    <filter id="tucked" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#493c28" flood-opacity=".14"/>
    </filter>
    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r=".65" fill="#675b4d" opacity=".10"/>
      <circle cx="24" cy="17" r=".55" fill="#675b4d" opacity=".08"/>
      <path d="M8 29h9M28 5h4" stroke="#fff" stroke-opacity=".35" stroke-width=".7"/>
    </pattern>
  </defs>

  <rect width="960" height="600" fill="#ece8df"/>
  <text x="480" y="34" text-anchor="middle" fill="#625e58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="1.8">STATIC COMPOSITION STUDY</text>

  <g filter="url(#tucked)">
    <rect x="92" y="170" width="446" height="350" rx="8" fill="#ecdbb1" stroke="#c9b58b"/>
    <rect x="92" y="170" width="446" height="350" rx="8" fill="url(#grain)" opacity=".45"/>
    <text x="122" y="494" fill="#3d3221" font-family="Georgia, serif" font-size="18" font-weight="600">One note, three stocks</text>
    <path d="M122 503 Q210 499 320 503" fill="none" stroke="#344f77" stroke-width="1.7"/>
  </g>

  <g filter="url(#tucked)">
    <rect x="430" y="170" width="430" height="350" rx="8" fill="#f5efe2" stroke="#d6c8af"/>
    <rect x="430" y="170" width="430" height="350" rx="8" fill="url(#grain)" opacity=".42"/>
    <text x="548" y="494" fill="#332e27" font-family="Georgia, serif" font-size="18" font-weight="600">Quotes and attribution</text>
    <path d="M548 503 Q655 499 800 504" fill="none" stroke="#344f77" stroke-width="1.7"/>
  </g>

  <g filter="url(#raised)">
    <path d="M232 72v-28c0-10 8-18 18-18h146c10 0 18 8 18 18v28" fill="#ccdbe4" stroke="#b6cbd5"/>
    <text x="323" y="55" text-anchor="middle" fill="#344f77" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Project notes</text>
    <rect x="158" y="70" width="646" height="386" rx="12" fill="#e0e9ee" stroke="#b6cbd5"/>
    <rect x="158" y="70" width="646" height="386" rx="12" fill="url(#grain)" opacity=".32"/>
  </g>

  <text x="214" y="137" fill="#263a44" font-family="Georgia, serif" font-size="31" font-weight="600">A possible card stack</text>
  <path d="M214 153 Q330 149 447 154 T690 151" fill="none" stroke="#344f77" stroke-width="2"/>
  <text x="214" y="201" fill="#4d626e" font-family="Georgia, serif" font-size="19">The tab names a context chosen by the author.</text>
  <text x="214" y="237" fill="#263a44" font-family="Georgia, serif" font-size="19">The two cards below stay partly visible, so their titles</text>
  <text x="214" y="267" fill="#263a44" font-family="Georgia, serif" font-size="19">can suggest where the reader might go next.</text>

  <g transform="translate(214 308)">
    <rect width="520" height="92" rx="3" fill="#f0f5f6" filter="url(#tucked)"/>
    <text x="26" y="38" fill="#263a44" font-family="Georgia, serif" font-size="18" font-style="italic">“Placement can carry meaning, once that meaning is chosen.”</text>
    <text x="494" y="68" text-anchor="end" fill="#4d626e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">— composition note</text>
  </g>

  <text x="480" y="574" text-anchor="middle" fill="#625e58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Authored placement · no automatic related-card algorithm</text>
</svg>
