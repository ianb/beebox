<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr7" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- frontends -->
  <g font-size="13" font-weight="600" fill="#1f2933">
    <rect x="30" y="20" width="200" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="130" y="42" text-anchor="middle">Claude Code hooks</text>
    <text x="130" y="58" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">~15-line adapters</text>

    <rect x="260" y="20" width="200" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="360" y="42" text-anchor="middle">Codex launcher</text>
    <text x="360" y="58" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">calls the CLI directly</text>

    <rect x="490" y="20" width="200" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="590" y="42" text-anchor="middle">web dashboard buttons</text>
    <text x="590" y="58" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">focus · resume · close</text>
  </g>

  <!-- CLI -->
  <rect x="140" y="110" width="440" height="52" rx="8" fill="#fff" stroke="#1f2933" stroke-width="2.5"/>
  <text x="360" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">bin/workstreams</text>
  <text x="360" y="151" text-anchor="middle" font-size="11" fill="#6b7280">create · remove · list · sweep · resume — one implementation, all the guards</text>

  <!-- substrate -->
  <rect x="180" y="196" width="360" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="221" text-anchor="middle" font-size="12" fill="#64748b">git worktrees · test-box clones · the router</text>

  <!-- arrows -->
  <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arr7)">
    <path d="M130 66 C 160 90, 200 100, 250 108"/>
    <path d="M360 66 L 360 106"/>
    <path d="M590 66 C 560 90, 520 100, 470 108"/>
  </g>
  <path d="M360 162 L 360 192" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr7g)"/>
  <defs>
    <marker id="arr7g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
