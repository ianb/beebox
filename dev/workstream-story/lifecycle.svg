<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="-apple-system, 'Segoe UI', sans-serif">
  <!-- workstream bar -->
  <text x="20" y="48" font-size="13" font-weight="600" fill="#1f2933">workstream</text>
  <text x="20" y="64" font-size="11" fill="#6b7280">(durable)</text>
  <rect x="130" y="38" width="560" height="30" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="58" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="600">name · conversation · plan · issues — never deleted</text>

  <!-- worktree segments -->
  <text x="20" y="128" font-size="13" font-weight="600" fill="#1f2933">worktree</text>
  <text x="20" y="144" font-size="11" fill="#6b7280">(disposable)</text>

  <rect x="130" y="112" width="190" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="225" y="132" text-anchor="middle" font-size="12" fill="#166534">checkout #1 (building)</text>

  <rect x="470" y="112" width="150" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="545" y="132" text-anchor="middle" font-size="12" fill="#166534">checkout #2</text>

  <!-- gap annotation -->
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" fill="none">
    <path d="M330 127 L 460 127"/>
  </g>
  <text x="395" y="118" text-anchor="middle" font-size="11" fill="#94a3b8">no checkout at all</text>

  <!-- events -->
  <g font-size="12" fill="#1f2933">
    <g>
      <line x1="320" y1="142" x2="320" y2="180" stroke="#d97706" stroke-width="2"/>
      <text x="320" y="198" text-anchor="middle" fill="#d97706" font-weight="600">culled ✂️</text>
      <text x="320" y="214" text-anchor="middle" font-size="11" fill="#6b7280">merged + clean + no agent</text>
    </g>
    <g>
      <line x1="470" y1="142" x2="470" y2="180" stroke="#16a34a" stroke-width="2"/>
      <text x="500" y="198" text-anchor="middle" fill="#16a34a" font-weight="600">resume ▶</text>
      <text x="510" y="214" text-anchor="middle" font-size="11" fill="#6b7280">recreated + "what landed since"</text>
    </g>
  </g>
</svg>
