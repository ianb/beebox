<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- question diamond -->
  <polygon points="170,95 300,35 430,95 300,155" fill="#fff" stroke="#1f2933" stroke-width="2"/>
  <text x="300" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">is an agent still</text>
  <text x="300" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">working in there?</text>

  <!-- outcomes -->
  <g font-size="13" font-weight="600">
    <rect x="510" y="20" width="180" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="600" y="47" text-anchor="middle" fill="#dc2626">no → delete 🗑</text>

    <rect x="510" y="80" width="180" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="600" y="107" text-anchor="middle" fill="#16a34a">yes → keep</text>

    <rect x="510" y="140" width="180" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="600" y="161" text-anchor="middle" fill="#16a34a">can't tell → keep</text>
    <text x="600" y="177" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">(the whole trick)</text>
  </g>

  <!-- arrows -->
  <g stroke="#1f2933" stroke-width="2" fill="none" marker-end="url(#arr6)">
    <path d="M430 95 C 460 70, 470 50, 506 42"/>
    <path d="M430 95 L 506 100"/>
    <path d="M400 120 C 440 145, 460 155, 506 160"/>
  </g>

  <g font-size="12" fill="#6b7280">
    <text x="20" y="60">deleted = gone forever</text>
    <text x="20" y="80">lingering = costs the</text>
    <text x="20" y="96">next sweep a few seconds</text>
    <text x="20" y="128" font-weight="600" fill="#1f2933">so the tie always</text>
    <text x="20" y="144" font-weight="600" fill="#1f2933">breaks toward "keep"</text>
  </g>
</svg>
