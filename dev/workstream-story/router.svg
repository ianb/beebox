<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="-apple-system, 'Segoe UI', sans-serif">
  <!-- browser -->
  <rect x="20" y="95" width="130" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="85" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">browser</text>
  <text x="85" y="145" text-anchor="middle" font-size="11" fill="#6b7280">localhost:3210</text>

  <!-- router -->
  <rect x="230" y="85" width="150" height="90" rx="8" fill="#fff" stroke="#1f2933" stroke-width="2"/>
  <text x="305" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">one router</text>
  <text x="305" y="138" text-anchor="middle" font-size="11" fill="#6b7280">routes by URL prefix</text>
  <text x="305" y="156" text-anchor="middle" font-size="11" fill="#6b7280">lazy start · idle stop</text>

  <!-- worktrees -->
  <g>
    <rect x="500" y="20" width="190" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="515" y="42" font-size="13" font-weight="600" fill="#1f2933">/main/…</text>
    <text x="515" y="60" font-size="11" fill="#6b7280">the main checkout</text>

    <rect x="500" y="88" width="190" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="515" y="110" font-size="13" font-weight="600" fill="#1f2933">/importer/…</text>
    <text x="515" y="128" font-size="11" fill="#6b7280">worktree + its own test box</text>

    <rect x="500" y="156" width="190" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="515" y="178" font-size="13" font-weight="600" fill="#64748b">/search-tuning/…</text>
    <text x="515" y="196" font-size="11" fill="#94a3b8">asleep (idle 5 min) — wakes on request</text>
  </g>

  <!-- arrows -->
  <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arr2)">
    <path d="M150 130 L 226 130"/>
    <path d="M380 105 C 430 90, 450 60, 496 48"/>
    <path d="M380 125 L 496 116"/>
    <path d="M380 150 C 430 162, 450 172, 496 180"/>
  </g>
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
