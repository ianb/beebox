<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The journey pipeline">
<title>The journey pipeline</title>
<rect x="0" y="0" width="960" height="300" fill="#ffffff" />
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b7280"/></marker><marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2a78d6"/></marker></defs><text x="24" y="34" font-size="18" fill="#1f2933" text-anchor="start" font-weight="600">The pipeline: seven steps, five of them in git</text><rect x="24" y="70" width="121.71428571428571" height="64" fill="#e8eef7" rx="6" stroke="#2a78d6" stroke-width="1.5"/><text x="84.85714285714286" y="96" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">Define</text><text x="84.85714285714286" y="116" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="400">in git</text><path d="M146.71428571428572 102 L154.71428571428572 102" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/><text x="84.85714285714286" y="156" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">the person, the</text><text x="84.85714285714286" y="172" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">box, watch_for</text><rect x="155.71428571428572" y="70" width="121.71428571428571" height="64" fill="#e8eef7" rx="6" stroke="#2a78d6" stroke-width="1.5"/><text x="216.57142857142858" y="96" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">Prepare</text><text x="216.57142857142858" y="116" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="400">in git</text><path d="M278.42857142857144 102 L286.42857142857144 102" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/><text x="216.57142857142858" y="156" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">fresh box, prompt,</text><text x="216.57142857142858" y="172" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">snapshot</text><rect x="287.42857142857144" y="70" width="121.71428571428571" height="64" fill="#ffffff" rx="6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/><text x="348.2857142857143" y="96" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">Walk</text><text x="348.2857142857143" y="116" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">gitignored</text><path d="M410.14285714285717 102 L418.14285714285717 102" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/><text x="348.2857142857143" y="156" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">an agent plays</text><text x="348.2857142857143" y="172" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">the person</text><rect x="419.14285714285717" y="70" width="121.71428571428571" height="64" fill="#ffffff" rx="6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/><text x="480" y="96" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">Collect</text><text x="480" y="116" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">gitignored</text><path d="M541.8571428571429 102 L549.8571428571429 102" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/><text x="480" y="156" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">box commits, shot</text><text x="480" y="172" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">clock</text><rect x="550.8571428571429" y="70" width="121.71428571428571" height="64" fill="#e8eef7" rx="6" stroke="#2a78d6" stroke-width="1.5"/><text x="611.7142857142858" y="96" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">After-action</text><text x="611.7142857142858" y="116" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="400">in git</text><path d="M673.5714285714286 102 L681.5714285714286 102" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/><text x="611.7142857142858" y="156" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">one row per claim,</text><text x="611.7142857142858" y="172" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">four buckets</text><rect x="682.5714285714287" y="70" width="121.71428571428571" height="64" fill="#e8eef7" rx="6" stroke="#2a78d6" stroke-width="1.5"/><text x="743.4285714285716" y="96" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">Report</text><text x="743.4285714285716" y="116" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="400">in git</text><path d="M805.2857142857143 102 L813.2857142857143 102" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/><text x="743.4285714285716" y="156" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">the only durable</text><text x="743.4285714285716" y="172" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">record</text><rect x="814.2857142857143" y="70" width="121.71428571428571" height="64" fill="#e8eef7" rx="6" stroke="#2a78d6" stroke-width="1.5"/><text x="875.1428571428572" y="96" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">Issues</text><text x="875.1428571428572" y="116" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="400">in git</text><text x="875.1428571428572" y="156" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">filed, corrected,</text><text x="875.1428571428572" y="172" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">re-met</text><text x="24" y="210" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400">Nothing from a walk becomes a finding until it has been separately verified.</text><text x="24" y="230" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">The walker's job is to notice. The reader's is to find out what actually happened.</text><path d="M875.1428571428572 180 C 875.1428571428572 275, 348.2857142857143 275, 348.2857142857143 180" fill="none" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrb)"/><text x="611.7142857142858" y="262" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="400">the next round's walk re-checks every open issue it meets</text>
</svg>
