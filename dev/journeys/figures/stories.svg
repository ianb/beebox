<text x="24" y="34" font-size="18" fill="#1f2933" text-anchor="start" font-weight="600">Five issues, whole life</text><line x1="377.54716981132077" y1="56" x2="377.54716981132077" y2="260" stroke="#d9dde3" stroke-width="1" /><text x="377.54716981132077" y="50" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">08/25</text><line x1="458.11320754716985" y1="56" x2="458.11320754716985" y2="260" stroke="#d9dde3" stroke-width="1" /><text x="458.11320754716985" y="50" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">09/01</text><line x1="619.2452830188679" y1="56" x2="619.2452830188679" y2="260" stroke="#d9dde3" stroke-width="1" /><text x="619.2452830188679" y="50" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">09/15</text><line x1="803.3962264150944" y1="56" x2="803.3962264150944" y2="260" stroke="#d9dde3" stroke-width="1" /><text x="803.3962264150944" y="50" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">10/01</text><line x1="883.9622641509434" y1="56" x2="883.9622641509434" y2="260" stroke="#d9dde3" stroke-width="1" /><text x="883.9622641509434" y="50" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">10/08</text><text x="308" y="84" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="400">plate header prints a scope glob</text><line x1="883.9622641509434" y1="80" x2="895.4716981132076" y2="80" stroke="#2a78d6" stroke-width="2" /><circle cx="883.9622641509434" cy="80" r="5" fill="#2a78d6" /><rect x="878.9622641509434" y="75" width="10" height="10" fill="#1baf7a" rx="2"/><path d="M890.4716981132076 80 l3.5 3.5 l6 -7" fill="none" stroke="#1baf7a" stroke-width="2.2"/><text x="308" y="124" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="400">document metadata displaces the reading view</text><line x1="688.3018867924528" y1="120" x2="883.9622641509434" y2="120" stroke="#2a78d6" stroke-width="2" /><circle cx="688.3018867924528" cy="120" r="5" fill="#2a78d6" /><circle cx="688.3018867924528" cy="120" r="5" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><rect x="855.9433962264151" y="115" width="10" height="10" fill="#1baf7a" rx="2"/><path d="M878.9622641509434 120 l3.5 3.5 l6 -7" fill="none" stroke="#1baf7a" stroke-width="2.2"/><text x="308" y="164" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="400">tutor teaches a neutral-isotope rule</text><line x1="688.3018867924528" y1="160" x2="895.4716981132076" y2="160" stroke="#2a78d6" stroke-width="2" /><circle cx="688.3018867924528" cy="160" r="5" fill="#2a78d6" /><rect x="717.8301886792453" y="155" width="10" height="10" fill="#9fd9c3" rx="2"/><path d="M878.9622641509434 160 l3.5 3.5 l6 -7" fill="none" stroke="#1baf7a" stroke-width="2.2"/><path d="M890.4716981132076 160 l3.5 3.5 l6 -7" fill="none" stroke="#1baf7a" stroke-width="2.2"/><text x="308" y="204" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="400">chats bind to a landmark once and never move</text><line x1="377.54716981132077" y1="200" x2="906.9811320754717" y2="200" stroke="#d03b3b" stroke-width="2" stroke-dasharray="4 3"/><circle cx="377.54716981132077" cy="200" r="5" fill="#2a78d6" /><circle cx="688.3018867924528" cy="200" r="5" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><circle cx="883.9622641509434" cy="200" r="5" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><circle cx="895.4716981132076" cy="200" r="5" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="914.9811320754717" y="204" font-size="11" fill="#d03b3b" text-anchor="start" font-weight="600">open</text><text x="308" y="244" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="400">fresh-chat reservation suppresses openers</text><line x1="688.3018867924528" y1="240" x2="895.4716981132076" y2="240" stroke="#2a78d6" stroke-width="2" /><circle cx="688.3018867924528" cy="240" r="5" fill="#2a78d6" /><circle cx="883.9622641509434" cy="240" r="5" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><rect x="878.9622641509434" y="235" width="10" height="10" fill="#1baf7a" rx="2"/><path d="M890.4716981132076 240 l3.5 3.5 l6 -7" fill="none" stroke="#1baf7a" stroke-width="2.2"/><circle cx="29" cy="284" r="5" fill="#2a78d6" /><text x="40" y="288" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">filed</text><circle cx="96" cy="284" r="5" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="107" y="288" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">re-encountered by a later walk</text><rect x="323" y="279" width="10" height="10" fill="#1baf7a" rx="2"/><text x="339" y="288" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">closed</text><rect x="396.6" y="279" width="10" height="10" fill="#9fd9c3" rx="2"/><text x="412.6" y="288" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">won't fix</text><path d="M490 284 l3.5 3.5 l6 -7" fill="none" stroke="#1baf7a" stroke-width="2.2"/><text x="506" y="288" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">next walk confirmed</text><text x="24" y="314" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="400">The openers issue was re-encountered by all six Oct 8 walks on their first screenshot, closed that day, and confirmed by all six Oct 9 walks.</text><text x="24" y="332" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="400">The landmark-binding issue has been hit by three walks over 46 days and waits on a decision between three options.</text>
