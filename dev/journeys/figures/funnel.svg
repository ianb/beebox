<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Claim-to-issue funnel">
<title>Claim-to-issue funnel</title>
<rect x="0" y="0" width="960" height="360" fill="#ffffff" />
<text x="24" y="34" font-size="18" fill="#1f2933" text-anchor="start" font-weight="600">From 1,321 claim rows to 98 issues to 47 fixes</text><text x="24" y="60" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="400">Claim rows, 17 walks with tables: 1,321</text><rect x="24" y="70" width="727.7380772142317" height="36" fill="#2a78d6" rx="3"/><text x="32" y="93" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="400">product 1,057</text><rect x="753.7380772142317" y="70" width="67.03860711582135" height="36" fill="#eb6834" rx="3"/><rect x="822.7766843300531" y="70" width="49.0885692657078" height="36" fill="#9bbbe6" rx="3"/><rect x="873.8652535957608" y="70" width="15.950037850113553" height="36" fill="#c7cdd6" rx="3"/><rect x="891.8152914458743" y="70" width="42.18470855412566" height="36" fill="#e1e5ea" rx="3"/><text x="936" y="122" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400">harness 100 · wishes 74 · unverified 26 · other 64</text><path d="M24 130 L936 130 L429.9470098410295 170 L24 170 Z" fill="#e8eef7" opacity="0.7"/><text x="936" y="162" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400">one issue per 13 rows; issues drawn at 6× so the bar can be read</text><text x="24" y="160" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="400">Issues filed: 98</text><rect x="24" y="170" width="192.6888720666162" height="36" fill="#1baf7a" rx="3"/><text x="32" y="193" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="400">fixed 47</text><rect x="218.6888720666162" y="170" width="10.426949280847841" height="36" fill="#9fd9c3" rx="3"/><rect x="231.11582134746405" y="170" width="31.138531415594244" height="36" fill="#d03b3b" rx="3"/><rect x="264.2543527630583" y="170" width="39.42316426949281" height="36" fill="#c7cdd6" rx="3"/><rect x="305.6775170325511" y="170" width="6.284632853898561" height="36" fill="#eb6834" rx="3"/><rect x="313.9621498864497" y="170" width="113.98485995457986" height="36" fill="#e1e5ea" rx="3"/><text x="321.9621498864497" y="193" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="400">untouched 28</text><text x="24" y="224" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">won't fix 3 · needs a human 8 · deferred 10 · harness 2 · untouched 28</text><text x="24" y="270" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400">100 rows were the instrument, not the product. The pilot's ratio was 4 of 11.</text><text x="24" y="292" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400">33 of the 50 closes happened the same day, by the walk's own workstream. The other 17 took a median of 6 days.</text><text x="24" y="314" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400">Feature wishes: 7 filed, 0 closed. Decisions: 3 filed, 0 closed. No journey issue has ever used the manual-testing gate.</text>
</svg>
