<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445" width="960" height="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Recurring frictions by round">
<title>Recurring frictions by round</title>
<rect x="0" y="0" width="960" height="445" fill="#ffffff" />
<text x="24" y="34" font-size="18" fill="#1f2933" text-anchor="start" font-weight="600">What keeps coming back: frictions by round</text><text x="440" y="64" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Aug 23–25</text><text x="560" y="64" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Sep 20–21</text><text x="680" y="64" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Oct 8</text><text x="800" y="64" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Oct 9</text><text x="368" y="99" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="400">First screen says nothing; no openers</text><circle cx="440" cy="94" r="8" fill="#2a78d6" /><circle cx="560" cy="94" r="8" fill="#2a78d6" /><circle cx="680" cy="94" r="8" fill="#2a78d6" /><circle cx="800" cy="94" r="8" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/><path d="M800 86 A8 8 0 0 1 800 102 Z" fill="#1baf7a"/><text x="368" y="129" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="400">No front door to the collection</text><circle cx="440" cy="124" r="8" fill="#2a78d6" /><circle cx="680" cy="124" r="8" fill="#2a78d6" /><circle cx="800" cy="124" r="8" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/><path d="M800 116 A8 8 0 0 1 800 132 Z" fill="#1baf7a"/><text x="368" y="159" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="400">Activity rows speak in commands and files</text><circle cx="680" cy="154" r="8" fill="#2a78d6" /><circle cx="800" cy="154" r="8" fill="#2a78d6" /><text x="368" y="189" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="400">Agent promises delivery it cannot make</text><circle cx="560" cy="184" r="8" fill="#2a78d6" /><circle cx="680" cy="184" r="8" fill="#2a78d6" /><circle cx="800" cy="184" r="8" fill="#2a78d6" /><text x="368" y="219" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="400">Implementation vocabulary on screen</text><circle cx="440" cy="214" r="8" fill="#2a78d6" /><circle cx="560" cy="214" r="8" fill="#2a78d6" /><circle cx="680" cy="214" r="8" fill="#2a78d6" /><circle cx="800" cy="214" r="8" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/><path d="M800 206 A8 8 0 0 1 800 222 Z" fill="#1baf7a"/><text x="368" y="249" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="400">Plate badge opens Browse, hides the chat</text><circle cx="560" cy="244" r="8" fill="#2a78d6" /><circle cx="680" cy="244" r="8" fill="#2a78d6" /><path d="M793 244 l5 5 l9 -10" fill="none" stroke="#1baf7a" stroke-width="2.5"/><text x="368" y="279" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="400">Conversations never get a title</text><circle cx="560" cy="274" r="8" fill="#2a78d6" /><circle cx="680" cy="274" r="8" fill="#2a78d6" /><path d="M793 274 l5 5 l9 -10" fill="none" stroke="#1baf7a" stroke-width="2.5"/><text x="368" y="309" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="400">Chats bind to a landmark once</text><circle cx="440" cy="304" r="8" fill="#2a78d6" /><circle cx="680" cy="304" r="8" fill="#2a78d6" /><circle cx="800" cy="304" r="8" fill="#2a78d6" /><text x="368" y="339" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="400">Structured card fronts hide their facts</text><circle cx="680" cy="334" r="8" fill="#2a78d6" /><circle cx="800" cy="334" r="8" fill="#2a78d6" /><circle cx="34" cy="372" r="8" fill="#2a78d6" /><text x="50" y="376" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">reported</text><circle cx="140" cy="372" r="8" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/><path d="M140 364 A8 8 0 0 1 140 380 Z" fill="#1baf7a"/><text x="156" y="376" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">partly fixed</text><path d="M258 372 l5 5 l9 -10" fill="none" stroke="#1baf7a" stroke-width="2.5"/><text x="282" y="376" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">fixed and confirmed by the next walk</text><text x="24" y="406" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="400">Each round's biggest complaint is fixed before the next; the fix brings a smaller defect in the surface that fixed it.</text><text x="24" y="424" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="400">Oct 9's main defect, a root place page saying &quot;Nothing here yet&quot; beside a box full of cards, was introduced by the work that fixed the openers.</text>
</svg>
