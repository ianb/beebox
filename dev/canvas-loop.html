<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>canvas-loop · SketchFigure demo</title>
<style>/*
 * Figure styles shared by BOTH figure surfaces: the imperative `mountSketch`
 * DOM (src/browser/mount.ts) and the React <SketchFigure> component (src/react/).
 * Shipped as a real stylesheet the consumer imports
 * (`@ianbicking/canvas-loop/browser/figure.css`) rather than a runtime-injected
 * <style> tag, so a host with a strict CSP style-src (no inline styles at
 * runtime) still renders the controls styled — bundlers extract this into
 * their normal CSS pipeline.
 */
.cl-figure { display: inline-flex; flex-direction: column; max-width: 100%; gap: 10px; font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #1e293b; }
.cl-figure * { box-sizing: border-box; }
.cl-canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; outline: none; cursor: default; border-radius: 6px; background: #05070d; }
.cl-canvas:focus { box-shadow: 0 0 0 2px #2563eb; }
.cl-placeholder { border-radius: 6px; background: #0b0e17; }
.cl-toolbar { display: flex; align-items: center; gap: 8px; }
.cl-frame { font-variant-numeric: tabular-nums; color: #64748b; min-width: 72px; }
.cl-btn { background: #eef2ff; color: #1e293b; border: 1px solid #c7d2fe; border-radius: 5px; padding: 3px 10px; cursor: pointer; font: inherit; }
.cl-btn:hover { background: #e0e7ff; }
.cl-params { display: flex; flex-direction: column; gap: 8px; }
.cl-param-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; }
.cl-param-name { color: #475569; overflow-wrap: anywhere; }
.cl-range-holder { display: flex; align-items: center; gap: 8px; }
.cl-range-holder input { flex: 1; }
.cl-param-value { min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: #2563eb; }
.cl-trigger-btn { background: #f3e8ff; color: #6b21a8; border: 1px solid #d8b4fe; border-radius: 5px; padding: 3px 10px; cursor: pointer; font: inherit; }
.cl-muted { color: #94a3b8; font-style: italic; margin: 0; }
.cl-error { max-width: 100%; padding: 6px 10px; border-radius: 6px; border: 1px solid #fca5a5; background: #fef2f2; color: #b91c1c; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.cl-recorder { display: flex; flex-direction: column; gap: 6px; }
.cl-recorder summary { cursor: pointer; color: #2563eb; }
.cl-events { width: 100%; min-width: 260px; background: #05070d; color: #cbd5e1; border: 1px solid #26304a; border-radius: 6px; font: 12px/1.4 ui-monospace, monospace; }
@media (prefers-color-scheme: dark) {
  .cl-figure { color: #e2e8f0; }
  .cl-btn { background: #1e2740; color: #e2e8f0; border-color: #35406a; }
  .cl-btn:hover { background: #27314f; }
  .cl-param-name { color: #cbd5e1; }
  .cl-param-value { color: #93c5fd; }
  .cl-error { border-color: #7f1d1d; background: #2a1414; color: #fca5a5; }
}
.cl-field { width: 6em; font: inherit; padding: 2px 6px; border: 1px solid #c7d2fe; border-radius: 5px; }
.cl-field[aria-invalid="true"] { border-color: #f87171; background: #fef2f2; }
.cl-text { width: 100%; min-width: 8em; font: inherit; padding: 2px 6px; border: 1px solid #c7d2fe; border-radius: 5px; box-sizing: border-box; }
textarea.cl-text { min-height: 3.5em; resize: vertical; }
.cl-overlay-input.cl-text { min-width: 0; resize: none; }
.cl-param-hint { grid-column: 2; color: #64748b; font-size: 12px; }
.cl-stage { position: relative; width: fit-content; max-width: 100%; }
.cl-overlay-input { font: 14px ui-sans-serif, system-ui, sans-serif; }
.cl-overlay-input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
.cl-overlay-input[type="number"]::-webkit-inner-spin-button,
.cl-overlay-input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin: 0; background: #f8fafc; color: #1e293b; font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
.demo { max-width: 760px; margin: 0 auto; padding: 24px 16px 8px; }
.demo-header h1 { font-size: 22px; margin: 0 0 6px; }
.demo-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px 18px; margin: 20px 0; }
.demo-card h2 { font-size: 16px; margin: 0 0 8px; }
.demo-note { color: #475569; font-size: 14px; margin: 6px 0; }
.demo-watch { font-size: 14px; }
code { background: #eef2ff; border-radius: 4px; padding: 1px 5px; font: 12px/1.5 ui-monospace, monospace; }
.demo-link { background: none; border: none; color: #2563eb; cursor: pointer; font: inherit; text-decoration: underline; padding: 0; }
.demo-footer { max-width: 760px; margin: 8px auto 32px; padding: 0 16px; color: #94a3b8; font-size: 12px; }
@media (prefers-color-scheme: dark) {
  body { background: #0b0e17; color: #e2e8f0; }
  .demo-card { background: #10141f; border-color: #202a44; }
  .demo-note { color: #94a3b8; }
  code { background: #1e2740; color: #cbd5e1; }
}
</style>
</head>
<body>
<div id="app"></div>
<footer class="demo-footer">
  Generated file — do not edit by hand. Rebuild with
  <code>pnpm --dir canvas-loop run build:dev-demo</code> (source: canvas-loop/dev-demo/).
</footer>
