<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Size</title>
<!--
  Renders report.markdown with the numbers from data/latest.json.
  - ```dataset <name>``` in report.markdown places a dataset as a table with bars.
  - {{name}} places one number from the snapshot's `values`.
  Refresh the numbers with `pnpm project-size` (bin/project-size.ts).
-->
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<style>
  :root {
    --bg: #fbf8f3; --fg: #2b2620; --muted: #7a6f62; --rule: #e6ddd0;
    --bar: #c9a36b; --bar-bg: #efe6d8; --code-bg: #f1ebe1; --missing: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1a16; --fg: #ece5da; --muted: #a49886; --rule: #3a342c;
      --bar: #c9a36b; --bar-bg: #2e2922; --code-bg: #2a251f; --missing: #f2b8b5;
    }
  }
  body { background: var(--bg); color: var(--fg); margin: 0; font: 16px/1.55 system-ui, -apple-system, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin-bottom: 4px; }
  .stamp { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  h2 { margin-top: 36px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
  code { background: var(--code-bg); padding: 1px 4px; border-radius: 3px; font-size: 0.9em; }
  figure.dataset { margin: 16px 0 24px; overflow-x: auto; }
  figure.dataset figcaption { font-weight: 600; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 4px 8px; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
  th { font-weight: 600; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.bar { width: 40%; min-width: 80px; }
  .bar-track { background: var(--bar-bg); height: 10px; border-radius: 2px; }
  .bar-fill { background: var(--bar); height: 10px; border-radius: 2px; }
  .missing { color: var(--missing); font-weight: 600; }
</style>
</head>
<body>
<main>
  <div id="report">Loading…</div>
</main>
<script>
  const fmt = new Intl.NumberFormat("en-US");
  // Zero reads as a dash; line counts round to the nearest 1,000 (a column's
  // `round`, or any inline value whose name ends in "lines").
  function show(value, round) {
    const n = Number(value) || 0;
    if (n === 0) return "–";
    if (!round) return fmt.format(n);
    const r = Math.round(n / round) * round;
    return r === 0 ? `<${fmt.format(round)}` : fmt.format(r);
  }

  function renderDataset(name, dataset) {
    if (!dataset) return `<p class="missing">No dataset named “${name}” in data/latest.json.</p>`;
    const barKey = dataset.bar;
    const max = barKey ? Math.max(1, ...dataset.rows.map((row) => Number(row[barKey]) || 0)) : 0;
    const head = dataset.columns.map((c) => `<th class="${c.numeric ? "num" : ""}">${c.label}</th>`).join("") + (barKey ? "<th></th>" : "");
    const body = dataset.rows.map((row) => {
      const cells = dataset.columns.map((c) => {
        const v = row[c.key];
        return c.numeric ? `<td class="num">${show(v, c.round)}</td>` : `<td>${String(v ?? "")}</td>`;
      }).join("");
      const bar = barKey ? `<td class="bar"><div class="bar-track"><div class="bar-fill" style="width:${(100 * (Number(row[barKey]) || 0)) / max}%"></div></div></td>` : "";
      return `<tr>${cells}${bar}</tr>`;
    }).join("");
    return `<figure class="dataset"><figcaption>${dataset.title}</figcaption><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></figure>`;
  }

  async function main() {
    const [markdown, data] = await Promise.all([
      fetch("report.markdown", { cache: "no-store" }).then((r) => r.text()),
      fetch("data/latest.json", { cache: "no-store" }).then((r) => r.json()),
    ]);
    const blocks = [];
    const withBlocks = markdown.replace(/^```dataset\s+(\S+)\s*\n```$/gm, (_m, name) => {
      blocks.push(name);
      return `<div data-dataset-slot="${blocks.length - 1}"></div>`;
    });
    const withValues = withBlocks.replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_m, key) =>
      key in data.values ? show(data.values[key], key.endsWith("lines") ? 1000 : 0) : `<span class="missing">{{${key}}}</span>`);
    const report = document.getElementById("report");
    report.innerHTML = marked.parse(withValues);
    report.querySelectorAll("[data-dataset-slot]").forEach((slot) => {
      const name = blocks[Number(slot.getAttribute("data-dataset-slot"))];
      slot.outerHTML = renderDataset(name, data.datasets[name]);
    });
    const h1 = report.querySelector("h1");
    const stamp = document.createElement("div");
    stamp.className = "stamp";
    stamp.textContent = `Numbers from ${data.collectedAt.slice(0, 16).replace("T", " ")} UTC at ${data.commit}. Refresh: pnpm project-size`;
    (h1 ?? report.firstChild)?.after(stamp);
  }

  main().catch((error) => {
    document.getElementById("report").innerHTML = `<p class="missing">Could not load the report: ${error.message}</p>`;
    console.error(error);
  });
</script>
</body>
</html>
