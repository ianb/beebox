audit: >
  Judged by the driving agent from frames and zoomed crops; no independent review yet. A scripted player (the
  events file, generated by playing the game through its own update) wins all four waves at speed 3 (about 6000
  frames to the win screen); a careless player who paints only inkstones loses in wave 1 and gets the lose
  screen with the bitten mochi and the cat awake. The banked events stop at frame 3800, after the first red
  seal lands in wave 3. In the browser (walks-now page) it holds 56-60 frames/s at speed 1 and speed 3 through
  play, the title, and the win and lose screens; short dips to about 56 come when a pose is first recorded.
self-report-summary: >
  Sumi-e with pale colour: the garden scroll (paper fibres, misty hills, red sun, a bristle pine bough and
  bamboo, wash-stroke squares under a wash effect) is one picture; the scroll roller is another, drawn over the
  foes so they step out from behind it. Each pose of each defender and foe is its own kept picture under a wash
  and paper effect, with squash and stretch baked into the poses; splashes, poofs, claw arcs and the seal's
  shockwave are plain shapes drawn from a start time. Game rules are a pure step function, so a script plays
  the game to write the events file.
features-exercised:
  - brushes ink, bristle (dry), wash, pencil, chalk, airbrush with gestures (pressure keyframes, wobble, seed)
  - group effects wash, paper, glow (lanterns, ink drops), shadow (cards, roller), blur
  - paper scope; pictures for board, roller, cards, banners, buttons and one kept picture per pose (about 80 versions)
  - place with opacity for fading stains and banners; blend multiply for the evening tint
  - text with halo, overlay hints, keepInside, wrapped text
  - pointer hit-testing on cards, grid cells and moving ink drops; cursor; keys 1-5 and Escape; u.handled verdicts
  - number, boolean and trigger params (game speed runs several game steps per frame)
  - sound - samples (bell, pop, thud, metal, chop, knock, card, select, error, fall, drop, fanfare, page) and marimba, kalimba and bell notes, rate-limited by tag
  - activity export; sibling -tea helper files; a game state machine as a discriminated union
