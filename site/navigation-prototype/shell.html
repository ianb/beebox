<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reading prototype</title>
<style>
/* APP_THEME_STYLES */
*{box-sizing:border-box}body{margin:0;font-family:"Avenir Next",Avenir,sans-serif}button,a,select{-webkit-tap-highlight-color:transparent}button,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #b26924;outline-offset:4px}header>div{display:flex;align-items:center;gap:12px;padding:10px 18px;min-height:60px}.brand{font-weight:600;color:inherit;text-decoration:none}.bbx-place-pill{border:1px solid;padding:8px 14px;color:inherit;text-decoration:none;border-radius:99px}.experiment{margin-left:auto;font-size:12px;opacity:.85}#workspace{display:grid;grid-template-columns:1fr 1fr;height:calc(100dvh - 106px);max-width:1500px;margin:auto}.pane{min-width:0;overflow:auto;padding:20px 24px 48px;scrollbar-gutter:stable}.pane+.pane{border-left:1px solid #c8c1b7}.pane-label{font-size:12px;display:flex;align-items:center;gap:10px;min-height:40px;margin-bottom:10px;color:#62584c}.pane-label a{color:inherit; padding:8px 0}.pane-label span{margin-left:auto}.bbx-card-surface{min-height:300px}.bbx-card-content{font-size:18px;line-height:1.65}.bbx-card-content p{margin:0 0 1.1em}.bbx-card-content h2{font-size:1.15em;margin:1.65em 0 .6em}.bbx-card-content ul{padding-left:22px}.bbx-card-content li{margin-bottom:.8em}.bbx-card-content a{color:var(--bbx-pen);text-decoration:underline;text-underline-offset:4px}.bbx-card-content p:first-child{font:12px "Avenir Next",sans-serif;color:var(--bbx-ink-soft)}.fold{position:absolute;right:0;top:0;width:44px;height:44px;border-radius:0 8px 0 6px;background:linear-gradient(225deg,var(--bbx-underlay) 49%,var(--bbx-quote-layer-paper) 51%);box-shadow:-2px 2px 3px #493c2825}.address{font:11px/1.5 monospace;overflow-wrap:anywhere;color:#706553;padding:14px 4px}footer{height:46px;padding:9px 18px;display:flex;gap:12px;align-items:center;border-top:1px solid #c8c1b7;font-size:12px;color:#554d43}footer select{font-size:12px}#menu-popover{position:fixed;inset:65px auto auto 18px;margin:0;padding:18px;background:#f5efe2;border:1px solid #d6c8af;border-radius:12px;box-shadow:0 8px 24px #30271940;width:min(310px,calc(100vw - 36px))}#menu-popover a{display:block;color:#2b4264;padding:12px 5px}#menu-popover::backdrop{background:#0002}::view-transition-group(*){animation-duration:330ms}::view-transition-old(root),::view-transition-new(root){animation:none}.single{grid-template-columns:1fr!important;max-width:760px!important}.single .pane+.pane{border:0}@media(max-width:700px){#workspace{display:block;height:calc(100dvh - 106px)}.pane{height:100%;padding:12px 14px 35px}.pane.context{display:none}.pane+.pane{border:0}.bbx-card-content{font-size:17px}.experiment{display:none}header>div{padding:9px 12px}.pane-label{margin-bottom:6px}.address{font-size:10px}footer{font-size:11px;gap:8px}}@media(prefers-reduced-motion:reduce){::view-transition-group(*){animation-duration:0s!important}}
/* Match the app Dropdown / MenuItem surface, independently of card stock. */
#menu-popover{inset:auto;margin:0;padding:4px 0;width:320px;max-width:calc(100vw - 16px);overflow:auto;background:#fff;border:1px solid #f3ebe0;border-radius:8px;box-shadow:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a;color:#2e2720;font:14px/20px ui-sans-serif,system-ui,sans-serif}
#menu-popover::backdrop{background:transparent}#menu-popover a{padding:8px 12px;color:#6b5d4b;text-decoration:none}#menu-popover a:hover{background:#faf7f2}#menu-popover a[aria-current]{background:#f8f2e9;color:#2e2720;font-weight:500}.menu-label{padding:8px 12px 4px;font-size:12px;text-transform:uppercase;color:#b29a7c}.menu-divider{border-top:1px solid #f3ebe0;margin:4px 0}.bbx-place-pill svg{width:12px;height:12px;margin-left:8px;vertical-align:middle}.next-places{border-top:1px solid var(--bbx-edge);margin-top:28px;padding-top:18px;font:14px/1.5 "Avenir Next",Avenir,sans-serif}.next-places .next-label{font-size:12px;color:var(--bbx-ink-soft);margin-bottom:8px}.next-places a{display:block;padding:10px 0;min-height:44px}.next-places .recommended{font-weight:600;font-size:16px}.next-places small{display:block;font-size:12px;color:var(--bbx-ink-soft)}.bbx-card-content h3{font-size:1.15em;margin:1.65em 0 .6em}
</style></head><body class="bbx-box-presentation" data-chrome-theme="paper">
<header class="bbx-app-nav"><div><a class="brand" href="?card=Reading.doc.card" data-card="Reading.doc.card">Bee Box</a><button id="landmark-trigger" class="bbx-place-pill" popovertarget="menu-popover">Menu <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><span class="experiment">Navigation study · four cards</span></div></header>
<nav id="menu-popover" popover aria-label="Menu"><a href="?card=Menu.doc.card" data-card="Menu.doc.card">The collection</a><div class="menu-divider"></div><div class="menu-label">Read</div><a href="?card=Reading.doc.card" data-card="Reading.doc.card">Reading, with room beside it</a></nav>
<main id="workspace" aria-label="Reading workspace"></main>
<footer><label>System theme <select id="stock"><option value="cream">Paper</option><option value="manila">Manila</option><option value="blue">Blue</option></select></label><span>Prototype content · card themes stay with their cards</span></footer>
<script>
/* CARD_DATA */
const workspace=document.querySelector('#workspace');
const menu='Menu.doc.card', main='Reading.doc.card';
let current=null, transition=null;
const positions=new Map();
const visited=new Set();
history.scrollRestoration='manual';
function href(path,at){const url=new URL(location.href);url.searchParams.set('card',path);url.searchParams.delete('at');if(at)url.searchParams.set('at',at);url.hash='';return url.href;}
function chosen(){return new URL(location.href).searchParams.get('card')||main;}
function remember(){for(const pane of workspace.children)if(pane.getClientRects().length)positions.set(pane.dataset.path,pane.scrollTop);}
function pane(path,context){
 const card=cards[path], section=document.createElement('section');section.className='pane'+(context?' context':'');section.dataset.path=path;section.setAttribute('aria-label',card.title);
 const label=document.createElement('div');label.className='pane-label';
 if(card.parent){const back=document.createElement('a');back.href=href(card.parent);back.dataset.card=card.parent;back.textContent=`Back to ${cards[card.parent].title}`;label.append(back);}else{label.textContent=path===menu?'Collection':context?'Main document':'Reading';}
 const kind=document.createElement('span');kind.textContent=card.parent?'Aside':card.theme==='post-it'?'Note':'Document';label.append(kind);section.append(label);
 const article=document.createElement('article');article.className='bbx-card-theme bbx-card-surface';article.dataset.cardTheme=card.theme;article.dataset.cardStock=card.stock;article.style.viewTransitionName=path===main?'main-card':path===menu?'menu-card':'aside-card';
 const heading=document.createElement('div');heading.className='bbx-card-heading';const h=document.createElement(context?'h2':'h1');h.textContent=card.title;h.tabIndex=-1;heading.append(h);article.append(heading);
 const fold=document.createElement('span');fold.className='fold';fold.setAttribute('aria-hidden','true');article.append(fold);
 const front=document.createElement('div');front.className='bbx-card-front';const content=document.createElement('div');content.className='bbx-card-content bbx-theme-prose';content.innerHTML=card.body;
 for(const heading of content.querySelectorAll('h2,h3,h4,h5'))heading.id=(context?'context-':'')+heading.textContent.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
 if(context)for(const heading of content.querySelectorAll('h2,h3,h4,h5')){const nested=document.createElement('h'+(Number(heading.tagName.slice(1))+1));nested.id=heading.id;nested.innerHTML=heading.innerHTML;heading.replaceWith(nested);}
 for(const link of content.querySelectorAll('a')){const target=link.getAttribute('href');if(!cards[target])throw new Error(`Unknown card: ${target}`);link.dataset.card=target;link.href=href(target);if(cards[target].parent){link.setAttribute('aria-label',`${link.textContent} (aside)`);}}
 if(!context&&card.next?.length){const nav=document.createElement('nav');nav.className='next-places';nav.setAttribute('aria-label','Where next');const title=document.createElement('div');title.className='next-label';title.textContent='Where next';nav.append(title);const recommended=card.next.find(place=>!visited.has(place.card))||card.next.at(-1);for(const place of [recommended,...card.next.filter(place=>place!==recommended)]){const link=document.createElement('a');link.href=href(place.card,place.at);link.dataset.card=place.card;if(place.at)link.dataset.at=place.at;link.textContent=place.label;if(place===recommended)link.className='recommended';nav.append(link);}if(card.next.length>1){const note=document.createElement('small');note.textContent='Suggested order; follow any link you like.';nav.append(note);}content.append(nav);}
 front.append(content);article.append(front);section.append(article);const address=document.createElement('div');address.className='address';address.textContent='/'+path;section.append(address);return section;
}
function render(focus=false,followSection=true){const path=chosen();workspace.replaceChildren();workspace.classList.toggle('single',path===menu||!cards[path]);
 if(!cards[path]){const p=document.createElement('p');p.textContent='This card is not in the prototype. Use Menu to return to the collection.';workspace.append(p);document.title='Card not found';current=path;return;}
 visited.add(path);const card=cards[path];if(path!==menu)workspace.append(pane(card.parent||menu,true));workspace.append(pane(path,false));
 for(const section of workspace.children)section.scrollTop=positions.get(section.dataset.path)||0;
 document.title=card.title+' · Bee Box';current=path;
 for(const link of document.querySelectorAll('#menu-popover a')){if(link.dataset.card===(card.parent||path))link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');}
 const at=new URL(location.href).searchParams.get('at');const target=followSection&&at?document.getElementById(at):null;if(target){target.tabIndex=-1;target.scrollIntoView({block:'start'});}
 if(focus)(target||workspace.querySelector('h1'))?.focus({preventScroll:true});
}
async function navigate(path,push,at){document.querySelector('#menu-popover').hidePopover();remember();if(transition)transition.skipTransition();if(push&&href(path,at)!==location.href)history.pushState({},'',href(path,at));
 if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches){transition=document.startViewTransition(()=>render(true,push));await transition.finished;transition=null;}else render(true,push);
}
document.addEventListener('click',event=>{const link=event.target.closest('a[data-card]');if(!link||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;event.preventDefault();navigate(link.dataset.card,true,link.dataset.at);});
addEventListener('popstate',()=>navigate(chosen(),false));
document.querySelector('#stock').addEventListener('change',event=>{document.body.dataset.chromeStock=event.target.value;});
const menuPopover=document.querySelector('#menu-popover'),menuTrigger=document.querySelector('#landmark-trigger');
function positionMenu(){const r=menuTrigger.getBoundingClientRect();menuPopover.style.left=Math.max(8,Math.min(r.left,innerWidth-328))+'px';menuPopover.style.top=(r.bottom+4)+'px';menuPopover.style.maxHeight=Math.max(0,innerHeight-r.bottom-12)+'px';}
menuPopover.addEventListener('beforetoggle',event=>{if(event.newState==='open')positionMenu();});addEventListener('resize',positionMenu);
render();
</script></body></html>
