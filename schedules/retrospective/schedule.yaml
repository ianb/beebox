# Every three days: read the CODING_FEEDBACK notes sessions left since the
# last run, beside transcript-wide patterns and escaped bugs, and turn what
# repeats into tracked-file edits the boxholder confirms or vetoes.
#
# Handoff shape: `run` gathers the packet and hands off only when there is a
# new entry or an escaped bug with no test or check behind it. Which finding is
# a pattern, and what edit answers it, is the session's judgment.
description: "Retrospective: turn CODING_FEEDBACK and session patterns into guidance changes"
cadence: 3d
workstream:
  agent: claude
  model: claude-opus-5-5
  worktree: true
  # The watch list in the store is the memory between runs, and each digest is
  # judged on the branch it produces.
  session: fresh
  permissionMode: bypassPermissions
  # Tracked files only. Private material stays out of what this session reads
  # and writes (an Edit rule also covers Write).
  disallowedTools:
    - "Read(private-issues/**)"
    - "Edit(private-issues/**)"
