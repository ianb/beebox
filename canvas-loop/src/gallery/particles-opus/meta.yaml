self-report-summary: >
  The pure fold fit particle physics naturally; the mode-union pattern for
  the attractor's idle/dragging state made press/drag/release "trivially
  correct" in Opus's own words — a stray mousemove can't spawn a phantom
  attractor because there is no attractor state to touch outside the
  "dragging" mode.
