audit: >
  Brush round 2 (own scene, guide fixes the character only). Boxholder review pending. Dusk meadow, alien holding a flower, landed saucer with ramp and beam, farmhouse window, moon, shooting star, fireflies. Strong background and meadow; the alien keeps the guide's stiff construction and reads as the most digital element.
self-report-summary: >
  Ten cycles took it from clip-art to an illustrated scene. Shaded form by stroking a shape's own outline shifted inside its clip; wanted an inset/offset primitive, whole-page paper texture, and fill textures. Wash default grain read as moss on skin; short airbrush marks deposit almost nothing. Split the sketch into three files to fit max-lines. Opened 60 lines of a round-1 sketch it was told not to read; says it used nothing from it.
