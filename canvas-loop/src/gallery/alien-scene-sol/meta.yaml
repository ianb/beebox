audit: >
  Brush round 2 (own scene, guide fixes the character only). Boxholder review pending. Dusk meadow, alien in a scarf and satchel waving to a small friend in a departing saucer; moon, layered hills, flowers. Bristle-heavy painting gives the most painted look of the round; long bristle sky strokes read as stripes and the hand is a mitten. Stopped after 3 of 10 cycles.
self-report-summary: >
  Quick and absorbing; bristle gives most of the paint character but long repeated strokes make a mechanical pattern. Wanted control of a mark's internal colour and edge, and richer broken texture in distant land.
