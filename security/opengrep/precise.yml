# Callback-box precise OpenGrep rulepack — self-CVE / self-incident regression
# guards. Each rule encodes a real past security/isolation bug in our own code
# and fails if that exact shape returns. Keyed to our own issues/commits (we run
# no GHSA process). See security/opengrep/README.md.
rules:
  - id: cb-route-writes-to-host-os-tmpdir
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Box-request handler writes to the shared host os.tmpdir() instead of the
      box-scoped, swept <boxRoot>/tmp via ensureBoxTmpDir(boxRoot)/boxTmpDir(boxRoot)
      from src/lib/box-tmp.ts. Regression of the /api/upload shared-temp isolation
      fix (all boxes on one host collided on a fixed host path and leaked uploads
      outside the box).
    patterns:
      - pattern-either:
          - pattern: os.tmpdir()
          - pattern: tmpdir()
    paths:
      include:
        - "callback-box/src/webapp/routes/"
        - "callback-box/src/webapp/trpc/"
    metadata:
      category: security
      cwe: [CWE-22, CWE-284]
      advisory-id: cb-box-tmp-isolation
      advisory-url: issues/code-quality/2026-07-24-security-precommit-hooks.md
      detector-bucket: precise
      source-rule-id: cb-route-writes-to-host-os-tmpdir
