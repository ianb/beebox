name: Site checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let a newer run supersede an in-flight one; don't cancel a running deploy.
concurrency:
  group: beebox-site-checks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check site
        run: |
          pnpm --dir site lint
          pnpm --dir site typecheck
          pnpm --dir site test

      - name: Build site
        run: pnpm --dir site build --base /
