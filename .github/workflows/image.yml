name: beebox image

# Publishes the beebox container image to GitHub's registry as
# ghcr.io/<owner>/beebox. A version tag (v1.2.3) publishes :1.2.3 and
# :latest. A manual run publishes the chosen channel tag (:latest by default,
# :edge for a trial) from the chosen commit, stamped as a pre-release of the
# next patch version (1.2.4-main.20261024.abc1234 after tag v1.2.3); the
# full-suite schedule dispatches one such run a day after a green run on
# main. The Mac app follows :latest by digest and reads the image's labels
# (beebox/docker/Dockerfile) before downloading; compose and NAS installs can
# pull a tag instead of building from a clone.
#
# Each architecture builds on its own native runner (no QEMU: the frontend
# build is too slow emulated), pushes by digest, and a final job joins the
# digests under the tags.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to build (default: the branch the run is started from)"
        required: false
        default: ""
      channel:
        description: "Tag to publish"
        required: true
        default: latest
        type: choice
        options: [latest, edge]

permissions:
  contents: read
  packages: write

concurrency:
  group: beebox-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/beebox

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      sha: ${{ steps.stamp.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - id: stamp
        run: |
          sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/v* && -z "${{ inputs.ref }}" ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            # A pre-release of the NEXT patch version: it sorts above the
            # last tag and below the next one, as semver orders pre-releases.
            base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
            IFS=. read -r major minor patch <<< "${base#v}"
            version="$major.$minor.$((patch + 1))-main.$(date -u +%Y%m%d).${sha:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "building $version from $sha"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: beebox/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BEEBOX_VERSION=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Record digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          version="${{ needs.version.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* && -z "${{ inputs.ref }}" ]]; then
            tags=(-t "$IMAGE:$version" -t "$IMAGE:latest")
          else
            tags=(-t "$IMAGE:${{ inputs.channel || 'latest' }}")
          fi
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "${tags[1]}"
