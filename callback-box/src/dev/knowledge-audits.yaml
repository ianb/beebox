    correct_contains: [".md"]
    tags: [drive, docs, editing]

  - id: drive-docs-not-json
    prompt: "Is a synced Google Doc stored as JSON like a spreadsheet?"
    expected_level: knows_directly
    watch_for: "Says no — docs are stored as markdown, not JSON. JSON is the spreadsheet format."
    correct_contains_any: ["markdown", ".md"]
    tags: [drive, docs]

  - id: drive-docs-conflict
    prompt: "I edited a synced Google Doc locally but it didn't push. There's a file called Notes.remote.md next to it. What happened and what do I do?"
    expected_level: knows_about
    watch_for: "Identifies this as a sync conflict. Explains the upstream changed since last pull and that resolution is: merge the two files, delete .remote.md, commit."
    correct_contains_any: ["conflict", "merge"]
