  # === Capture mode ===
  #
  # A `<capture doc="...">` chat message delivers a user-recorded batch of
  # photos/voice as real user input pointing at a capture-session card
  # (Track 6 of docs/implemented-plans/capture-mode.md). Chat-only concept — the tag is
  # documented in CHAT_SYSTEM_PROMPT (prompts.ts), not the agent guide — so
  # every entry below needs chat_mode: true.
  #
  # Status (2026-07-10): all 3 pass on test1 (capture-mode breakpoint run).
  # capture-message-meaning: 0 reads, correct contrast with <self-note> —
  # passed after its check loosened from a too-literal contains ["doc"] to
  # the card filename (first run answered correctly, failed the string
  # check). capture-partial-marker: 0 reads, correct. capture-agent-duties:
  # passes, but note it answers by READING docs/generated/
  # card-capture-session.md (1 read, 1 search) rather than from context —
  # that is the designed flow (the prompt paragraph says to read the doc
  # rules), so reading here is desired behavior, not a recall failure.

  - id: capture-message-meaning
    prompt: >
      A message arrives in chat: `<capture doc="tmp-capture/capture-20260710T0900-ab12.capture-session.card" images="2" audio="1:40">making dinner notes</capture>`.
      What is this, and what (if anything) do you do with it?
    expected_level: knows_directly
    chat_mode: true
    watch_for: >
      Says this is real user input (not a background/system note) and that a
      reply is expected — contrasted with `<self-note>`, which is not user
      input and doesn't expect a reply. Says it should read the `doc` card
      (the actual capture-session.card) before responding substantively,
      not just answer from the one-line inner summary.
    correct_contains_any: ["user input", "real user", "expects a reply", "reply is expected"]
    # "Read the doc first" — a correct answer names the card it would read.
    # (First run answered correctly but failed a too-literal contains:
    # ["doc"]; the card filename is the robust marker.)
    correct_contains: ["capture-session.card"]
    tags: [capture, chat, behavioral]

  - id: capture-agent-duties
    prompt: >
      You've read a capture-session card at `tmp-capture/capture-20260710T0900-ab12.capture-session.card`
      with two photos and a short voice transcript. What are your duties on
      this card, in order, before it's done?
    expected_level: knows_directly
    chat_mode: true
    watch_for: >
      (1) Annotate by default — OCR/describe the images (via subagents
      reading the actual image files, not invented from the transcript) and
      commit, setting status to annotated. (2) Then file the card out of
      tmp-capture/ with `cb mv` to wherever it belongs, OR complete the
      capture on the spot and delete the card instead. (3) tmp-capture/
      must not accumulate — this isn't storage. Should NOT invent other
      behavior (e.g. leaving it in tmp-capture/ indefinitely, or skipping
      annotation).
    correct_contains_any: ["annotate", "OCR", "describe"]
    correct_contains: ["tmp-capture"]
    tags: [capture, chat, behavioral]

  - id: capture-partial-marker
    prompt: >
      A capture-session card's frontmatter has `partial: true`. What does
      that tell you about the transcript in its body?
    expected_level: knows_directly
    chat_mode: true
    watch_for: >
      Says the recording cut off unexpectedly (crash/disconnect/abandonment
      sweep) and that the final seconds may be missing — the tail should be
      treated as possibly mid-thought, not as the person trailing off or
      finishing their point. Does not invent an unrelated meaning (e.g.
      "the user only partially wants this filed").
    correct_contains_any: ["cut off", "cut short", "missing", "mid-thought", "incomplete"]
    tags: [capture, chat, behavioral]

  # === Bulk file upload ===
  #
  # docs/plans/bulk-file-upload.md Track 4. An `<upload doc="..." files="N"
  # bytes="..." failed="M">` chat message is the bulk sibling of `<capture>` —
  # documented alongside it in CHAT_SYSTEM_PROMPT (prompts.ts), so this entry
  # needs chat_mode: true. The filing duties (including the "ask before filing
  # an unintroduced batch" rule, boxholder decision 2026-07-27) live in the
  # upload-batch schema's instructions (src/schemas/upload-batch.tsx), surfaced
  # to the agent as docs/generated/card-upload-batch.md. The second entry below
  # is the non-chat case: a chat-agent-only concept (schema instructions say
  # filing is chat-agent-only) discovered by an agent poking around the box
  # outside any chat turn — tmp-upload/ is a landing zone parallel to
  # tmp-capture/ and must not accumulate.
  #
  # Status (2026-07-27): 2/2 pass on the bulk-file-upload worktree's test1
  # clone. upload-message-meaning passed first try (1 read of the generated
  # card-upload-batch.md, correctly named both the real-user-input framing and
  # the ask-first rule). upload-batch-found-outside-chat FAILED its first run
  # (0 words, 18 turns) — not a prompt-surface gap: the box actually had a
  # real leftover tmp-upload/ batch from the Track 1/2 E2E verification (filed
  # to box/inbox/ as file cards but never deleted, a genuine loose end from
  # that verification pass), and the agent went down a real remediation
  # rabbit hole (git mv, cb rm, hashing files) instead of answering the
  # hypothetical, running out of turns before replying. Fixed by cleaning up
  # that stray artifact in the box (`git rm -r tmp-upload`, box commit
  # 136d0659) rather than touching the audit; re-run passed cleanly (1 read,
  # 7 turns, correctly named the landing-zone convention, the
  # already-filed-by-hand check, and the question-card fallback for
  # ambiguous destinations).

  - id: upload-message-meaning
    prompt: >
      A message arrives in chat with no other text from the user: `<upload
      doc="tmp-upload/batch-20260710T0900-ab12.upload-batch.card" files="34"
      bytes="112 MB" failed="3">34 files uploaded (112 MB); 3 more failed to
      upload.</upload>`. What is this, and what do you do first?
    expected_level: knows_directly
    chat_mode: true
    watch_for: >
      Says this is real, first-class user input (parallel to `<capture>`) and
      a reply is expected — not a background/system note. Says the filing
      duties live in the `doc` card's schema instructions (upload-batch), so
      it should read that card before responding substantively rather than
      just the one-line inner summary. Critically: because the batch arrived
      with no accompanying text explaining what it's for or where it goes, the
      agent should ask the boxholder before filing anything — not start
      placing files unprompted.
    correct_contains_any: ["user input", "real user", "reply is expected", "expects a reply"]
    correct_contains: ["ask"]
    tags: [bulk-upload, chat, behavioral]

  # The other half of the rule above, and the one that is easy to get wrong: an
  # `<upload>` whose body carries the boxholder's own words is INTRODUCED, so the
  # ask-first duty does not apply. Getting this backwards turns every photo batch
  # into an interrogation — the agent asking what the files are immediately after
  # being told. Added with the chat-photo-batch-upload work, which made composer
  # text ride along as the batch's `note`.
  #
  # Status 2026-07-30: PASSES first try (1 read of the generated
  # card-upload-batch.md, 6 turns, 49k→52k). Passed for the right reason, not by
  # keyword luck — the agent wrote "The note *is* the introduction ... so no
  # 'what are these?' question. Act on it; only ask about what it genuinely
  # leaves open", and its example open question (does a 2026 travel folder exist,
  # one card per receipt or one card with 34 attachments) is exactly the
  # distinction duty 1 draws. Authoring note: the runner compiles
  # `response_not_matches` case-insensitively already, so an inline `(?i)` is a
  # JS regex SyntaxError that kills the run — caught only by running it.
  - id: upload-message-introduced
    prompt: >
      A message arrives in chat: `<upload
      doc="tmp-upload/batch-20260730T1912-9f3c.upload-batch.card" files="34"
      bytes="112 MB">Receipts from the Tokyo trip — file them under the 2026
      travel folder.

      34 files uploaded (112 MB).</upload>`. What is this, and what do you do
      first?
    expected_level: knows_directly
    chat_mode: true
    watch_for: >
      Recognises that the first paragraph is the boxholder's own introduction
      (the batch's `note`), so this batch is NOT the unintroduced case — it
      should act on what they said (file into the 2026 travel folder) rather
      than asking what the files are or where they go. Reading the `doc` card
      for the filing duties first is right; asking a genuinely open follow-up
      (e.g. the exact destination path doesn't exist yet) is fine. What is wrong
      is treating an introduced batch as needing an introduction.
    correct_contains_any: ["travel", "Tokyo", "receipts"]
    # The runner already compiles these case-insensitively — an inline `(?i)`
    # flag is a JS regex syntax error, not a no-op.
    response_not_matches:
      - "what (are|do you want|should I do with) these (files|photos)"
      - "where (should|would you like) (these|them|the files)"
    tags: [bulk-upload, chat, behavioral]

  - id: upload-batch-found-outside-chat
    prompt: >
      Doing unrelated work in this box — not processing a chat turn — you
      notice a directory `tmp-upload/batch-20260705T1200-cd34/` still present
      under one of the chat context directories, holding an `upload-batch`
      card and its attach scope. What does this mean, and what should you do?
    expected_level: discoverable
    should_read: ["docs/generated/card-upload-batch.md"]
    watch_for: >
      Recognizes tmp-upload/ as a landing zone (the bulk-upload sibling of
      tmp-capture/) that must not accumulate — a card still sitting there
      means the batch's filing was never finished. Reads the card (and its
      generated instructions) to see the file inventory, then either files
      the remainder itself (only if the destination is genuinely unambiguous)
      or raises a note/question rather than silently ignoring or deleting it.
      Filing an upload batch is chat-agent-only work per the schema's own
      division of duties, so a non-chat agent finding one mid-batch should
      not assume it can just finish the job unprompted.
    correct_contains: ["tmp-upload"]
    tags: [bulk-upload, navigation]

  # === Calendar: authoring .ics events ===
  #
  # The calendar skill is de-templated (Track 1 of remove-box-shape-v1): it no
  # longer bakes the box timezone / VTIMEZONE into the skill body. Instead it
  # uses the `BOX_TZ` placeholder (the box's timezone, on the `Timezone:` line
  # in system context) and points at `cb calendar vtimezone` for the DST block.
  # This audit checks the agent reaches for those rather than hand-writing a
  # VTIMEZONE. knows_about: the calendar skill is on-demand (may involve reading
  # the skill before answering).
  #
  # Status (2026-07-11): PASS on first run after regenerating the box's skills
  # from the de-templated source. The agent loaded the calendar skill, used
  # TZID=<box's timezone>, and ran `cb calendar vtimezone` to get the VTIMEZONE
  # block verbatim rather than hand-writing DST rules. (An earlier run failed
  # only because the box carried the pre-change templated SKILL.md on disk.)

  - id: calendar-vtimezone-authoring
    prompt: >
      Add a 2pm dentist appointment to the calendar for next Tuesday. Walk
      through how you'd author the .ics event — specifically how you handle
      the timezone and VTIMEZONE block.
    expected_level: knows_about
    watch_for: >
      Uses the box's own timezone (BOX_TZ — from the Timezone: line already in
      system context) for the TZID, and gets the VTIMEZONE block by running
      `cb calendar vtimezone` and pasting it verbatim, rather than hand-writing
      DST rules or inventing a sample zone. Should NOT fabricate a VTIMEZONE
      component from memory.
    correct_contains: ["cb calendar vtimezone"]
    correct_contains_any: ["BOX_TZ", "Timezone:", "system context", "box's timezone"]
    tags: [calendar, box-tz]

  # === Session transcripts (cb session) ===
  #
  # `cb session` is the agent's window into past chat transcripts —
  # `--list` to find them (aggregated across the box root and landmark
  # dirs), `--latest`/`<id>` to view one. The failure mode is hunting
  # for JSONL files under ~/.claude/projects/ by hand or grepping the
  # box for a "chat log".

  - id: review-previous-chat-session
    prompt: "How would you review what was said in a previous chat session?"
    expected_level: knows_directly
    watch_for: >
      Reaches for `cb session` — `--list` to find recent sessions, then
      `--latest` or the id (e.g. with `--dialogue-only`) to read one.
      Does NOT hand-hunt JSONL files under ~/.claude/projects/ or grep
      the box for transcripts.
    correct_contains: ["cb session"]
    correct_contains_any: ["--list", "--latest"]
    tags: [sessions, cli]

  # === Referencing a card in a chat reply (link vs. bare filename) ===
  #
  # Persistent problem: the agent writes a bare `Foo.type.card` filename as
  # literal text in a chat reply instead of a clickable markdown link, so the
  # user can't tap to open it. See
  # issues/bugs/2026-07-21-agent-emits-bare-card-filenames-in-chat.md.
  #
  # DESIGN INTENT: test the agent's *intuition*, not its knowledge. A prompt that
  # asks "how do you reference a card?" makes it think about linking and it gets
  # it right (false pass). Probing revealed WHERE the intuition actually lapses:
  #   - focused reference ("where is my X?")  -> links reliably (not the bug)
  #   - content question                       -> usually cites nothing at all
  #   - save/create confirmation               -> names the card it just made,
  #     and FREQUENTLY drops it bare — this is the reported bug's locus.
  # So the prompt asks the agent to SAVE a note; the reference is incidental to
  # the save, which is where the link intuition fails.
  #
  # STOCHASTIC — run it several times and read the RATE, not one pass/fail.
  # Status (2026-07-21): with the fixed prompts, 0/10 runs bare (3 linked in
  # prose, 7 ack-only). A same-environment control with the pre-fix prompts
  # also ran 0/5 bare, so the original ~2/3-bare baseline (3 runs, sibling
  # session) does NOT reproduce here — treat this audit as a tripwire against
  # regression, not proof the prompt fix moved the rate.
  # Stochastic — the fail RATE over N runs is the metric, not one pass/fail. The check flags only the actual bug: a bare card filename/path
  # as literal text (including backticked or used as a link label), while link
  # targets (](...)) and ref="..." attributes stay legal — so a bare-<ack>
  # confirmation with no prose mention correctly passes. NOTE: this audit
  # MUTATES the box (the agent creates a note card each run); the created card
  # is disposable.
  # Status (2026-07-30): 1/1 pass in the box-root-paths Track G run — the ack
  # ref AND the prose link both came out box-root form
  # (ref="/store/notes/Beta_Launch.doc.card", "Saved to [Beta Launch](/store/…)"),
  # which is the Track E exemplar change landing. One run only; the RATE caveat
  # above still governs.
  - id: chat-reference-card-as-link
    prompt: "Quick, save this before I forget: beta ships in August, hold the pricing page until launch, and move standups to Tuesdays."
    expected_level: knows_directly
    chat_mode: true
    watch_for: >
      Creates a card for the note. If the confirmation mentions the card in
      prose, it must be a clickable markdown link with a human label ([the
      note](/store/...card)) — FAILS if it names the card as a bare
      filename/path (e.g. "saved to Beta_Plan.doc.card" as literal text), the
      exact reported bug. A bare <ack ref="..."/> confirmation with no prose
      mention is fine (the chip is tappable). The reference is INCIDENTAL: the
      agent's attention is on the save action, and it names the result in
      passing, which is where the link intuition lapses. The prompt never
      mentions links.
    response_not_matches:
      - '(?<![\w./-])(?<!\]\()(?<!=")[\w./-]+\.[\w-]+\.card\b'
    tags: [chat, links, cards]

  # === Chat Review ===
  #
  # Status (2026-07-28): all 3 pass. Added with the chat-review implementation
  # (docs/plans/chat-review.md). Note chat-review-vs-compaction read 1 file
  # rather than answering purely from context — it passes, but it is the
  # weakest of the three and worth re-checking if the vocabulary drifts.
  # Run: pnpm knowledge-audit run --box <path> --filter chat-review

  - id: chat-husk-title-ownership
    prompt: "Who sets the title on a chat husk card, and what happens if I edit one by hand?"
    expected_level: knows_directly
    watch_for: "Says the nightly chat review maintains it AND that a hand-edited title is left alone"
    correct_contains: ["review", "hand"]
    tags: [chat, cards, chat-review]

  - id: contains-evidence-purpose
    prompt: "What is the `contains-evidence` field for, and when should I set it?"
    expected_level: knows_directly
    watch_for: "Says it holds the detail `contains` was derived from — NOT a second summary or scratch space"
    correct_contains: ["contains"]
    tags: [cards, search, chat-review]

  - id: chat-review-vs-compaction
    prompt: "What does 'compaction' refer to in this codebase?"
    expected_level: knows_directly
    watch_for: "Names the SDK context-window meaning, and does NOT confuse it with chat review"
    correct_contains: ["context"]
    tags: [vocabulary, chat-review]

  # === Assets (git-annex) ===
  #
  # Status (2026-07-31): 2/2 pass, verified on a box that is ACTUALLY annexed
  # (the preserve-ignored-files worktree clone of test1, migrated with
  # `cb attachments to-annex`: 137 assets / 106 MB, 99 manifests removed, 9 Git
  # LFS files converted).
  #
  # Both failed before that migration, and each failure was informative:
  #   1. asset-add-workflow as first written asked "how do I add a photo" and
  #      required "git add" — but a box agent rightly answers `mkdir`/`cp`,
  #      since the pre-commit hook commits, not the agent. Wrong criterion.
  #   2. The rewrite still failed because the box was on Git LFS, and the agent
  #      correctly described LFS. That is what surfaced the LFS overlap now
  #      resolved in docs/plans/asset-annex.md.
  # Neither audit can pass against an unmigrated box, which is the point: they
  # test what an agent knows about the system the box is actually running.
  #
  # Run: pnpm knowledge-audit run --box <abs-path> --filter assets

  - id: asset-content-absent
    prompt: "I opened a photo in a box and the file is about 100 bytes of text starting with /annex/objects/. What happened, and is my photo gone?"
    expected_level: knows_directly
    watch_for: "Recognizes an annex pointer (content not fetched locally) and answers `git annex get` — NOT that the file is corrupt or lost"
    correct_contains: ["git annex get"]
    tags: [assets]

  - id: asset-add-workflow
    prompt: "I dropped a photo into a card's attach scope. Do I need to run `git annex add` on it, or does something else handle that?"
    expected_level: knows_directly
    watch_for: "Says no — annex.largefiles routes it on ordinary `git add`, so the normal commit path handles it. Reaching for `git annex add` means it learned a special case that does not exist here (and it locks files, breaking in-place edits)."
    correct_contains: ["largefiles"]
    tags: [assets]

  # === Scanned documents (`document.card`) ===
  #
  # Track 4 of docs/plans/scanner-ingest.md. One entry, per the plan's
  # "Knowledge audits" section: the agent should be able to say what a
  # `document.card` is, where its original bytes live, and what `status: new`
  # + `error:` means — from the schema instructions in its always-on surface,
  # without re-reading source.
  #
  # The failure this guards against is the expensive one: an agent seeing a
  # `status: new` document card with an `error:` and concluding the document
  # was lost (or re-uploading it), when the original PDF is sitting right there
  # in the attach scope and `cb document reanalyze` re-runs extraction.
  #
  # Status (2026-08-01): 1/1 pass. The agent named `cb document reanalyze`
  # (plus `--force-ocr`), pointed at `attach/source.pdf` as still-present, and
  # offered `status: invalid` as the give-up — the whole watch_for. But it is
  # only nominally `knows_directly`: the prompt cites a card path that does not
  # exist in the box, so the agent spent 5 bash calls and 16 turns proving that
  # before answering the general question (it found the e2e box's real
  # `source.document.card` on the way). Worth a `fixture:` staging the card at
  # the cited path next time this entry is touched, so the read count measures
  # knowledge rather than a wild-goose chase.
  # Run: pnpm knowledge-audit run --box <abs-path> --filter scanner-ingest

  - id: document-card-failed-extraction
    prompt: >
      I found a card at `box/inbox/scan-20260402T1015-ab12cd34.attach/source.document.card`
      with `status: new` and an `error:` field saying Docling exited 1. Is the
      scanned document lost? What are my options?
    expected_level: knows_directly
    watch_for: >
      Says nothing is lost — the original file is still in the card's attach
      scope (`attach/source.pdf`, per `filename.ref`) and can be read directly;
      names `cb document reanalyze` as the retry (and `--force-ocr` for a junk
      text layer), or marking the card `invalid` if the file really is unusable.
      Should NOT say the document needs re-scanning or re-uploading, and should
      NOT treat `status: new` as "not yet arrived".
    correct_contains: ["reanalyze"]
    correct_contains_any: ["attach/source.pdf", "attach scope", "original"]
    tags: [cards, intake, scanner-ingest]

  # === Scan provenance (`source: scan-upload/<token-name>`) ===
  #
  # The plan's second audit entry (docs/plans/scanner-ingest.md, "Knowledge
  # audits"): an agent triaging a scan intake job should be able to say where
  # the session came from, straight from the capture-session schema
  # instructions, without going source-diving. The failure it guards against is
  # an agent treating an unfamiliar `source:` value as noise (or as a ref it
  # should resolve) instead of as the named upload credential — which is the
  # only handle the boxholder has for "which scanner/profile produced this
  # batch" when a whole batch comes out wrong.
  #
  # What CLAUDE_SCANS.md is for is already audited separately by
  # `landmark-parent-claude-md-loads` above, so this entry does not re-ask it.
  #
  # Status (2026-08-01): 1/1 pass, 0 file reads, 0 searches, 6 turns, 43k
  # initial context. The agent read the `source` paragraph out of the generated
  # capture-session card doc and gave the right reading — desktop uploader, not
  # chat; token name identifies the device/profile; useful when a batch looks
  # wrong — and volunteered the CLAUDE_SCANS.md tie-in unprompted. The
  # capture-session schema instructions carry this knowledge; nothing to fix.

  - id: scan-session-provenance
    prompt: >
      I'm triaging an intake job and one of its items is a capture-session card
      whose frontmatter says `source: scan-upload/study-scansnap`. What does
      that tell me about where this session came from?
    expected_level: knows_directly
    watch_for: >
      Says the session came in from outside chat — the desktop scan uploader
      PUT these files to the box under a named scan-upload credential, and
      `study-scansnap` is that credential's name, identifying the device or
      scanner profile that produced the batch. Should NOT read it as a file
      path/ref to resolve, a card type, or a user identity.
    correct_contains_any: ["scan upload", "scan-upload", "uploader", "scanner"]
    tags: [cards, intake, scanner-ingest]

  # === Pointing at the interface (`control:` links, `cb chat ui`) ===
  #
  # The four agent-facing concepts from docs/plans/agent-points-at-ui.md
  # (Track 4's "Knowledge audits"): the `cb chat ui` command, the `control:`
  # link form, the point/focus/reveal vocabulary, and the reveal-versus-do
  # line. All chat_mode: true — the rule lives in the chat system prompt's
  # "Showing things in chat" section (prompts.ts); the agent guide carries only
  # the short "don't tell them where something is unless you have looked"
  # bullet.
  #
  # The plan's audit 1 is two entries here, not one: the positive (reach for
  # the scan when location IS the question) and the negative (don't volunteer a
  # location when it isn't) are different behaviours and a single prompt can
  # only tempt one of them.
  #
  # Status (2026-08-23): 5/5 pass, 0 file reads, 0 searches, 51-53k initial
  # context. First run was 2/5 and two of the three failures were the audits,
  # not the prompt: where-is-the-mic checked prose for "cb chat ui" when the
  # agent had in fact run it (now checked via bash_contains — the right reply
  # doesn't name the command to the user), and reveal-not-operate could not
  # offer a reveal because the audit box has no connected chat client to scan
  # (now handed a dump). The third was a real gap: with only the plan's
  # blockquote in the prompt, the agent wrote `control:cb-composer-add` with no
  # action and no description — nothing told it what those parameters do or
  # when a menu should be revealed rather than pointed at, so a clause was
  # added to prompts.ts. Residual doubt: the mic answer still says the mic
  # "lives with the message composer" from general knowledge after its scan
  # failed — hedged and generic rather than a specific screen location, but
  # close to the line the negative audit guards.

  - id: points-at-ui-where-is-the-mic
    prompt: "Where's the microphone button? I can't find it."
    expected_level: knows_directly
    watch_for: >
      Reaches for `cb chat ui` to see what's actually on screen rather than
      describing the interface from memory or guessing a location.
    bash_contains: ["cb chat ui"]
    chat_mode: true
    tags: [chat, points-at-ui]
    notes: >
      The positive half of the plan's audit 1. Checked on the agent's *bash*,
      not its prose: the right reply doesn't name the command to the user, it
      just looks. The command fails in the audit box (no chat client is
      connected), which is fine — what's audited is that the agent knows to
      look rather than inventing a location.

  - id: points-at-ui-unseen-location
    prompt: "I've moved your list of open todos somewhere else in the app. Anyway — how do I get back to it?"
    expected_level: knows_directly
    watch_for: >
      Does NOT assert a screen location it has not scanned for. Either says it
      can't see the interface, offers/runs `cb chat ui`, or answers with the
      thing and its link (`cb todos` / the todos path) and leaves the locating
      to the link.
    correct_contains_any: ["cb chat ui", "can't see", "cannot see", "haven't looked", "cb todos"]
    response_not_contains: ["in your sidebar", "in the sidebar"]
    chat_mode: true
    tags: [chat, points-at-ui]
    notes: >
      The negative half of the plan's audit 1, and the failure a real 2026-08-23
      user journey hit: an agent told a first-time user an area was "in your
      sidebar" on a page with no sidebar, inside a sentence about something
      else. The prompt deliberately dangles a moved-thing premise to tempt a
      volunteered location.

  - id: points-at-ui-control-link
    prompt: |
      You ran `cb chat ui` and got this back:

      UI on screen — web-desktop, /main/test1/chat, scanned 14:32 local
      Covers: browser DOM only. This surface has no native chrome.
      3 controls omitted: no accessible name.

      navigation "Primary"
        button [Place: test1](control:cb-nav-place)
        button [Session: Dinner plans](control:cb-nav-session) [reveal]
          — the thread menu: new session, recent chats, model, delete this chat
        button "Open debug log (2 errors)"                     (no address) (off-screen)
      region "Compose message"
        button [Add](control:cb-composer-add) [reveal]
          — the attach menu: capture, attach file, upload files, screenshot,
            share location
        textbox [Type a message...](control:cb-composer-input)
        button [Send](control:cb-composer-send) [disabled]
        button [Stop recording](control:cb-composer-mic)
          — tap to stop dictating and send; say "cancel message" to discard

      The user just asked "how do I attach a photo?". Write the reply you would
      send them.
    expected_level: knows_directly
    watch_for: >
      Writes a `control:` link for cb-composer-add with `action=reveal` and a
      `description=`, and the sentence around it locates the control in words
      rather than leaning on the link alone.
    correct_contains: ["control:cb-composer-add", "description="]
    correct_contains_any: ["action=reveal", "reveal"]
    chat_mode: true
    tags: [chat, points-at-ui]
    notes: >
      The plan's audit 2. The dump is the fixture output from
      test/core/chat/ui-dump.doctest.md, so the audit and the real format can't
      drift apart silently.

  - id: points-at-ui-reveal-not-operate
    prompt: |
      You ran `cb chat ui` and got this back:

      UI on screen — web-desktop, /main/test1/chat, scanned 14:32 local
      Covers: browser DOM only. This surface has no native chrome.

      region "Compose message"
        button [Add](control:cb-composer-add) [reveal]
          — the attach menu: capture, attach file, upload files, screenshot,
            share location
        textbox [Type a message...](control:cb-composer-input)
        button [Send](control:cb-composer-send) [disabled]

      The user then says: "Never mind explaining it — just attach the photo for
      me. Press the attach button yourself." Write the reply you would send.
    expected_level: knows_directly
    watch_for: >
      Declines to operate the interface for the user and offers the reveal
      instead — opening the attach menu is help; attaching the file is doing it
      for them.
    correct_contains_any: ["reveal", "open the attach menu"]
    response_not_contains: ["I've attached", "I attached"]
    chat_mode: true
    tags: [chat, points-at-ui]
    notes: >
      The plan's audit 3 — the reveal-versus-do line. Failure modes: claiming to
      have attached it, or claiming it can click things on the user's screen.
      The dump is handed to the agent because a reveal needs an address: in the
      audit box no chat client is connected, so an agent that only *tried* to
      scan would have nothing to offer and the audit would test the environment
      rather than the rule.

  - id: points-at-ui-path-vs-control
    prompt: "When you point me at something in chat, when do you link a box path and when do you use one of those control: links?"
    expected_level: knows_directly
    watch_for: >
      States the rule: a path points at content that has a place in the box; a
      `control:` address points at something that exists only on screen (a
      button, a menu, a field), and comes from `cb chat ui`.
    correct_contains: ["control:"]
    correct_contains_any: ["cb chat ui", "on screen", "interface"]
    chat_mode: true
    tags: [chat, points-at-ui]
    notes: >
      The plan's audit 4. Failure mode is treating `control:` as another way to
      link a card, or inventing a control address for a card path.
  # === Transcript confidence marks ===
  #
  # Status (2026-08-15): 1/1 pass, 0 file reads, 0 searches, 52k ctx. The
  # agent read <unsure> as low acoustic confidence, named the can/can't
  # inversion, chose ask-about-audio/retranscribe/ask before writing, and
  # volunteered both caveats (unmarked ≠ verified; no stt= = no data; strip
  # tags when quoting into a card) unprompted.
  #
  # The chat prompt's "Voice is transcribed" section defines <unsure> marks
  # (docs/plans/transcript-confidence.md): the realtime transcriber wraps
  # low-acoustic-confidence words, stt= names the transcriber, and absence of
  # marks is not verification. The failure this guards against is the agent
  # building on a marked meaning-critical word (a negative, a number, a name)
  # as if it were verified — the exact silent-mishearing the feature exists to
  # catch. Needs chat_mode: true — the semantics live only in the chat prompt.
  #
  # Status (2026-08-15, --message targeting): example <speech> tag gained a
  # message-id="msg-7f2a" attribute (voice messages carry one for real now);
  # watch_for/correct_matches extended to require the agent target
  # retranscribe/ask-about-audio with `--message msg-7f2a` rather than
  # invoking either bare. 1/1 passes: the agent wrote both commands with
  # `--message msg-7f2a` and noted the id "comes off the wrapper — never
  # fabricated." 0 reads, 0 searches, 51k ctx.
  #
  # Status (2026-08-23, hq-dictation-switch): re-run after widening `stt`'s
  # vocabulary (`stt="hq"`, docs/implemented-plans/hq-dictation-switch.md) and adding the
  # one retranscribe-clause exception to the prompt. 1/1 passes, 0 reads, 0
  # searches, 54k ctx — the new clause didn't disturb this audit's existing
  # `stt="deepgram"` scenario.

  - id: chat-unsure-word-semantics
    prompt: >
      A voice message arrives as `<speech stt="deepgram"
      message-id="msg-7f2a">I <unsure>can</unsure> make the 3 PM meeting
      tomorrow</speech>` and the user is asking you to update their
      schedule. What does the markup around "can" tell you, and what
      should you do before updating anything?
    expected_level: knows_directly
    watch_for: >
      Reads <unsure> as the transcriber's low acoustic confidence in that word
      — here possibly "can't", which inverts the meaning — and does not build
      on it silently: confirms with the user or checks the audio
      (cb chat retranscribe / ask-about-audio, targeted with
      `--message msg-7f2a` read off the wrapper) before updating the
      schedule. Should NOT treat the mark as an error to ignore, should not
      copy the tag into anything it writes, and should not invoke either
      command bare (no `--message`).
    correct_contains_any: ["can't", "cannot", "invert", "opposite"]
    correct_matches:
      - "retranscribe|ask-about-audio|confirm|ask (?:the user|them|him|her|first|before)"
      - "--message|msg-7f2a"
    chat_mode: true
    tags: [chat, voice, transcription]
    notes: >
      Also worth watching in the transcript: the agent should know absence of
      marks is not verification (confident mishearings get no mark) and that
      messages without stt= carry no confidence data at all — still true now
      that `stt="hq"` exists (docs/implemented-plans/hq-dictation-switch.md): an HQ pass
      carries no per-word confidence either, so an hq-stamped message has no
      marks for the same "no data" reason, not a different one.

  # === Secrets (machine-level store) ===
  #
  # The two audits named in docs/plans/secret-custody.md, "Knowledge audits":
  # provisioning (Track 3) and ad-hoc secret use in box code (`agent`-access
  # grants). Both guard the same failure family — the old
  # `config/connectors/*.secret.json` answer, which the machine-level store
  # made actively wrong. Run: pnpm knowledge-audit run --box <abs-path> --filter secrets
  #
  # Status (2026-08-17): 1/2 pass.
  #
  # - secrets-adhoc-use: PASS, 0 reads, 46k ctx. The agent gave the full
  #   declare -> boxholder grants -> resolve-at-call-time flow unprompted,
  #   straight from `secretsSection()`'s always-on text.
  #
  # - secrets-provisioning: FAIL, but not a gap in `secretsSection()`. The
  #   agent grep'd the box for "mistral" and found
  #   `docs/generated/views.md` (generated by `src/core/views/doc-files.ts`),
  #   which documents `adapterFetch`/`/api/adapters/<adapter>` as reading the
  #   key from `config/connectors/<adapter>.secret.json` — true when that doc
  #   text was written, now stale: `api-adapters.ts` (`readAdapterKey`)
  #   resolves from the machine store first and only falls back to the
  #   legacy file with a deprecation warning
  #   (`docs/secrets.md`, "Migrating a connector"). The agent presented the
  #   legacy file as the established pattern for "views" use and offered to
  #   create `mistral.secret.json` — the exact wrong answer this audit exists
  #   to catch, taught by a different, stale doc than the one this task owns.
  #   `secretsSection()` (`src/core/agent-guide/secrets.ts`) is unrelated to
  #   the views/adapter path and editing it would not reach the doc the agent
  #   actually read, so left unchanged per scope — the real fix is
  #   `src/core/views/doc-files.ts`'s adapter-key paragraph, out of this
  #   task's file scope (docs/views generation, not `agent-guide/`).
  #   Re-run once that doc is corrected.
  #
  # Status (2026-08-17, re-run): 2/2 pass. Another session fixed the stale
  # doc (`src/core/views/doc-files.ts`'s "Calling external APIs (LLMs) from
  # a view" section) to say the server resolves the adapter key from the
  # machine-level store, the boxholder grants it via `cb secrets`, and
  # `config/connectors/<adapter>.secret.json` is a deprecated fallback, not
  # something to create. secrets-provisioning now reads that regenerated doc
