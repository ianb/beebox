tests:
  # === Box Structure and Navigation ===
  #
  # Status (2026-08-14, Codex): 13/13 navigation-tagged audits pass. The
  # how-items-enter check now accepts the semantically equivalent phrase
  # "connected services" after Codex named Gmail, Telegram, Calendar, and Drive.
  #
  # Status (2026-07-03): 2/3 pass. REAL GAP: find-memo-cards — agent answers
  # `cb ls --kind memo` (hallucinated; `cb ls` has no --kind) instead of the
  # `*.memo.card` glob. See docs/reports/knowledge-audit-rerun-2026-07-03.md.

  - id: box-structure-inbox
    prompt: "Where would you look for unprocessed incoming items?"
    expected_level: knows_directly
    watch_for: "Names box/inbox/ directly without searching"
    correct_contains: ["box/inbox"]
    tags: [navigation]

  - id: find-memo-cards
    prompt: "If I wanted to find all memo cards in the system, how would you search?"
    expected_level: knows_directly
    watch_for: "Suggests *.memo.card glob pattern without searching"
    correct_contains: [".memo.card"]
    tags: [navigation, cards]

  - id: card-after-processing
    prompt: "What happens to a card after it's processed?"
    expected_level: knows_directly
    watch_for: "Mentions cb mv and store/archive/ without file reads"
    correct_contains: ["archive"]
    tags: [navigation, lifecycle]

  # Status (2026-08-14): Claude and Codex both pass directly with 0 file reads
  # and 0 searches. The semantic regex accepts either natural ordering of the
  # host-/tmp rejection without requiring one model's exact wording.
  - id: temp-file-location
    prompt: "You need to create a temporary working file while operating this box. Should it go in the host /tmp or the box-root tmp/ directory, and can you rely on it staying there?"
    expected_level: knows_directly
    watch_for: "Chooses box-root tmp/ and explicitly rejects host /tmp without reading files; says it may be swept and must not be relied on for persistence"
    correct_contains: ["tmp/", "/tmp", "swept"]
    correct_matches:
      - "\\b(?:not|never)\\b(?:\\W+\\w+){0,2}\\W+host\\W+/tmp\\b|\\b(?:do\\W+not|don't)\\W+(?:use|put|place|write|store)(?:\\W+\\w+){0,3}\\W+host\\W+/tmp\\b|\\bhost\\W+/tmp\\b\\W+(?:should|must)\\W+not\\W+be\\W+(?:used|chosen)\\b"
    tags: [navigation, temp-files]
    notes: >
      General box scratch belongs in tmp/, which is uncommitted and may be
      swept, so it is not persistent storage. This is distinct from host /tmp
      and the committed flow-specific tmp-capture/ and tmp-upload/ landing zones.

  # === How Items Enter the Box ===
  #
  # Status (2026-07-03): all 5 still pass after full rerun.
  #
  # Status (2026-03-16): All 5 pass. Agent knows input mechanisms directly
  # from the new "How Items Enter the Box" section in the agent guide.
  # Status (2026-08-15, Codex): all 12 intake-tagged audits pass. The four
  # direct orientation questions below used no reads or searches. user-adds-item
  # also passed, but inspected the frontend to verify its exact UI instructions.

  - id: how-items-enter
    prompt: "How do items get into the box? What are the different ways things arrive?"
    expected_level: knows_directly
    watch_for: "Names capture UI, connectors, cb create, and chat — not manual file placement"
    correct_contains: ["capture"]
    correct_contains_any: ["connector", "connected services"]
    tags: [intake, navigation]
    notes: >
      The agent should know input mechanisms directly from the agent guide.
      The failure mode is telling users to "put" files in directories.

  - id: user-adds-item
    prompt: "A user wants to add a voice memo about something they're looking at. How do they do it?"
    expected_level: knows_directly
    watch_for: "Describes the capture UI (web interface) — not telling the user to create files or put things in directories"
    correct_contains: ["capture"]
    tags: [intake]
    notes: >
      The agent should know that users interact through the web UI.
      The failure mode is saying "create a file in box/inbox/" or
      "put the voice memo in store/documents/".

  - id: dont-tell-user-to-place-files
    prompt: "I have some documents I want to add to the box. Where should I put them?"
    expected_level: knows_directly
    watch_for: "Describes using the capture UI or a connector — does NOT say 'put them in box/inbox/' or any store/ path"
    tags: [intake]
    notes: >
      This is a trick question — the user says "where should I put them"
      which tempts the agent to name a directory. The correct answer is
      to describe the user-facing input mechanism (capture page, share
      extension, chat). The agent should not describe internal directory
      structure as if the user navigates it directly.

  - id: inbox-vs-store
    prompt: "What's the difference between box/inbox/ and store/archive/?"
    expected_level: knows_directly
    watch_for: "Inbox is for incoming/unprocessed items, archive is for processed/completed items"
    correct_contains: ["inbox", "archive"]
    tags: [intake, navigation]

  - id: wakeup-intake-flow
    prompt: "Walk me through what happens when new items arrive in the inbox during a wakeup cycle."
    expected_level: knows_about
    watch_for: >
      Describes the legacy reactor path: connectors sync, items land in inbox,
      intake jobs created in box/jobs/, reactor processes them. Bonus credit if
      the agent acknowledges the parallel new pipeline (intake → triage → handle,
      docs/triage.md) — but wakeup currently only drives the reactor path,
      so naming that flow is the primary expectation.
    correct_contains: ["job", "inbox"]
    tags: [intake, lifecycle, legacy-flow]

  # === Card Types and Schemas ===
  #
  # Status (2026-07-03): 8/8 pass. Fixed 4 stale expectations (memo-xml-structure,
  # create-question-card, question-directive, create-new-card-type) — the overhaul
  # moved card/question/extension knowledge into the always-on surface, so the
  # agent answers directly & correctly and the old `should_read` / `<directive>`
  # XML checks were obsolete. schema-validate-hook had regressed to a Zod
  # `.refine()` answer; FIXED by a corrective in agent-guide/cards.ts ("rules Zod
  # can't express go in the schema's `validate` hook, not a `.refine()`"). See
  # docs/reports/knowledge-audit-rerun-2026-07-03.md.
  # Status (2026-08-04): tab-arrangement-editing passed its first focused run
  # (2 file reads, 0 searches). Status (2026-08-10): passed after the switch to
  # annotated deletion (1 file read, 0 searches); the agent kept every UUID in
  # a proposed window, also marked deletions in close, and preserved explicit Apply.
  # Status (2026-08-15, Codex): all schema-tagged audits pass. The direct card
  # inventory, figure runtime, validation-hook, extensibility, and package-layout
  # questions were answered with no reads or searches; exact formats and
  # discoverable extension mechanics triggered targeted reference reads.

  - id: list-card-types
    prompt: "What card types do you know about? List them all."
    expected_level: knows_directly
    watch_for: "Lists types from agent guide without filesystem search"
    tags: [cards, schemas]

  - id: memo-xml-structure
    prompt: "Show me the XML structure of a memo card."
    expected_level: knows_directly
    watch_for: "Rejects the XML premise; describes YAML frontmatter + markdown body directly"
    correct_contains_any: ["frontmatter", "YAML"]
    tags: [cards, schemas]
    notes: >
      Trick question — cards are YAML frontmatter + markdown body, never XML
      (Phase 2 removed the XML card format). The agent should correct the
      premise and describe the real structure directly, not invent XML.

  - id: create-question-card
    prompt: "How would you create a new question card asking the user to pick a color?"
    expected_level: knows_directly
    watch_for: "Uses cb create for a question card and includes a directive; answers from the guide"
    correct_contains: ["cb create", "directive"]
    tags: [cards, schemas, questions]

  - id: question-directive
    prompt: "I want to ask the user whether to archive a recipe under store/recipes or store/archive. Create the question card."
    expected_level: knows_about
    watch_for: "Creates a question card with a directive: frontmatter field describing the concrete action (move the recipe)"
    cards_contain: ["directive:"]
    tags: [cards, questions]
    notes: >
      The directive is critical — without it, answering the question is a dead end.
      In the YAML card format it's a `directive:` frontmatter field, not an XML
      `<directive>` element (that form now survives only for procedure directives).
      The agent should describe the concrete action (e.g., move the recipe), not
      just restate the question.

  - id: question-answer-creates-job
    prompt: "What happens when a user answers a question?"
    expected_level: knows_about
    watch_for: "Mentions that a follow-up job is created from the directive, and (when the question declared learning:) that the job also records the confirmed belief"
    correct_contains: ["job", "directive"]
    tags: [questions, jobs]

  - id: tab-arrangement-editing
    prompt: >
      I shared my browser tabs through Callback Clerk. You are revising the
      resulting tab-arrangement card. How do you represent moving and closing
      tabs, and what happens when the proposal is ready?
    expected_level: knows_about
    should_read: ["docs/generated/card-tab-arrangement.md"]
    watch_for: >
      Preserves every original per-tab UUID exactly once in the proposed
      windows, additionally lists deleted UUIDs in close without removing them
      from their window positions, never substitutes URLs, and says status
      ready does not itself change Chrome: the boxholder must explicitly Apply
      in the viewer.
    correct_contains: ["UUID", "Apply"]
    tags: [cards, schemas, tab-arrangement]

  # === Gmail tracked working set ===
  # Status (2026-08-05): definitions added; focused run deferred to conserve
  # the boxholder's remaining model quota.

  - id: gmail-tracked-subset
    prompt: "Do the email cards in this box represent all of Gmail? How do you reach mail that is not present locally?"
    expected_level: knows_about
    should_read: ["docs/generated/card-email-thread.md"]
    watch_for: "Says cards are a tracked subset and uses the connector gws surface for other mail"
    correct_contains: ["tracked", "cb connector gmail gws"]
    tags: [gmail, cards, connectors]

  - id: gmail-track-thread
    prompt: "You found one useful Gmail thread that is not in the box. How do you add it to the working set, and what happens afterward?"
    expected_level: knows_about
    should_read: ["docs/generated/card-email-thread.md"]
    watch_for: "Uses the explicit track command with a thread ID and says regular sync keeps the resulting card current"
    correct_contains: ["cb connector gmail track", "sync"]
    tags: [gmail, cards, connectors]

  - id: gmail-delete-card
    prompt: "What happens in Gmail if I delete or trash a tracked email-thread card?"
    expected_level: knows_about
    should_read: ["docs/generated/card-email-thread.md"]
    watch_for: "Says card deletion stops tracking but does not delete the remote Gmail thread"
    correct_contains: ["stops tracking", "does not delete"]
    tags: [gmail, cards, lifecycle]

  - id: gmail-rule-procedure
    prompt: "Where do I configure a procedure to react to newly matching Gmail, and can it avoid starting an agent when a deterministic check finds nothing?"
    expected_level: knows_about
    should_read: ["docs/generated/card-email-thread.md"]
    watch_for: "Names config/connectors/gmail.json rules and says a procedure shell precheck can skip before an agent step"
    correct_contains: ["config/connectors/gmail.json", "precheck"]
    tags: [gmail, connectors, procedures]

  - id: gmail-gws-safety
    prompt: "Can you send, relabel, trash, or delete Gmail through cb connector gmail gws?"
    expected_level: knows_about
    should_read: ["docs/generated/card-email-thread.md"]
    watch_for: "Says the passthrough is read-only and rejects Gmail mutations"
    correct_contains: ["read-only"]
    tags: [gmail, connectors, safety]

  # === Figure Cards (canvas-loop runtime) ===
  #
  # Status (2026-07-15): 2/2 pass (knows_directly; agent read only the
  # generated card-figure.md schema doc, 0 searches, ~40k ctx). Both answer
  # from the figure schema instructions: runtime-canvas-loop is named directly,
  # and figure-canvas-loop-import-rule nails the reason — "the package isn't
  # resolvable inside a box, so a value import would fail at compile time;
  # type-only imports are erased" — plus the `cl`-injection detail.
  # Re-run 2026-07-15 after the review rounds rewrote the figure instructions
  # (params-snippet fix, warn-vs-silent wording, embed-mapping table, starters
  # split): 2/2 still pass, unchanged — the rewrites didn't degrade recall.

  - id: figure-canvas-loop-runtime
    prompt: "You want an interactive, deterministic canvas figure with auto-generated slider controls. What card do you create and what runtime do you declare?"
    expected_level: knows_directly
    watch_for: "Names a figure card with runtime: canvas-loop, from the figure schema instructions"
    correct_contains: ["figure", "canvas-loop"]
    tags: [cards, schemas, figure]

  - id: figure-canvas-loop-import-rule
    prompt: "In a canvas-loop figure's entry source, how do you import the canvas-loop types, and why that way?"
    expected_level: knows_directly
    watch_for: "Says import type only, because the package doesn't resolve inside a box (type-only imports are erased at compile; a value import fails)"
    correct_contains: ["import type"]
    tags: [cards, schemas, figure]
    notes: >
      The reason matters: @ianbicking/canvas-loop is not resolvable from a box
      directory, so a value import fails the esbuild compile. Type-only imports
      are erased, so `import type` compiles; the runtime API arrives as the
      factory's `cl` argument. A pass names the box-can't-resolve-the-package
      reason, not just the syntax.

  # === Questions: Lifecycle and Learning ===
  #
  # Status (2026-07-10): 3/3 pass on first run (the --filter questions run
  # also re-passed the three Card Types question audits above, 6/6 total,
  # plus triage-guess-handling — 7/7). All three answer from the always-on
  # questionsSection + question schema instructions; question-learning-sink
  # did confirmatory reading (13 files) but named learning.sink +
  # source: user-stated correctly.
  #
  # Track F (docs/implemented-plans/questions-end-to-end.md) additions. These probe the
  # two-product answer contract (directive + learning) and lifecycle facts
  # (dismissed/expired remain answerable) that the plan's "purpose frame"
  # depends on agents actually carrying. Deliberately NOT audited: the aging
  # sweep's nudge-latch mechanics (.callback-box/notified-questions.json) —
  # purely infrastructural bookkeeping no agent needs to recall to ask or
  # answer questions correctly; docs/questions.md is the durable reference
  # for a maintainer instead.

  - id: question-learning-sink
    prompt: >
      A question card has a learning: block and the boxholder answers it.
      Where does the confirmed belief actually get written down, and what
      marks it as coming directly from the boxholder rather than an
      inference?
    expected_level: knows_directly
    watch_for: >
      Names learning.sink (guide/briefing/personality) as the destination,
      written by the follow-up job created when the question is answered,
      tagged source: user-stated (the strongest evidence tier).
    correct_contains: ["user-stated"]
    tags: [questions, learning]

  - id: question-ask-decision-rule
    prompt: >
      You're running as a background job (not a chat) and you hit an
      ambiguity you genuinely can't resolve on your own. What do you do, and
      what do you check before asking?
    expected_level: knows_directly
    watch_for: >
      Says to finish by creating a question card (not guess past the
      ambiguity), declaring learning: when the destination is known; and
      says to check box/questions/ first — including answered/dismissed/
      expired cards, not just pending ones — before asking something that
      may already have been asked.
    correct_contains_any: ["learning", "box/questions"]
    tags: [questions]

  - id: question-dismissed-expired-meaning
    prompt: >
      What's the difference between a dismissed question and an expired one
      — and once a question is dismissed or expired, can it still be
      answered?
    expected_level: knows_directly
    watch_for: >
      Dismissed = the boxholder declined to answer it (a Dismiss action);
      expired = aged out by the sweep without an answer (default 30 days
      pending, overridable via expires-after). Both are non-closing states —
      the agent should say either remains answerable later; expiry only
      demotes visibility, never auto-answers.
    correct_contains: ["answerable"]
    tags: [questions]

  - id: guide-vs-procedure
    prompt: "What's the difference between a guide card and a procedure card?"
    expected_level: knows_about
    watch_for: "Reads both card type docs for accurate comparison"
    tags: [cards]

  - id: create-new-card-type
    prompt: "How would you create a brand new card type for this box?"
    expected_level: discoverable
    watch_for: "Names config/schemas/ + cardSchema()/Zod + cb init; reading config/schemas/CLAUDE.md is fine but the agent now knows the shape directly"
    correct_contains_any: ["config/schemas", "cb init"]
    tags: [schemas, extension]

  # Status (2026-07-03): pass. The always-on cards section (agent-guide/cards.ts)
  # now carries a corrective — "rules Zod can't express go in the schema's
  # `validate` hook, not a Zod `.refine()`" — so the agent answers directly
  # instead of reaching for its Zod prior. (Regressed after the overhaul when the
  # extension pointer named only Zod; the corrective restored it.) should_read
  # dropped: the agent knows it directly now.
  - id: schema-validate-hook
    prompt: >
      You're adding a card type whose rules go beyond what Zod field types can
      express — e.g. a cross-field constraint, or validating the body's parsed
      structure. Where does that validation go?
    expected_level: knows_about
    watch_for: >
      Names the schema's `validate` hook on cardSchema() — self-contained,
      co-located with the schema, returning LintIssue[]. Must NOT say to add a
      branch/type=== check to a central dispatch (card-lint.ts), nor a Zod
      `.refine()`. Knowing it sees only the card's own data is a plus.
    correct_contains: ["validate"]
    tags: [schemas, extension, validation]

  # === CLI Commands ===
  #
  # Status (2026-07-03): 8/9 pass. cb-chat-self-note-env now passes after
  # max_turns 10→20 (agent reaches script-env.ts but over-explores; needed room).
  # NEEDS DECISION: cb-session-exists — agent answers "past chat" via chat-thread
  # cards (interface-as-cards) rather than `cb session` (which still exists and
  # cb-session-how-to-use passes). See docs/reports/knowledge-audit-rerun-2026-07-03.md.

  - id: list-cb-commands
    prompt: "What cb commands are available to you? List the ones you'd use most."
    expected_level: knows_directly
    watch_for: "Lists commands from agent guide without running cb --help"
    tags: [cli]

  - id: move-card-syntax
    prompt: "How do you move a card from inbox to archive?"
    expected_level: knows_directly
    watch_for: "Correct cb mv syntax with source and destination"
    correct_contains: ["cb mv"]
    tags: [cli]

  # Status (2026-06-27): both pass against test1 — knows_directly, 0 files read /
  # 0 searches, answered straight from the agent guide's cb-mv + box-root-link
  # convention (behavior.ts). Landed with the markdown link-validation fix.
  # Status (2026-07-30): both still pass (0 reads / 0 searches, 43k ctx) after the
  # box-root-paths rewrite of the ref rule (REF_PATH_RULE, Track E);
  # internal-links-resolve-to-box-root's watch_for was widened to the new
  # "always write the leading /" framing.
  - id: move-store-content-uses-cb-mv
    prompt: "How do you move or rename content under store/ (a card, a directory, or a markdown dossier)?"
    expected_level: knows_directly
    watch_for: "Names cb mv and that it rewrites inbound references (incl. .md links); warns against raw git mv leaving links dangling"
    correct_contains: ["cb mv"]
    tags: [cli, links]

  - id: internal-links-resolve-to-box-root
    prompt: "A markdown link in a card or dossier is [x](/store/foo/bar.jpg). What does the leading slash mean?"
    expected_level: knows_directly
    watch_for: >
      Box root, not the OS filesystem root; the target must be an existing
      file/dir in the box. Leading `/` is also the form you always write
      (docs/implemented-plans/box-root-paths.md) — a bare path still resolves, but only
      as a legacy form, and `../` is never written.
    correct_contains: ["box root"]
    tags: [links]

  # === Refs are always written box-root-relative (Track G, box-root-paths) ===
  #
  # One rule, three angles: the chat-reply link, a landmark frontmatter ref, and
  # the single exception (`attach/`). The third exists specifically to keep the
  # always-`/` rule from swallowing the attach scope. Rule text lives in one
  # constant: REF_PATH_RULE (src/core/agent-guide/source.ts), reaching every
  # agent via ABOUT_CARDS + PROVENANCE.
  #
  # Status (2026-07-30): all 3 pass first run against the test1 clone, no
  # guidance changes needed. links-always-box-root and attach-is-the-exception
  # answered with 0 reads / 0 searches (49k / 43k ctx). landmark-ref-box-root
  # passes but read docs/generated/card-landmark.md first (5 turns) — weakest of
  # the three; it recalls the box-path rule but verifies the links[] field shape,
  # so re-check it if the landmark schema docs move.
  - id: links-always-box-root
    prompt: >
      There's a card at store/notes/Beta_Launch.doc.card. In your reply to me,
      write the markdown link you'd use to point me at it, and say why that
      path form.
    expected_level: knows_directly
    chat_mode: true
    watch_for: >
      Writes the target with a leading `/` — [the beta launch
      plan](/store/notes/Beta_Launch.doc.card) — and says it resolves from the
      box root. FAILS on a bare `store/notes/…` target or any `../` climb: those
      still resolve (legacy) but are not what gets authored. A human label
      rather than a bare filename as the link text.
    correct_contains: ["/store/notes/Beta_Launch.doc.card"]
    response_not_matches:
      - '\]\((?!/|attach/|https?:|#)'
      - '\]\(\.\./'
    tags: [links, chat, paths]

  - id: landmark-ref-box-root
    prompt: >
      I'm adding an entry to a landmark card's links list that points at the
      card store/recipes/Bread.recipe.card. Write the links[] entry.
    expected_level: knows_directly
    watch_for: >
      `ref: /store/recipes/Bread.recipe.card` — a box path with a leading `/`,
      the same rule as every other ref. FAILS on a landmark-dir-relative
      (`recipes/Bread.recipe.card`) or `../`-climbing ref: that was the old
      landmark-private convention, retired 2026-07-30. A `title`/label
      alongside `ref` is expected and fine.
    correct_contains: ["/store/recipes/Bread.recipe.card"]
    response_not_matches:
      - 'ref:\s*["'']?(?!/)[\w./-]*\.card'
    tags: [links, landmark, paths]

  - id: attach-is-the-exception
    prompt: >
      A card at store/trips/Trip.record.card has ![the cabin](attach/photo.jpg)
      in its body. Which file on disk is that pointing at?
    expected_level: knows_directly
    watch_for: >
      The card's OWN attach scope — store/trips/Trip.attach/photo.jpg — NOT a
      box-root `/attach/photo.jpg` and not a literal `attach/` directory beside
      the card. `attach/` is the one exception to the always-leading-`/` rule,
      and this audit guards it from being over-generalized away by that rule.
      Bonus: says a plain `.md` dossier owns no attach scope, so the prefix is
      card-only.
    correct_contains: ["Trip.attach/photo.jpg"]
    tags: [links, cards, attachments, paths]

  - id: validate-card
    prompt: "How do you validate a card after editing it?"
    expected_level: knows_directly
    watch_for: "Knows cb validate syntax; looking up docs is fine"
    correct_contains: ["cb validate"]
    tags: [cli]

  - id: cb-session-exists
    prompt: "I want to review the transcript of a past chat — what command gives me that?"
    expected_level: knows_directly
    watch_for: "Names cb session as the command for viewing Claude Code session transcripts"
    correct_contains: ["cb session"]
    tags: [cli]
    notes: >
      The agent should know cb session exists and is how to see past session
      content. Failure modes: pointing to raw JSONL files in ~/.claude, web UI
      navigation, or claiming no such command exists.

  - id: cb-session-how-to-use
    prompt: "How do I use cb session to catch up on just the conversation from the last day, without tool-call noise?"
    expected_level: knows_about
    watch_for: "Runs cb session --help (or reads the command source) to discover flags, then combines --since and --dialogue-only"
    correct_contains_any: ["--since", "cb session --help"]
    tags: [cli]
    notes: >
      The agent should reach for cb session --help (or read src/cli/commands/session.ts)
      to discover --since and --dialogue-only rather than guessing flags.
      A good answer lands on something like "cb session --since 1d --dialogue-only".

  - id: cb-chat-self-note-exists
    prompt: "You are running as a scheduled sub-agent (daily rumination, weekly research, etc.). After you've done your work and committed, how do you leave a short note in the live chat session so the boxholder sees what you did when they next revisit chat?"
    expected_level: knows_directly
    watch_for: "Names cb chat self-note as the mechanism — not a journal file, not a new card, not a commit message alone"
    correct_contains: ["cb chat self-note"]
    tags: [cli, chat]
    notes: >
      The agent should know cb chat self-note exists for precisely this
      scheduled-agent handoff case. Failure modes: describing a journal file
      in store/, creating a memo card in box/inbox/, relying on the commit
      message alone (which doesn't surface in chat), or posting via the
      regular chat endpoint (which would trigger a full conversational turn).

  - id: cb-chat-self-note-env
    prompt: "What environment variables does cb chat self-note require, and where do they come from?"
    expected_level: knows_about
    watch_for: "Names CB_BOX_NAME and CB_SERVER_URL; knows they're set by the scheduler/script-runner from config/box.json publicUrl, not hardcoded or defaulted"
    correct_contains_any: ["CB_BOX_NAME", "CB_SERVER_URL"]
    max_turns: 20
    tags: [cli, chat]
    notes: >
      Self-note intentionally has no default server/box — the caller must
      inherit them from the spawning harness. Scheduled scripts get them
      automatically via buildScriptEnv in src/core/script-env.ts, which
