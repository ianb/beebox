  # guide (behavior.ts + box-shape.ts) + the webpage/commentary schema
  # instructions.
  #
  # Status (2026-06-15): all 4 pass (verified). Captured page is a
  # .webpage.card; the boxholder's remarks are a separate .commentary.card in
  # its attach scope. Audits updated for the split, plus a new
  # webpage-vs-commentary entry.

  - id: commentary-destination
    prompt: >
      A boxholder wants a directory to be the place their saved web-page
      commentary documents get filed. How does a landmark mark a directory as
      a commentary destination?
    expected_level: knows_directly
    watch_for: >
      Names <destination for="commentary"> on the landmark card. Does not
      invent a new role, conflate it with <navigation>, or suggest editing
      app source.
    correct_contains: ["destination", "commentary"]
    tags: [landmarks, commentary]

  - id: commentary-capture-files
    prompt: >
      The boxholder captures a web page with the clerk browser extension's
      "Comment on this page" action. What files appear in the box?
    expected_level: knows_directly
    watch_for: >
      A .webpage.card (the readable rendering as its body, with
      source/captured/frozen frontmatter) plus the frozen snapshot at
      attach/page.frozen, and a separate .commentary.card inside the webpage
      card's attach scope for the remarks. Must not describe a single fused
      commentary card with attach/readable.md.
    correct_contains: ["webpage", "frozen"]
    tags: [commentary, clerk, webpage]

  - id: webpage-vs-commentary
    prompt: >
      In the box, what's the difference between a .webpage.card and a
      .commentary.card?
    expected_level: knows_directly
    watch_for: >
      webpage = a captured external page (readable markdown body + the original
      URL/capture provenance + a frozen snapshot). commentary = the boxholder's
      remarks about a document, living in that document's attach scope, with
      {% source %} anchors; a ref-free anchor points at the containing page.
      Must not conflate the two or say commentary holds the captured page.
    correct_contains: ["webpage", "commentary"]
    tags: [commentary, webpage]

  - id: commentary-anchors-author
    prompt: >
      In a commentary card, who turns the boxholder's selected spans into
      {% source %} anchors — the browser extension, or the box's chat agent?
    expected_level: knows_directly
    watch_for: >
      The chat agent authors the anchors from the user's selection; the
      extension only captures the page (readable + frozen) and creates the
      card. Must not credit the extension with the anchoring.
    correct_contains_any: ["chat agent", "the agent", "box's agent", "assistant"]
    tags: [commentary]

  # === Figure cards ===
  #
  # Status (2026-07-14): All 4 pass at knows_directly against the worktree
  # test1 box, after the responsive-sizing rewrite of the figure instructions
  # (size from mount.clientWidth + ResizeObserver; width/height fields and the
  # scaffolded `size` param removed). Each answers from the regenerated
  # card-figure.md (1 file read, 0 searches). figure-card-where-code-lives
  # returned an empty response on its first run (0 reads, 1 turn — an API/
  # harness glitch, not a knowledge gap) and passed on a single-id rerun.

  - id: figure-card-where-code-lives
    prompt: >
      You're authoring a figure card for an interactive graphic. Where does the
      runnable code go, and what does that file export?
    expected_level: knows_directly
    watch_for: >
      The code is a .ts file in the card's attach scope, pointed to by the
      `entry` frontmatter field (e.g. attach/sketch.ts); the card body is a
      prose description, not the code. The entry module default-exports
      (lib, { mount, figure }) => teardown. Must not say the code lives in the
      card body, nor describe it as a React view.
    correct_contains: ["attach", "entry"]
    tags: [figure, cards]

  - id: figure-card-runtimes
    prompt: >
      What kinds of interactive can a figure card run, and how is the kind
      chosen?
    expected_level: knows_directly
    watch_for: >
      p5.js, three.js, and D3 — selected by the `runtime` frontmatter field
      (p5js | three | d3). Must not invent unsupported runtimes as if built in.
    correct_contains_any: ["p5", "three", "d3"]
    tags: [figure, cards]

  - id: figure-card-embed-params
    prompt: >
      How do you embed a figure inline in a document and pass it a parameter?
    expected_level: knows_directly
    watch_for: >
      Use the image/embed syntax with a plain box path,
      ![caption](/store/…figure.card?name=value); the query-string params reach
      the sketch as figure.params. A plain [label](…figure.card) link (no !)
      stays a navigable link, not an inline embed. The embed target is a plain
      box path — must NOT use a `view:` prefix in the syntax (that scheme is
      retired; naming it as retired to warn against it is fine).
    tags: [figure, cards, embedding]

  - id: figure-card-responsive-sizing
    prompt: >
      You're writing the sketch for a new figure card. How do you decide the
      canvas width, and what must happen when the container resizes?
    expected_level: knows_directly
    watch_for: >
      Size from mount.clientWidth (with a fallback when it's 0, e.g. || 360),
      not a fixed pixel width or a `size` param. Watch the container with a
      ResizeObserver and disconnect it in teardown; derive layout from the
      current canvas size (p.width/p.height, etc.), not a captured constant.
      Must NOT say a fixed pixel width or a `size` param is the right approach.
    correct_contains_any: ["clientWidth", "ResizeObserver", "container"]
    tags: [figure, cards]

  # Status (2026-07-01): all three below pass against ~/src/boxes/test1 —
  # the agent recalls link-vs-embed with plain box paths (no view:/?zoom) and
  # that views attach to a card type via rendersCardTypes, directly (0 files
  # read). Part of the normalize-chat-links work.
  # Status (2026-07-30): chat-link-vs-embed-card re-run under box-root-paths
  # Track G — still passes (0 reads, 43k ctx); its watch_for already matched the
  # new always-leading-`/` rule (Track C fixed it), so no edit was needed.
  - id: chat-link-vs-embed-card
    prompt: >
      In chat, how do you reference a card so the user can open it, versus show
      it inline? What path form should you write?
    expected_level: knows_directly
    watch_for: >
      A plain markdown link [label](/store/x.card) references the card — clicking
      opens it in the companion pane. Prefix with ! — ![label](/store/x.card) —
      to embed it inline. Always write the box path with a leading / — chat
      links and embeds resolve from the box root, never from the chat's working
      directory (a bare path lands at the box root too). Must NOT use a `view:` prefix
      or a `?zoom` flag in the syntax — both are retired (naming them as retired
      to warn against them is fine).
    response_not_contains: ["?zoom", "zoom flag"]
    tags: [chat, links, embedding]

  - id: views-attach-to-cards
    prompt: >
      A user asks you to build a custom dashboard view. How is a view wired up —
      can it stand alone, or must it attach to something?
    expected_level: knows_directly
    watch_for: >
      Every view attaches to a card type (via rendersCardTypes) and is selected
      with ?view=name on a card's path; there is no card-less standalone view. A
      dashboard is itself a card type whose view reads a collection. Must NOT
      propose a standalone/slug-addressed page not tied to a card.
    correct_contains_any: ["rendersCardTypes", "attaches to a card", "attach to a card", "not standalone", "bind to a card"]
    tags: [views, cards]
    notes: >
      Passes 2026-07-03 after fixing a box-staleness bug (NOT an incomplete
      migration — an earlier note wrongly said so). The code was already correct:
      the `view:` URL scheme is retired (view-url.ts) and every view attaches to a
      card (ViewPage: "no card-less standalone view"). But box `views/CLAUDE.md`
      was refreshed only on explicit `cb init`, not on the generateDocs cycle, so
      test1 carried the old standalone-view guide. Fixed by giving installViewsGuide
      the template-tracker treatment, wiring it into generateDocs, and adding
      views/CLAUDE.md to TEMPLATE_MANAGED_PATTERNS (so the refresh commits + ships).
      Check accepts either the literal `rendersCardTypes` (when the agent reads the
      guide) or the attach-to-a-card concept (when it answers directly). See
      docs/reports/knowledge-audit-rerun-2026-07-03.md.

  # === Courseware (course / concept-map / exposition-plan / lesson-plan / progress + build-course skill) ===
  #
  # Status (2026-07-03): all 12 pass against test1. courseware-exposition-plan was
  # failing only on the stale should_read (agent recalls "keep the reasoning in"
  # directly) — dropped it, matching the -concept-map-edges / -lesson-plan fixes.
  #
  # Status (2026-06-25): All 12 pass against the worktree box. The agent reaches
  # for build-course / probing first, names the course's parts, picks the right
  # closed-set edge (commonly-confused-with), affirms cycles are valid spirals,
  # recalls the progress evidence contract and the exposition-plan's keep-the-
  # reasoning-in rule, names the lesson-plan as the ordered interactive/material
  # flow, puts material in doc/figure cards under material/ (not a README), and
  # distinguishes lesson-plan (ordered what-to-do) from exposition-plan (how/why),
  # and explains that a built course is *run* as a tutoring chat reached from a
  # landmark that scopes the session to the course's attach dir. It also names
  # the concept-map construction rules (entity names, no orphans, no degenerate
  # chain) and how a node's (kind, depth) pair steers the teaching approach.
  # Two false-negatives (-concept-map-edges, -lesson-plan): the agent answered
  # correctly from recall rather than reading the named should_read file, so the
  # should_read was dropped in both (the content match is the real assertion).
  # Run with `--filter courseware`.

  - id: courseware-build-a-course
    prompt: >
      Someone asks you to teach them how chemical reactions work. How do you go
      about building a course for them?
    expected_level: knows_about
    watch_for: >
      Reaches for the build-course skill / understands the learner FIRST
      (a phenomenon-anchored, Piagetian probe) rather than writing a course cold.
    correct_contains_any: ["probe", "build-course"]
    tags: [courseware]
    notes: >
      Building a course starts by understanding the learner, not by generating
      content. The failure mode is producing a polished course cold.

  - id: courseware-course-composition
    prompt: "What does a course card hold? What are its parts?"
    expected_level: knows_about
    should_read: ["docs/generated/card-course.md"]
    watch_for: >
      Names the concept-map and exposition-plan (embedded), the material/ subdir,
      and that progress is tracked separately.
    correct_contains: ["concept-map", "exposition-plan"]
    tags: [courseware]

  - id: courseware-concept-map-edges
    prompt: >
      In a concept-map, two ideas that learners frequently mix up with each
      other — which edge type connects them?
    expected_level: knows_about
    watch_for: "Picks commonly-confused-with from the closed edge set."
    correct_contains: ["commonly-confused-with"]
    tags: [courseware]
    # No should_read: consulting the concept-map docs by grep is as valid as
    # reading the file — the assertion is naming the right closed-set edge.
    notes: >
      Tests the edge-type rubric. Edges carry a required kind from a closed set
      (no 'other'); the right one for confusable ideas is commonly-confused-with.

  - id: courseware-concept-map-cycles
    prompt: >
      Can a concept-map have two concepts that each depend on the other — a
      cycle? Or is that an error to fix?
    expected_level: knows_about
    should_read: ["docs/generated/card-concept-map.md"]
    watch_for: >
      Says cycles are valid/intended (spirals), often via complements edges —
      NOT an error to fix.
    correct_contains_any: ["complements", "spiral", "intended", "not an error", "valid"]
    tags: [courseware]
    notes: >
      The graph is deliberately loose; a complements cycle is an honest spiral,
      not a modeling error. Failure mode: insisting the graph be acyclic.

  - id: courseware-progress-evidence
    prompt: >
      I'm recording that a learner has 'solid' understanding of a concept. What
      does that progress entry need to include?
    expected_level: knows_about
    should_read: ["docs/generated/card-progress.md"]
    watch_for: >
      Says every status needs evidence (what the learner said/did) plus a basis —
      there is no anonymous rating.
    correct_contains: ["evidence"]
    correct_contains_any: ["basis", "observed"]
    tags: [courseware]
    notes: >
      The evidence contract is schema-enforced: status + basis + >=1 evidence
      item. Failure mode: recording a status with no grounding.

  - id: courseware-exposition-plan
    prompt: "What is an exposition-plan card for, and what should it always keep?"
    expected_level: knows_about
    watch_for: >
      It's the plan for how to PRESENT the material; it keeps the reasoning /
      rationale in so later adaptation stays coherent.
    correct_contains_any: ["rationale", "reasoning"]
    tags: [courseware]

  - id: courseware-lesson-plan
    prompt: >
      In a course, where does the ordered plan of what actually happens — which
      parts are live chat vs a pre-made artifact, and in what order — live?
    expected_level: knows_about
    watch_for: >
      Names the lesson-plan card: an ordered sequence of segments, each tagged
      interactive (live in chat) or material (uses a pre-made card).
    correct_contains: ["lesson-plan"]
    correct_contains_any: ["interactive", "material", "segment"]
    tags: [courseware]
    # No should_read: the agent answers this correctly from recall (naming the
    # lesson-plan + its interactive/material segments) without opening the file —
    # a stronger result than reading it. The content match is the real assertion.
    notes: >
      The lesson-plan is the delivery-flow layer. Failure mode: conflating it
      with the exposition-plan, or improvising a material/README.

  - id: courseware-material-convention
    prompt: >
      You're adding teaching material to a course — a written recap and a figure
      to manipulate. Where, and in what form, do those go?
    expected_level: knows_about
    watch_for: >
      doc/figure CARDS in the course's material/ subdirectory — NOT a
      material/README.md or loose prose.
    correct_contains: ["material/"]
    correct_contains_any: ["doc", "figure", "card"]
    tags: [courseware]
    notes: >
      Material is proper presentational cards under material/, never a stray
      README. Failure mode: dumping prose into material/README.md.

  - id: courseware-lesson-vs-exposition
    prompt: >
      A course has both an exposition-plan and a lesson-plan. What's the
      difference — which one holds what?
    expected_level: knows_about
    watch_for: >
      exposition-plan = how/why to present (rated approaches + compiled rules);
      lesson-plan = the ordered what-to-do (the interactive-vs-material
      sequence). The WHY lives in the exposition-plan, not the lesson-plan.
    correct_contains: ["exposition-plan", "lesson-plan"]
    correct_contains_any: ["sequence", "order", "flow", "rules"]
    tags: [courseware]
    notes: >
      The one confusion worth auditing. exposition-plan = rules/rationale;
      lesson-plan = ordered flow. Failure mode: putting rationale in the
      lesson-plan, or treating the two as the same thing.

  - id: courseware-good-concept-map
    prompt: >
      What makes a concept-map well-built, beyond the edges resolving? Name a
      couple of shape or naming problems to avoid.
    expected_level: knows_about
    watch_for: >
      Names entity (not question) labels, no orphan nodes, avoiding a degenerate
      straight-line chain (real graphs branch), edges as real relations,
      right granularity, scoped to fit. Any two or three is a pass.
    correct_contains_any: ["orphan", "question", "linear", "chain", "branch", "granular"]
    tags: [courseware]
    notes: >
      The construction rules in the concept-map card-rule. The orphan lint
      catches one class; the rest is authoring discipline + agent self-review.

  - id: courseware-bloom-steers-teaching
    prompt: >
      A concept-map node has a `kind` and an optional Bloom `depth`. How do those
      two together affect how you'd teach it?
    expected_level: knows_about
    watch_for: >
      The (kind, depth) pair is the first cut at approach: e.g. a fact at
      remember → spaced retrieval; a principle at analyze → contrasting cases;
      an "understand" target is not served by a passive read. Depth + kind feed
      the exposition-plan's approach choice.
    correct_contains_any: ["depth", "Bloom", "retrieval", "contrasting", "approach"]
    tags: [courseware]
    notes: >
      Bloom is used as instruction, not mechanism: the labels are defined in the
      concept-map rule and referenced in the exposition-plan to differentiate
      approaches by level.

  - id: courseware-run-a-course
    prompt: >
      A course has already been built in the box. How does someone actually run
      it — start a tutoring session where the agent teaches it?
    expected_level: knows_about
    watch_for: >
      A course is run as a chat SCOPED to its attach directory, reached from a
      landmark (a chat destination); the scoped CLAUDE.md (which @-includes the
      runner instructions) and the path-globbed exposition rules auto-load, and
      the agent follows the lesson-plan and updates progress.
    correct_contains_any: ["landmark", "tutoring", "chat scoped", "attach"]
    tags: [courseware]
    notes: >
      The run side, distinct from build-course. Entry = a landmark chat
      destination that scopes the chat to the course attach dir, where a thin
      CLAUDE.md (@course-runner.md) and the exposition rules auto-load. Failure
      mode: thinking a built course just sits there with no way to conduct it.

