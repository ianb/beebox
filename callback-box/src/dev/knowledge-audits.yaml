  # declined/unavailable. Surfaced in Key Commands (always-loaded agent guide)
  # plus a sentence on the chat prompt's state-snapshot section, so a
  # chat-mode agent should recall it without reading source.
  #
  # Status (2026-07-11): 1/1 passes — direct knowledge (0 reads, 0 searches).
  # The agent named `cb chat screenshot` for the visual/layout case and knew
  # it can be declined/unavailable, from the agent-guide line + chat-prompt
