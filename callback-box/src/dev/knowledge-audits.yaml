  # the store/grant flow. secrets-adhoc-use unchanged (0 reads, pass).

  - id: secrets-provisioning
    prompt: "How does a Mistral API key get configured for this box?"
    expected_level: knows_directly
    watch_for: >
      Says credentials live in a machine-level store outside the box, one
      copy each, and the boxholder supplies the value and grants it to this
      box (via `cb secrets` — declare/set/grant — or the admin page's
      Secrets section). Should NOT say to write or edit
      `config/connectors/mistral.secret.json`, and should NOT describe the
      key as something that lives inside the box tree.
    correct_contains_any: ["machine-level", "cb secrets", "grant", "admin page", "boxholder"]
    response_not_contains: ["config/connectors/mistral.secret.json", "mistral.secret.json", ".secret.json"]
    tags: [secrets]

  - id: secrets-adhoc-use
    prompt: >
      I'm writing a trick that needs to call a credentialed third-party API
      (an API key). How should the trick get and use that key?
    expected_level: knows_directly
    watch_for: >
      Says: `cb secrets declare <name>` to name the slot, the boxholder
      supplies the value and grants it (at `agent` access) via the capture
      widget or admin page, and the trick resolves the value at call time via
      `POST /api/secrets/resolve` with the agent bearer token — holding it
      only for the length of that one outbound request. Should NOT say to
      paste the key into the code, write it to a file, put it in an env var,
      or log it.
    correct_contains_any: ["cb secrets declare", "secrets/resolve", "resolve"]
    correct_matches:
      - "call time|per[- ]call|each (?:call|request)|every (?:call|request|time)"
    response_not_contains: ["write it to a file", "save it to a file", "store it in a file", "config/connectors", ".secret.json"]
    tags: [secrets]
