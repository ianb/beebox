    watch_for: >
      Names `cb chat screenshot` as the way to get a real screenshot of what
      the user currently sees (the right reach for a visual/layout question,
      as opposed to whats-changed for content or just reading source), and
      knows it asks the user's browser — so it may come back declined or
      unavailable rather than always returning an image.
    correct_contains: ["cb chat screenshot"]
    correct_contains_any: ["declin", "unavailable", "no-client", "no client", "may not"]
    tags: [chat, screenshot, see-as-the-user]

  - id: views-write-conflict-safe
