  # === Last-Audio Fetch (cb chat get-last-audio) ===
  #
  # Deliberately low-promoted: one INPUT FORMAT line in the chat prompt, a
  # brief cb-commands.md entry, nothing in Key Commands. The audit pins the
  # intended level: a chat agent should reach for it when the exact audio
  # matters (bad-but-important transcript, sound-sensitive work like
  # language practice), without it being pitched as a routine chat tool.
  #
  # Status (2026-06-12): 1/1 passes — direct knowledge (0 reads, 0 searches)
  # from the single trailing sentence on the chat prompt's transcription
  # bullet, after that sentence was reworked to lead with ask-about-audio.
  # An earlier action-shaped phrasing failed only on the literal
  # contains-check (see notes).
  #
  # Status (2026-08-15, --message targeting): the original "how would you
  # do it" phrasing now FAILS — the agent answered fluently (named
  # re-transcribe / ask-the-audio, even said "works per-message") but never
  # wrote `--message` or `message-id` literally, since the question doesn't
  # ask for CLI syntax. Reworded to ask "what command... and what do you
  # need from my message to point it at the right recording" — 1/1 passes:
  # the agent named `cb chat ask-about-audio "<question>" --message <id>`
  # and `cb chat retranscribe --message <id>`, explained the id is
  # system-written and read off the message (never supplied by the user,
  # never fabricated). 0 reads, 0 searches, 52k ctx.

  # Status (2026-08-23, hq-dictation-switch): re-run after widening `stt`'s
  # vocabulary (`stt="hq"`) and adding the retranscribe-clause exception. 1/1
  # passes, 0 reads, 0 searches, 54k ctx — unaffected by the change.

  - id: chat-last-audio-when
    prompt: >
      My dictated messages sometimes come out mangled. If a transcription
      were important to get exactly right, what command would you run to
      check the actual audio of what I said, and what do you need from my
      message to point it at the right recording?
    expected_level: knows_directly
    chat_mode: true
    watch_for: >
      Names `cb chat ask-about-audio` (or `get-last-audio`) as the way to
      get at the original recording of a voice message, rather than
      claiming the transcript is all it has or asking the user to repeat
      everything. Should also know the command needs `--message <id>` —
      the id comes from the `message-id="…"` attribute on the message's
      `<speech>` wrapper, never fabricated — not a bare invocation.
    correct_contains_any: ["retranscribe", "ask-about-audio", "get-last-audio"]
    correct_matches:
      - "--message|message-id"
    tags: [chat, voice, last-audio]
    notes: >
      Phrased as "how would you" deliberately: an action-shaped prompt
      ("can you check what I just said?") made the agent *run* the command
      without naming it — which proved the knowledge but failed the literal
      contains-check, and the audit sandbox has no live chat tab to answer
      the fetch anyway.

  # === See as the User (cb chat screenshot) ===
  #
  # One agent-facing concept: the chat agent can request a screenshot of what
  # the user currently sees with `cb chat screenshot` — for visual/layout
  # questions, as distinct from `whats-changed` (content) or reading source —
