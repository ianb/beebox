  # === Box Packageify (boxes-as-packages-v2, Track H5) ===
  #
  # Only meaningful for a shapeVersion 2+ (package-layout) box —
  # `boxCodeLocationSection` (agent-guide/box-shape.ts) teaches the
  # package-root code layout, so these audits assume the box under test is v2
  # (test1 is, as of the 2026-07 fleet conversion).
  #
  # Status (2026-07-04): 4/4 pass against ~/src/boxes/test1 (a real converted
  # v2 box). box-packageify-cb-upgrade needed a source fix first: the agent
  # guide's "Box-Owned Code" section named the boxholder's upgrade job but
  # never the `cb upgrade` verb itself, so a knows_directly audit for it
  # would have failed on a genuine recall gap — added one sentence naming
  # `cb upgrade` explicitly (agent-guide/box-shape.ts) and it now passes with
  # 0 files read... in practice the agent still reads source to describe the
  # full upgrade flow (over-eager, not a failure — the correct_contains
  # check only requires the phrase to appear). The other three passed
  # unmodified. Note (not fixed as part of this audit, out of scope): the
  # schemas-location audit surfaced that `src/schemas/CLAUDE.md` in test1 is
  # a stale, un-refreshed copy of the schemas guide template — it still
  # mentions the removed `cardworks` package and bare `zod`/`yaml` imports
  # that don't resolve in a v2 box. The current source template
  # (`SCHEMAS_CLAUDE_MD_V2` in `src/core/box-templates.ts`) has already
  # dropped the `cardworks` section; test1's on-disk copy just hasn't been
  # refreshed (a `cb init` re-run should fix it via the template tracker).

  - id: box-packageify-schemas-location
    prompt: "Where do this box's local card schemas live, and what do they import?"
    expected_level: knows_directly
    watch_for: >
      Names src/schemas/ at the package root (not config/schemas/) and the
      real library imports — callback-box/cards for cardSchema()/body, and
      callback-box/schema for z (Zod) and yaml — not a bare `zod` dependency.
    correct_contains_any: ["src/schemas", "../src/schemas"]
    tags: [box-packageify, schemas, extension]
    notes: >
      Comes from the "Box-Owned Code" agent-guide section
      (agent-guide/box-shape.ts), which only renders for a package (v2) box.

  - id: box-packageify-views-location
    prompt: "You want to add a custom view. Where does the file go and what may it import?"
    expected_level: knows_directly
    watch_for: >
      Names src/views/ at the package root, the callback-box/view-widgets
      exports surface, and that it's hot-reloaded — no restart needed to see
      an edit take effect.
    correct_contains_any: ["src/views", "../src/views"]
    tags: [box-packageify, views, extension]
    notes: >
      Same section as box-packageify-schemas-location; the hot-reload claim
      ("Editable, hot-reloaded — no restart needed") is the part most likely
      to regress silently if the section is trimmed.

  - id: box-packageify-stance-b-off-limits
    prompt: "What parts of the box repository are off-limits to you during normal operation?"
    expected_level: knows_directly
    watch_for: >
      Names package.json, node_modules/, lockfiles, tsconfig.json, and src/
      outside the three editable code dirs (schemas/views/tricks) as not the
      operating agent's to edit — Stance B. Should not claim schemas/views/
      tricks themselves are off-limits (those ARE editable).
    correct_contains_any: ["package.json", "node_modules"]
    tags: [box-packageify, stance-b]
    notes: >
      "Stance B" per docs/implemented-plans/boxes-as-packages-v2.md: the operating agent
      may edit the hot-reload surface (schemas/views/tricks) but not the rest
      of the package (deps, build config).

  - id: box-packageify-cb-upgrade
    prompt: "How does the boxholder upgrade this box's engine to a newer callback-box version?"
    expected_level: knows_directly
    watch_for: >
      Names `cb upgrade`, run by the boxholder from outside this session —
      and does NOT offer to run it itself unprompted.
    correct_contains: ["cb upgrade"]
    tags: [box-packageify, upgrade]
    notes: >
      `cb upgrade` (src/cli/commands/upgrade.ts) is an operator verb, not
