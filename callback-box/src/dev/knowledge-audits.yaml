    tags: [drive]

  # === Google Drive / Documents ===
  #
  # The drive connector handles both spreadsheets and docs. These tests
  # verify the agent doesn't claim docs are unsupported and knows the
  # local-edit + conflict-resolution flow.

  - id: drive-docs-supported
    prompt: "Can I sync a Google Doc into this box, or only spreadsheets?"
    expected_level: knows_directly
    watch_for: "Says yes, Google Docs are supported. Should NOT say only spreadsheets work."
    correct_contains_any: [".doc.card", "Google Docs", "doc card"]
    tags: [drive, docs]

  - id: drive-docs-edit
    prompt: "How do I edit the body of a Google Doc that's been synced into the box?"
    expected_level: knows_about
    watch_for: "Says edit the sibling .md file (NOT the card XML, NOT a JSON file)"
    correct_contains: [".md"]
    tags: [drive, docs, editing]

  - id: drive-docs-not-json
    prompt: "Is a synced Google Doc stored as JSON like a spreadsheet?"
    expected_level: knows_directly
    watch_for: "Says no — docs are stored as markdown, not JSON. JSON is the spreadsheet format."
    correct_contains_any: ["markdown", ".md"]
    tags: [drive, docs]

  - id: drive-docs-conflict
    prompt: "I edited a synced Google Doc locally but it didn't push. There's a file called Notes.remote.md next to it. What happened and what do I do?"
    expected_level: knows_about
    watch_for: "Identifies this as a sync conflict. Explains the upstream changed since last pull and that resolution is: merge the two files, delete .remote.md, commit."
    correct_contains_any: ["conflict", "merge"]
    tags: [drive, docs, conflict]

  - id: drive-docs-lossy
    prompt: "If a Google Doc has comments and footnotes, what happens to them when I sync?"
    expected_level: knows_about
    watch_for: "Mentions the <lossy> block and that comments/footnotes don't survive markdown export. Should warn the user that pushing local edits will destroy them."
    correct_contains_any: ["lossy", "don't survive", "destroy", "lost"]
    tags: [drive, docs, lossy]

  # === Email Outbound (drafts) ===
  #
  # email-outbound is the agent-authored card type for emails leaving via
  # Gmail. Today it's always status="draft" (uploaded to Gmail's drafts
  # folder for human review); future status="sent" will direct-send.
  # The schema's `instructions` block teaches authoring; these audits
  # verify the agent can find that knowledge.
  #
  # Status (2026-04-28): split from email-message after the unified design
  # caused the wakeup intake to triage drafts as incoming mail. Cold
  # prompt (`draft-email-can-write`) remains stochastic — agent guide
  # surfaces the type but not the capability — see open gap note below.
  # Open gap: cold-prompt reliability would improve by adding an outbound
  # hint to cards.ts or a new section in box-shape.ts.

  - id: draft-email-can-write
    prompt: "Can you write a draft email reply for me, or do I have to compose it in Gmail myself?"
    expected_level: knows_about
    watch_for: >
      Says yes — names the email-outbound card type and indicates the
      gmail connector uploads it as a draft on next sync. Should NOT say
      "Gmail integration is read-only" or suggest saving the reply as a
      memo.
    correct_contains: ["email-outbound"]
    correct_contains_any: ["draft", "gmail-draft", "uploads", "sync"]
    tags: [email, drafts]
    notes: >
      Cold prompts — without context anchoring to a specific email — are
      where this fails: the agent guide lists email-outbound but doesn't
      flag it as the way to compose mail. The agent often guesses
      "Gmail is read-only." Fix is to surface the capability in cards.ts
      so the agent at least knows to read the doc.

  - id: draft-email-format
    prompt: "Show me what a draft reply email card looks like — what XML do I write?"
    expected_level: knows_about
    watch_for: >
      Reads docs/generated/card-email-outbound.md (or schema source) and
      shows <email-outbound> with <to>, <subject>, <body>, and
      <in-reply-to ref="..." /> for replies.
    correct_contains: ["email-outbound"]
    correct_contains_any: ["in-reply-to", "<body>"]
    should_read: ["card-email-outbound.md"]
    tags: [email, drafts]

  - id: draft-email-placement
    prompt: "If you're drafting a reply to an email I received, where on disk should the draft card go?"
    expected_level: knows_about
    watch_for: >
      Reply drafts go inside the existing thread directory under
      box/inbox/email/ (next to the msg-NNN cards), as a
      *.email-outbound.card file. NOT a separate outbox tree.
    correct_contains_any: ["thread", "box/inbox/email"]
    tags: [email, drafts]

  - id: draft-email-after-upload
    prompt: "After gmail sync runs and you've drafted an email, how do I find and review the draft in Gmail itself?"
    expected_level: knows_about
    watch_for: >
      Mentions that the connector stamps the card with gmail-draft-url
      after upload, and the user clicks that URL to open the draft in
      Gmail. Should NOT say to search Gmail by subject or check the
      drafts folder manually as the only option.
    correct_contains_any: ["gmail-draft-url", "url", "link"]
    tags: [email, drafts]

  - id: draft-email-body-format
    prompt: "What formatting can I use in a draft email body? Can I use markdown?"
    expected_level: knows_about
    watch_for: >
      Names the limited markdown subset (bold **text**, italic *text*,
      links [text](url)) and says nothing else is supported. Should NOT
      claim full markdown or full HTML support.
    correct_contains_any: ["bold", "italic", "**", "limited", "subset"]
    tags: [email, drafts]

  - id: outbound-not-treated-as-incoming
    prompt: "If you write a draft reply, will the inbox triage code treat it like a new incoming email and try to process it?"
    expected_level: knows_about
    watch_for: >
      Says no — drafts are *.email-outbound.card files, intake/triage
      globs *.email-message.card so they're invisible. Should NOT say
      drafts use status="draft" on email-message (that was the old
      design).
    correct_contains: ["email-outbound"]
    tags: [email, drafts]

  # === Landmarks ===
  #
  # Landmarks are the user-navigation overlay on the box's filesystem.
  # The agent should know they exist and what they're for, but should
  # NOT freelance creation. Curation criteria live in
  # docs/landmark-curation.md; the schema reference is at
  # docs/generated/card-landmark.md.
  #
  # Status (2026-05-04): All 7 pass. landmarks-vs-directories initially
  # failed on a too-narrow keyword check (agent answered with "boxholder"
  # / "you" instead of "user") — broadened correct_contains_any to
  # include "boxholder" and "you", which matches project terminology.
  #
  # Status (2026-05-05): Added landmark-template-ref. Refined
  # landmark-link-attribute to specify "hand-listed" since templates
  # use template-ref. Both new/refined audits pass.

  - id: landmarks-purpose
    prompt: "What is the Landmarks page in this box for?"
    expected_level: knows_directly
    watch_for: >
      Describes landmarks as a quick-jump surface for the spots the user
      actually returns to — a user-navigation overlay on the directory
      tree. NOT a directory listing, NOT a creation tool, NOT a TOC.
    correct_contains_any: ["return", "navigate", "user", "quick"]
    tags: [landmarks, navigation]

  - id: landmarks-vs-directories
    prompt: "Why have landmarks if the box already has a directory tree?"
    expected_level: knows_directly
    watch_for: >
      Explains that file layout organizes the box for the system, while
      landmarks orient that organization to the boxholder's mental model
      — the places they actually inhabit. The directory tree is for
      storage; landmarks are for the boxholder.
    correct_contains_any: ["mental model", "user", "boxholder", "perspective", "navigate", "you"]
    tags: [landmarks, navigation]

  - id: landmarks-recurrence-signal
    prompt: "I have asked you about my recipes three times this week already. Should you do something?"
    expected_level: knows_about
    watch_for: >
      Reads docs/landmark-curation.md, recognizes recurrence as the
      signal that argues for a landmark, and proposes one to the user
      as a question — does NOT silently create one. Does NOT treat the
      question as purely about the recipes themselves.
    should_read: ["docs/landmark-curation.md"]
    correct_contains_any: ["landmark"]
    tags: [landmarks, curation]
    notes: >
      The agent should read the curation doc and propose a landmark
      rather than creating one quietly. Failure modes: creates the
      landmark silently, or ignores the recurrence signal entirely.

  - id: landmarks-criteria
    prompt: "What makes a directory worth turning into a landmark?"
    expected_level: knows_about
    watch_for: >
      Reads docs/landmark-curation.md and answers in user-perspective
      terms — recurrence in conversation, places the user returns to,
      navigational asks rather than search. Does NOT cite size, volume,
      or technical importance as criteria.
    should_read: ["docs/landmark-curation.md"]
    correct_contains_any: ["recurrence", "return", "user", "navigate"]
    tags: [landmarks, curation]

  - id: landmarks-not-everywhere
    prompt: "Should every directory under store/ get its own landmark?"
    expected_level: knows_about
    watch_for: >
      Says no. Explains that the Landmarks page is meant to be short —
      a half-dozen high-traffic spots, not a complete map of the box.
      Does NOT just answer "yes, for organization."
    should_read: ["docs/landmark-curation.md"]
    correct_contains_any: ["no", "few", "short"]
    tags: [landmarks, curation]

  - id: landmarks-dont-create-quietly
    prompt: "I keep asking about the household budget folder. Set up a landmark for it."
    expected_level: knows_about
    watch_for: >
      Confirms the user's intent and the spot before creating. May
      create the landmark since the user explicitly asked, but should
      NOT proceed without confirming the symbol/label or hand-waving
      the curated links. Reads docs/landmark-curation.md or
      docs/generated/card-landmark.md before writing.
    should_read: ["docs/landmark-curation.md"]
    tags: [landmarks, curation]
    notes: >
      Even with explicit user direction, creation is editorial work —
      the agent shouldn't fire-and-forget. The interesting failure
      mode is creating with a generic label/symbol the user wouldn't
      recognize.

  - id: landmark-link-attribute
    prompt: "When I add a hand-listed link inside a landmark card, what attribute names the target?"
    expected_level: knows_about
    watch_for: >
      Reads docs/generated/card-landmark.md and answers `ref` —
      not href, not path, not url, not target. May also note that
      templates inside <expand> use template-ref instead.
    should_read: ["docs/generated/card-landmark.md"]
    correct_contains: ["ref"]
    tags: [landmarks, schemas]

  - id: landmark-template-ref
    prompt: "I want a landmark that automatically lists every recipe in my recipes directory. How do I write the <link> inside the <expand> template?"
    expected_level: knows_about
    watch_for: >
      Reads docs/generated/card-landmark.md and uses
      `template-ref="${path}"` (NOT `ref="${path}"`) inside the
      template. Should explain or imply why: ref is for literal
      paths the validator can resolve, template-ref carries
      placeholders that get substituted at render time.
    should_read: ["docs/generated/card-landmark.md"]
    correct_contains: ["template-ref"]
    tags: [landmarks, schemas]
    notes: >
      The failure mode this guards against: writing
      <link ref="${path}"/> inside <expand>, which the validator
      rejects because ${path} doesn't resolve to a real file.

  # === Landmark Sessions (chat cwd binding) ===
  #
  # Chats started from a landmark spawn the SDK with `cwd` set to the
  # landmark directory and the box root in `additionalDirectories`, so
  # the subdirectory's CLAUDE.md walk-up loads automatically. This
  # section audits that behavior end-to-end: a fixture CLAUDE.md with
  # a unique marker is written into a throwaway subdirectory, the agent
  # is asked about the marker from that cwd, and we assert it answered
  # directly without reading the file.
  #
  # `context_dir` and `fixture` are the audit-runner fields that drive
  # this — see docs/knowledge-audits.md.
  #
  # Status (2026-05-10): landmark-subdir-claude-md-loads passes —
  # agent answered "ZK-4827-LANDMARK" with 0 file reads and 0
  # searches, confirming the SDK auto-loads the subdirectory
  # CLAUDE.md when cwd is set there.
  #
  # Status (2026-05-11): landmark-parent-claude-md-loads added and
  # passes — agent quoted the box-root CLAUDE.md's CLAUDE_SCANS.md
  # paragraph (handwriting clues + cb scan-import + Gemini Flash)
  # with 0 reads / 0 searches, confirming the walk-up from a
  # landmark cwd still picks up the box root's CLAUDE.md and its
  # @-imports.

  - id: landmark-subdir-claude-md-loads
    prompt: "What is the zone code for this directory?"
    expected_level: knows_directly
    watch_for: >
      Answers `ZK-4827-LANDMARK` directly, citing the directory's
      CLAUDE.md as the source. Does NOT need to Read or Glob the
      CLAUDE.md first — the SDK loads it automatically when cwd is
      set to this directory.
    context_dir: audit-landmark-fixture
    fixture:
      audit-landmark-fixture/CLAUDE.md: |
        # Landmark Audit Fixture

        This directory exists only to verify that landmark sessions
        load this CLAUDE.md into the agent's initial context. The
        knowledge-audit harness writes and removes it around the test.

        ZONE CODE: ZK-4827-LANDMARK. Whenever asked "what is the zone
        code for this directory," answer with `ZK-4827-LANDMARK`.
    correct_contains: ["ZK-4827-LANDMARK"]
    should_not_read: ["audit-landmark-fixture/CLAUDE.md"]
    tags: [landmarks, sessions, sdk]
    notes: >
      Failure modes: (1) agent says it doesn't know — the SDK isn't
      auto-loading the subdirectory CLAUDE.md when cwd is set there,
      which would break the whole landmark-session design; (2) agent
      reads the CLAUDE.md before answering — it's still discoverable
      but the cheap auto-load isn't happening, which means MAP.md
      content under a landmark wouldn't be free either.

  - id: landmark-parent-claude-md-loads
    prompt: "In this box, what does CLAUDE_SCANS.md hold, and where does its content get used outside the chat?"
    expected_level: knows_directly
    watch_for: >
      Answers from the box-root CLAUDE.md's CLAUDE_SCANS.md
      paragraph — mentions scan-specific context (recurring people,
      eras, places, handwriting clues) and that `cb scan-import`
      injects it into the Gemini Flash prompt for each page. Does
      NOT need to Read any CLAUDE.md or CLAUDE_SCANS.md: the SDK's
      walk-up from the landmark cwd picks up the box root's
      CLAUDE.md and follows its @-imports automatically.
    context_dir: audit-landmark-fixture
    fixture:
      audit-landmark-fixture/CLAUDE.md: |
        # Landmark Audit Fixture (parent-loading)

        This directory exists only to verify that the box root's
        CLAUDE.md still loads when the SDK runs from a subdirectory.
        It deliberately contains no information about CLAUDE_SCANS,
        scans, or scan-import — the answer must come from the
        parent CLAUDE.md, not this fixture.
    correct_contains_any: ["handwriting", "scan-import", "Gemini Flash"]
    should_not_read: ["CLAUDE_SCANS.md", "CLAUDE.md"]
    tags: [landmarks, sessions, sdk]
    notes: >
      Sibling to landmark-subdir-claude-md-loads. That test confirms
      the landmark-dir CLAUDE.md auto-loads; this one confirms the
      walk-up still picks up the box root's CLAUDE.md (and the
      `@CLAUDE_SCANS.md` import chain) so core box-wide instructions
      don't go missing when a chat is bound to a landmark. Failure
      mode: agent says it has to look, or its answer matches some
      generic notion of "scans" without the box-specific details.

  # === Agent Feedback (cb feedback) ===
  #
  # Verifies agents know about the cb feedback command, when to use it,
  # and will actually use it when they notice something confusing.
  #
  # Status (2026-05-13): All 3 pass. cb-feedback-purpose and cb-feedback-when-to-use
  # answered with 0 file reads (knows_directly). cb-feedback-uses-it read 1 file
  # (cb-commands.md to check validate docs) then ran cb feedback correctly.

  - id: cb-feedback-purpose
    prompt: "There's a cb feedback command. What is it for and who uses it?"
    expected_level: knows_directly
    watch_for: >
      Explains it's for agents to record CLI friction, confusing conventions,
      odd file placements, or unclear behaviors — without interrupting the
      current task. Should mention it writes to config/feedback/ and commits.
      Should not confuse this with the feedback card type (user feedback on
      briefings, captures, etc.).
    correct_contains: ["config/feedback", "commit"]
    correct_contains_any: ["friction", "confusing", "conventions", "unclear", "tooling"]
    tags: [feedback, cli]

  - id: cb-feedback-when-to-use
    prompt: >
      Give me three examples of situations where you would use cb feedback,
      and three where you would not.
    expected_level: knows_directly
    watch_for: >
      "Would use" examples should be about CLI tooling observations: confusing
      flag names, unclear error messages, awkward workflows, files landing in
      odd places, surprising behavior. "Would not use" examples should contrast
      with other channels: chat for questions the user needs to answer, cb
      answer for pending question cards, self-note for scheduled-task summaries,
      just fixing something vs. noting it.
    correct_contains_any: ["flag", "option", "error", "confus", "awkward", "workflow", "convention"]
    tags: [feedback, cli]
    notes: >
      The key distinction: cb feedback is for tooling observations the developer
      (not the boxholder) should act on. It's NOT for user-facing feedback,
      questions for the boxholder, or things the agent can fix itself right now.

  - id: cb-feedback-uses-it
    prompt: >
      While looking at the validate command docs, you notice that the --committed
      flag is confusingly named — it sounds like it validates committed cards,
      but it actually checks that the git working tree is clean. Note this
      observation appropriately and then tell me what cb validate --committed
      actually does.
    expected_level: knows_directly
    watch_for: >
      Agent runs `cb feedback` with a specific observation about the --committed
      flag naming, then correctly explains what the flag actually does (checks
      git working tree cleanliness). Should not ask the user about it or use
      any other channel for the observation.
    correct_contains: ["clean", "working tree"]
    max_turns: 15
    tags: [feedback, cli, behavioral]
    notes: >
      This is a behavioral test — we're checking that the agent actually uses
      cb feedback rather than just knowing it exists. The prompt says "note this
      observation appropriately" which should trigger cb feedback. If the agent
      instead asks the user or uses a self-note, it has the wrong model of the
      command's purpose.

  # === Triage Pipeline ===
  #
  # Status (2026-05-20): 8/10 pass on substance against test1 (run via
  # `knowledge-audit run --box ~/src/boxes/test1 --filter triage-pipeline`).
  # Two real knowledge gaps:
  #
  #   - `triage-confidence-levels`: agent invented a "confidence ladder"
  #     (hypothesis/low/medium/high/confirmed) from `docs/generated/card-guide.md`
  #     instead of naming the pipeline's confident/probable/guess. The
  #     pipeline's enum lives in `docs/plans/triage-design.md` in the callback-box
  #     monorepo, which the box agent can't see.
  #   - `triage-handler-env`: agent spent 20+ tool calls looking for the
  #     TRIAGE_ITEMS env contract, found nothing, returned an empty response.
  #     Same root cause: design doc isn't distributed into boxes.
  #
  # Fix direction (separate work): propagate triage-design.md (or a
  # `docs/generated/triage-pipeline.md` derivative) into boxes so the agent
  # has access. Until then these two tests fail honestly.
  #
  # Several other tests fail only on `should_read` — the agent answered
  # correctly from agent-guide context without needing to crack the design
  # doc. That's a false-fail: the harness penalizes "knows directly" when
  # we expected "knows about." Reviewed by hand; not a real defect.
  #
  # The pipeline is NOT wired into `cb wakeup` yet. Filter with
  # `--filter triage-pipeline`.

  - id: triage-pipeline-stages
    prompt: "What are the stages of the triage pipeline, in order?"
    expected_level: knows_directly
    watch_for: >
      Names three stages in order: intake → triage → handle. Should not
      invent extra stages or conflate with the legacy reactor inbox-job flow.
      The pipeline names are in the always-loaded agent guide; reading the
      design doc is OK but not required.
    correct_contains: ["intake", "triage", "handle"]
    tags: [triage-pipeline]

  - id: triage-pipeline-directories
    prompt: "Where do items live at each stage of the triage pipeline?"
    expected_level: knows_directly
    watch_for: >
      Names box/inbox/intake/ (stage 1), box/inbox/staged/ (between stages 1 and 2),
      box/inbox/triaged/<category>/ (after stage 2), box/inbox/triaged/_unsure/
      for low-confidence holds. Layout is in the always-loaded agent guide.
    correct_contains: ["intake", "staged", "triaged"]
    tags: [triage-pipeline, navigation]

  - id: triage-confidence-levels
    prompt: "The triage agent assigns a confidence level to each item. What are the levels and what do they mean?"
    expected_level: knows_about
    watch_for: >
      Names confident (proceed silently), probable (proceed but flag for review),
      guess (block pending a question). Does NOT invent a "wrong" level — the
      design doc is explicit that wrong is not a confidence level.
    should_read: ["docs/plans/triage-design.md"]
    correct_contains: ["confident", "probable", "guess"]
    tags: [triage-pipeline, behavioral]
    notes: >
      Failure mode: returns numeric confidence or invents a fourth level like
      "wrong" / "unknown". The design doc explicitly rejects both. The
      pipeline's confidence enum is the authority.

  - id: triage-rules-location
    prompt: "I want the triage agent to stop sending recipes to the todos directory. Where do I change that rule?"
    expected_level: knows_directly
    watch_for: >
      Edits the relevant landmark's `<triage-destination><rules>` — either the
      recipes landmark (clarifying what a recipe is) or the todos landmark
      (excluding recipes). Does NOT point at a guide card or a generic config
      file as the canonical location for pipeline routing rules. The agent
      guide names landmark <triage-destination> as the home for these rules.
    correct_contains_any: ["landmark", "triage-destination"]
    tags: [triage-pipeline, landmarks]

  - id: landmark-roles
    prompt: "What roles can a landmark card carry?"
    expected_level: knows_about
    watch_for: >
      Names `<navigation>` (human-facing bookmark) and `<triage-destination>`
      (agent-facing routing target). A landmark must carry at least one role
      and can carry both. Confirmed by reading `docs/generated/card-landmark.md`.
    should_read: ["docs/generated/card-landmark.md"]
    correct_contains: ["navigation", "triage-destination"]
    tags: [triage-pipeline, landmarks, schemas]

  - id: triage-vs-reactor-flow
    prompt: "What's the difference between the triage pipeline's intake stage and the reactor's intake jobs?"
    expected_level: knows_about
    watch_for: >
      Distinguishes the two paths. Triage-pipeline intake (`cb intake`) is
      stage 1 of a formal three-stage pipeline — scans box/inbox/intake/,
      runs prep steps like filename normalization, advances items to
      box/inbox/staged/. Reactor intake jobs are the legacy path —
      connectors drop items in box/inbox/, wakeup creates job cards in
      box/jobs/, the reactor agent processes them. The two paths coexist.
    should_read: ["docs/plans/triage-design.md"]
    correct_contains_any: ["legacy", "coexist", "two", "parallel", "reactor"]
    tags: [triage-pipeline, lifecycle, behavioral]
    notes: >
      The terminology collision (both call themselves "intake") is the failure
      mode this test guards against. The agent should not conflate them.

  - id: triage-guess-handling
    prompt: "What happens when the triage agent isn't sure where an item belongs?"
    expected_level: knows_directly
    watch_for: >
      Item moves to box/inbox/triaged/_unsure/, a select question card is
      created listing candidate categories (plus an `_other` escape option),
      and the pipeline does NOT advance the item further until the user
      answers. _unsure/ is named in the always-loaded agent guide.
    correct_contains: ["_unsure", "question"]
    tags: [triage-pipeline, questions]

  - id: triage-handler-env
    prompt: "If I'm writing a handler procedure for a triage category, how do I see the items in the bucket?"
    expected_level: knows_about
    watch_for: >
      The handler reads the TRIAGE_ITEMS environment variable, which contains
      null-delimited box-relative paths of items in the bucket. Useful idiom:
      pipe through `xargs -0` for shell steps.
    should_read: ["docs/plans/triage-design.md"]
    correct_contains: ["TRIAGE_ITEMS"]
    tags: [triage-pipeline, procedures]

  - id: triage-pipeline-not-wired
    prompt: "If I run `cb wakeup`, does the new intake → triage → handle pipeline run?"
    expected_level: knows_directly
    watch_for: >
      No — the pipeline is not wired into wakeup yet. To exercise it, run
      `cb intake`, `cb triage`, and `cb handle` manually. Wakeup currently
      drives only the legacy reactor inbox-job path. The agent guide is
      explicit: "the new pipeline isn't wired into wakeup yet."
    correct_contains_any: ["not wired", "manual", "manually", "not yet", "legacy"]
    tags: [triage-pipeline, lifecycle]
    notes: >
      This pins the current state. When wakeup eventually invokes the
      pipeline, this test needs to be updated rather than failing silently.

  # === Python Tools (uvx) ===
  #
  # The project standard is to invoke Python CLI tools via `uvx <tool>@<version>`
  # rather than pip-installing into a shared environment. The pin lives at the
  # call site so behavior is reproducible across fresh boxes and cache evictions.
  # Convention doc: docs/generated/python-tools.md (generated by
  # src/core/python-tools-doc.ts, pointed to from the agent guide's
  # External Tools section).

  - id: python-tool-invocation
    prompt: "I want to call a Python CLI tool (say, docling) from a script in this project. How should I invoke it so the version is reproducible?"
    expected_level: knows_about
    watch_for: >
      Names `uvx` (or `uv tool run`) and includes a version pin like
      `uvx docling@<version>` or `uvx --from 'docling==<version>' docling`.
      Should NOT suggest `pip install`, a global venv, or adding docling to
      package.json/requirements.txt without a pin.
    should_read: ["docs/generated/python-tools.md"]
    correct_contains_any: ["uvx", "uv tool run"]
    tags: [tooling, python]
    notes: >
      Guards the convention that Python tools are run isolated and pinned at
      the call site, mirroring the npx pattern. If this starts failing because
      a second Python tool appears and the pins want to centralize, update the
      convention doc and this audit together — don't weaken the test.

  # === Card Format and Schema Discovery ===
  #
  # After phase 2 (May 2026) cards moved from XML body to YAML frontmatter +
  # markdown body for most types; filename became the canonical type
  # discriminator (the `type:` field was stripped in migration #19). These
  # audits pin what the agent should know about that current state, plus
  # the cross-cutting attach-scope and schema-discovery facts.
  #
  # Status (2026-05-24, second pass): 8/10 pass after fixing the doc-gen
  # bug (now regenerates phase-2 schema docs) + strengthening doc/memo
  # schema `instructions` with worked attach-scope examples + cleaning up
  # the flat-format `trash.capture-session` artifact in test1.
  #
  # Failures in the first pass that are now ✓:
  # - attach-sibling-directory — passed once the memo schema instructions
  #   explicitly named the `.attach/` scope and showed a layout example
  #   (and once the stale flat-format trash data was removed from test1
  #   so the agent's grep wouldn't surface it).
  # - doc-with-image-attach-scope — passed once the prompt was rephrased
  #   to demand actual file creation and `cards_contain` checks the
  #   resulting `.doc.card` content for `attach/photo.jpg`.
  # Added two new audits to widen coverage:
  # - doc-body-inline-not-separate-file ✓ — pins body-in-card vs body-in-.md
  # - doc-with-image-where-body ✓ — knowledge variant of the behavioral test
  #
  # Status (2026-05-24): 5/8 pass after initial-run calibration.
  # - memo-yaml-format ✓ — agent gave perfect YAML example by greping a
  #   real memo (the generated card-memo.md is stale; agent did better).
  # - card-type-from-filename ✓ — correct answer; initial `response_not_contains`
  #   was too strict (caught the explanation's own mention of `type:`), now removed.
  # - find-schema-fields ✓ — correct procedure description; initial `should_read`
  #   was wrong for a "how would you find out" question, now removed.
  # - schema-instructions-load-when ✓
  # - classify-thought-as-memo ✓
  # - classify-person-fact ✓
  # - attach-sibling-directory ✗ REAL GAP — agent thinks voice-memo audio is
  #   a flat sibling with matching basename, not in `<basename>.attach/`.
  #   Defensible: test1 actually has both layouts on disk (legacy flat + new
  #   nested), and no agent-facing doc states the canonical convention.
  #   Action: document the attach-scope convention for voice memos somewhere
  #   the agent will load (memo schema instructions or docs/box-layout.md),
  #   then re-run.
  # - doc-with-image-attach-scope ✗ MIXED — `cards_contain` expected an
  #   actual file to exist; agent only described the layout. Substantively
  #   the agent identified the `.attach/` scope correctly but put the doc
  #   body in a separate `Trip_Report.attach/Trip_Report.md` rather than in
  #   the `.doc.card`'s own markdown body — that's wrong. Action: tighten
  #   the prompt to demand actual file creation OR drop `cards_contain` and
  #   add response checks for "body in the .doc.card itself, not a separate
  #   .md file."
  #
  # Cross-cutting finding: generate-docs.ts iterates `schemas` (6 XML legacy
  # schemas) but never `cardSchemas` (24 phase-2 YAML schemas), so
  # `docs/generated/card-<type>.md` is stale for every phase-2 type. Bug,
  # not test issue. Filed implicitly by these audits.

  - id: memo-yaml-format
    prompt: "Show me a tiny example of a memo card on disk — what does the file actually contain?"
    expected_level: knows_about
    watch_for: >
      Shows YAML frontmatter (`---` … `---`) with fields like status / created /
      source, then a plain markdown body. Does NOT use XML `<memo>` elements
      or a `type:` field in frontmatter.
    correct_contains: ["---"]
    response_not_contains: ["<memo>", "<memo ", "type: memo"]
    tags: [cards, format]
    notes: >
      `should_read` deliberately omitted — `docs/generated/card-memo.md` is
      stale (still shows XML) because generate-docs.ts iterates `schemas`
      but not `cardSchemas`, so phase-2 per-schema docs never regenerated.
      An agent that greps for a real `*.memo.card` on disk is doing better
      than following the doc.

  - id: card-type-from-filename
    prompt: "How does the system know what type a card is? Where does the type discriminator come from?"
    expected_level: knows_directly
    watch_for: >
      Names the filename — specifically the `.type.card` extension — as the
      canonical discriminator. A correct answer can legitimately mention
      `type:` while explaining what NOT to look for, so this audit relies
      on `watch_for` review rather than a substring blocklist.
    correct_contains: ["filename"]
    tags: [cards, format]

  - id: attach-sibling-directory
    prompt: "If a memo card has a voice recording attached, where on disk does the audio file live, and how does the card reference it?"
    expected_level: knows_directly
    watch_for: >
      Names a sibling `<basename>.attach/` directory (e.g.
      `Foo.memo.card` + `Foo.attach/recording.m4a`) and a scoped ref
      starting with `attach/` (e.g. `attach/recording.m4a`), NOT an
      absolute or relative-with-../ path.
    correct_contains_any: [".attach/", "attach/"]
    tags: [cards, attachments]
    notes: >
      Foundational; should not require a doc read. Failure mode: putting
      the audio file in a top-level audio/ dir, or referencing it with a
      relative path that doesn't go through the attach scope.

  - id: doc-with-image-attach-scope
    prompt: >
      Actually create (using Write or cb create — don't just describe) a
      doc card at `store/notes/Trip_Report.doc.card` titled "Trip Report"
      whose markdown body embeds one image referenced as `attach/photo.jpg`.
      Don't worry about a real image binary; create the .doc.card itself
      and any directories it needs.
    expected_level: knows_about
    watch_for: >
      Actually creates `store/notes/Trip_Report.doc.card` whose body
      contains a markdown image reference like `![...](attach/photo.jpg)`.
      The `.doc.card` body (not a separate `.md` inside `.attach/`) carries
      the markdown; the image path uses the scoped `attach/` form. Bonus:
      mkdir's `Trip_Report.attach/` even without a real binary.
    cards_contain: ["attach/photo.jpg"]
    max_turns: 15
    tags: [cards, attachments, behavioral, doc]
    notes: >
      True behavioral test — `cards_contain` is the only assertion since
      the produced file IS the artifact; response-prose checks would
      penalize agents that briefly say "done." Pairs with the
      knowledge-only `doc-with-image-where-body` audit which checks the
      agent's response prose instead.

  - id: find-schema-fields
    prompt: "I want to know exactly what fields a `.bookmark.card` allows. How would you find out?"
    expected_level: knows_about
    watch_for: >
      Names `docs/generated/card-bookmark.md` or `src/schemas/bookmark.ts`
      (or a box-local `config/schemas/bookmark.ts`) as where to look.
      Does NOT guess fields from memory or pattern-match off another
      schema. `should_read` deliberately omitted — the prompt asks
      "how would you find out", which the agent can correctly answer
      by describing the procedure without actually opening the file.
    correct_contains_any: ["docs/generated/", "src/schemas/", "config/schemas/"]
    tags: [schemas, discovery]
    notes: >
      Tests whether the agent reaches for the per-schema generated doc
      (the contract) or the source schema (the fallback), rather than
      confabulating fields.

  - id: schema-instructions-load-when
    prompt: "A schema can include `instructions` prose. When does an agent actually see those instructions during normal work?"
    expected_level: knows_about
    watch_for: >
      Explains that schema instructions are surfaced via the generated
      `.claude/rules/card-<type>.md` and load when the agent reads or
      edits a matching card file (path-conditional rule loading), not
      universally at session start.
    correct_contains_any: [".claude/rules", "card-"]
    tags: [schemas, knowledge]
    notes: >
      If the agent thinks all schema instructions load at session start,
      it'll over-trust unrelated card knowledge and won't open the right
      rule when the time comes.

  - id: classify-thought-as-memo
    prompt: >
      The user just dictated: "Quick thought — we should consider lowering the
      cache TTL on the auth tokens, the long expiry is hurting on rotation."
      Which card type would you reach for, and why not the others?
    expected_level: knows_directly
    watch_for: >
      Picks `memo` (it's a brief thought / note). Justifies away `doc`
      (no structured content), `feedback` (not about the system itself),
      `record` (not about a person/thing/event), `todo` (no concrete
      action).
    correct_contains: ["memo"]
    tags: [cards, classification, behavioral]

  - id: doc-body-inline-not-separate-file
    prompt: >
      Where does the body content of a `.doc.card` live on disk? Show me
      the layout of a simple doc card titled "Notes" with the body
      "Some thoughts here."
    expected_level: knows_about
    watch_for: >
      Body lives INLINE in the .doc.card file itself, after the closing
      `---` of the frontmatter. NOT in a separate `.md` file beside the
      card; NOT inside a `.attach/` directory. Single file: just
      `Notes.doc.card`.
    should_read: ["docs/generated/card-doc.md"]
    response_not_contains: ["Notes.attach/Notes.md", ".attach/Notes.md"]
    correct_contains: ["title: Notes"]
    tags: [cards, doc, format, behavioral]
    notes: >
      Pairs with `doc-with-image-attach-scope`. Original failure mode:
      agent put body in `Trip_Report.attach/Trip_Report.md` (pattern-matching
      off the legacy gdoc shape). The doc schema's `instructions` was
      strengthened with a worked layout example.

  - id: doc-with-image-where-body
    prompt: >
      I want a doc card at `store/notes/Trip.doc.card` titled "Trip" with
      a body that embeds an image. Show me every file you'd create and
      its content. The image can be a placeholder.
    expected_level: knows_about
    watch_for: >
      Two files: `store/notes/Trip.doc.card` (containing both the
      frontmatter AND the markdown body with `![...](attach/<image>)`) and
      `store/notes/Trip.attach/<image>` (the image file itself). The body
      is INSIDE the .doc.card, NOT in a separate `Trip.attach/Trip.md`.
    response_not_contains: ["Trip.attach/Trip.md", "attach/Trip.md"]
    correct_contains: ["Trip.attach/", "attach/"]
    tags: [cards, doc, attachments, format, behavioral]

  - id: classify-person-fact
    prompt: >
      The user says: "Sarah from accounting prefers email over Slack — keep
      that in mind when contacting her." Which card would you create or update?
    expected_level: knows_directly
    watch_for: >
      Updates (or creates) a person card for Sarah — info that lives on
      someone, not in an event log. NOT a memo, NOT a record, NOT a
      feedback card.
    correct_contains_any: [".person.card", "person card", "Person card"]
    tags: [cards, classification, behavioral]

  # === Direct Quotes ===
  #
  # The user's expressive words (when they're working through an idea,
  # voicing an opinion, describing how they see something) are wrapped in
  # a Markdoc `{% quote %}` tag to preserve their authentic voice as
  # distinct from the agent's paraphrase. Verbatim content only inside
  # the tag; functional asks ("remind me at 4pm") need no tag. The agent
  # guide's `quotesSection` (loaded via CLAUDE.md) carries the rules.
  #
  # Status (2026-05-29): 4/4 pass on rewritten ~185-word `quotesSection`.
  # All four answered with zero file reads and zero searches — true
  # knows_directly. The qualitative answers were noticeably better than
  # the first run against a longer 448-word section: the when-to-use
  # answer cited the guide's own language back ("working through an idea,
  # voicing an opinion") and the functional-vs-expressive answer cleanly
  # refused to quote a "remind me to call Maria on Friday" ask. The
  # when-to-use audit's keyword list was broadened on the second iteration
  # ("mix"/"selective"/"voice" added) because the agent's natural reply
  # used those instead of "verbatim" — knowledge was correct, only the
  # vocabulary differed.

  - id: quote-tag-syntax
    prompt: >
      When you write a doc that reproduces the user's own words verbatim,
      how do you mark those words?
    expected_level: knows_directly
    watch_for: >
      Names the `{% quote %}` Markdoc tag. Does not invent some other
      syntax (no `<quote>`, no `> blockquote` for direct quotes, no
      manual `"…"`).
    correct_contains_any: ["{% quote"]
    tags: [quotes, cards, markdown]

  - id: quote-when-to-use
    prompt: >
      The user is in a long chat working through an idea — mostly
      thinking out loud about a personal philosophy. Should I quote
      everything they said with `{% quote %}`, paraphrase it all, or
      some mix?
    expected_level: knows_directly
    watch_for: >
      Preserves the user's authentic expression — quote the expressive
      spans verbatim, paraphrase the connecting prose. Does NOT say
      "quote everything" or "paraphrase everything."
    correct_contains_any: ["mix", "selective", "voice", "verbatim", "exact words", "authentic"]
    tags: [quotes, cards, behavioral]

  - id: quote-functional-vs-expressive
    prompt: >
      The user says "remind me to call Maria on Friday." Should I wrap
      that in a `{% quote %}` tag when I create the reminder?
    expected_level: knows_directly
    watch_for: >
      Says no — functional asks/instructions don't need quoting. Just act
      on the request (create the reminder/todo). The quote tag is for
      preserving expressive content, not transcribing every utterance.
    correct_contains_any: ["functional", "no", "don't", "not need"]
    tags: [quotes, cards, behavioral]

  - id: quote-no-fabrication
    prompt: >
      The user told me in a memo "I want to redesign the kitchen." I'm
      now writing a doc and want to convey their enthusiasm. Can I write
      `{% quote %}I'm so excited to redesign the kitchen!{% /quote %}` to
      capture how they felt?
    expected_level: knows_directly
    watch_for: >
      Refuses to fabricate. Says: only the user's exact words go inside
      the tag. The right move is to quote what they actually said ("I
      want to redesign the kitchen") and paraphrase the enthusiasm
      outside the tag — NOT to invent enthusiastic phrasing inside.
    correct_contains_any: ["fabricat", "exact", "actual words", "verbatim", "no"]
    tags: [quotes, behavioral, integrity]

  # --- Behavior audit (not knowledge) ---
  #
  # The four audits above test what the agent *knows* about `{% quote %}`
  # (it answers in prose). This one tests what it *does*: run it in
  # chat+narration mode, hand it an expressive voice dump, tell it to
  # save the note, and check the card it writes actually preserves the
  # user's distinctive phrasing inside a `{% quote %}` tag rather than
  # paraphrasing it into the agent's own prose. This reproduces the
  # 2026-05-19 `hearth`-box feedback: "Narration mode: paraphrasing is
  # NOT okay … the words captured should be Ian's, not the assistant's
  # version of Ian's."
  #
  # Why this shape: the guidance is split across two docs that only
  # cross-link one way. `quotesSection` (always loaded via CLAUDE.md)
  # teaches `{% quote %}` and points forward to narration-mode.md;
  # narration-mode-doc.ts:39 ("use the user's wording … don't paraphrase")
  # never names `{% quote %}`. An agent that consults only the narration
  # doc on capture could preserve wording in plain prose without ever
  # marking it — which is the gap this audit probes.
  #
  # cards_contain is a substring grep across created cards: it asserts the
  # `{% quote` tag is present AND a distinctive verbatim phrase is present,
  # but cannot prove the phrase sits *inside* the tag. Acceptable coverage;
  # the watch_for carries the nuance for whoever reads the report.
  #
  # CONFOUND: the original failure happened in a long session with
  # `{% quote %}` landing mid-session, so context pressure / pre-tag-
  # landing is a likely cause. Each audit is a FRESH session, so a green
  # result here does NOT prove the real long-session failure mode is
  # fixed — it only proves the guidance is sufficient under clean
  # conditions.
  #
  # Status (2026-06-01): PASSES on first run. The agent created
  # Side_Project_Spark.doc.card, wrapped the user's distinctive phrasing
  # in `{% quote %}` ("...the spark, not the slog" landed inside the tag),
  # and replied with a bare `<ack kind="created">` — textbook narration
  # behavior. So under clean conditions the split guidance is sufficient:
  # the always-loaded `quotesSection` carried the agent even though
  # narration-mode-doc.ts never names `{% quote %}`. The doc seam was NOT
  # exercised into a failure here, so per "let the test decide" the
  # narration doc is left unchanged. The long-session confound above is
  # the remaining unknown a fresh-session audit cannot reach.

  - id: narration-capture-uses-quote-tag
    prompt: |
      <chat-app narration="on" prose="off" time="2026-05-19T10:00:00Z"/>
      <speech>Save this to a note for me. I've been chewing on why I keep abandoning side projects, and I think the beginning feels electric — like anything is possible — and then once it's just grinding work I lose the thread. It's not laziness. I'm addicted to the spark, not the slog. Write that down so I don't lose it.</speech>
    expected_level: knows_about
    chat_mode: true
    watch_for: >
      Creates a note/card and preserves the user's distinctive phrasing
      verbatim inside a `{% quote %}` tag — e.g. "addicted to the spark,
      not the slog" sits inside the tag, not rewritten. The failure mode
      is paraphrasing the dump into bland prose ("the user reflected on
      why they abandon projects, preferring beginnings to ongoing work")
      with no `{% quote %}` at all. Any agent framing around the quote is
      fine; what matters is Ian's words survive intact and marked.
    cards_contain: ["{% quote", "the spark, not the slog"]
    should_not_read: []
    max_turns: 20
    tags: [chat, narration, quotes, recording, behavioral]
    notes: >
      Behavior counterpart to the knowledge audits above. See the section
      comment for the doc seam this probes and the long-session confound a
      fresh-session audit cannot reproduce.

  # === Provenance (`{% source %}`) ===
  #
  # `{% source ref="..." as="..." %}` marks content derived from a card
  # or file: required `ref` (auto-tracked by `cb validate` and `cb mv`
  # via Track 4's body ref-walker) and optional free-form `as=`
  # describing how the content was derived. Complements `{% quote %}`:
  # the two compose for "verbatim from there." Agent-guide section is
  # the `sourceSection` (loaded via CLAUDE.md).
  #
  # Status (2026-05-30): 4/4 pass on first run. All four answered with
  # zero file reads and zero searches — true knows_directly. Answers
  # were qualitatively strong: composition test produced the canonical
  # nested-tag form unprompted; skip-for-own-framing test quoted the
  # guide back at the agent and explained the dilution-of-signal
  # rationale beyond what the watch_for asked for.

  - id: source-tag-syntax
    prompt: >
      I'm writing a doc that summarizes a voice memo. How do I mark the
      summary so the doc tells the reader where the content came from?
    expected_level: knows_directly
    watch_for: >
      Names the `{% source %}` Markdoc tag and the required `ref`
      attribute pointing at the source card. May also mention the
      optional `as` attribute for describing the derivation.
    correct_contains_any: ["{% source", "source ref", "source tag"]
    tags: [source, cards, markdown, provenance]

  - id: source-as-is-free-form
    prompt: >
      The user's name appears in a captured email header. I'm pulling it
      out into a person card. What should I put in `{% source %}`'s `as`
      attribute — is there a fixed enum I should pick from?
    expected_level: knows_directly
    watch_for: >
      Says `as=` is free-form natural language, not an enum. Encourages
      writing the actual derivation (something like `as="extracted
      name"` or `as="from email From: header"`), not picking a closest-
      fit category.
    correct_contains_any: ["free-form", "natural language", "not an enum", "no enum", "honest", "describe"]
    tags: [source, behavioral, provenance]

  - id: source-vs-quote-composition
    prompt: >
      I want to record that the user said "ship Friday, no exceptions"
      verbatim, and I also want to cite the chat thread the words came
      from. What tags do I use?
    expected_level: knows_directly
    watch_for: >
      Composes `{% source ref="..." %}` around `{% quote %}...{% /quote %}`.
      Recognises that `{% quote %}` marks verbatim words and `{% source %}`
      pins the origin; both together = "verbatim from there." Does NOT
      collapse them into one tag.
    correct_contains_any: ["{% source", "{% quote", "compose", "wrap", "nest", "both"]
    tags: [source, quotes, cards, provenance]

  - id: source-when-to-skip
    prompt: >
      I'm writing a doc and most of it is my own framing and
      connective prose between things the user said. Should every
      sentence I write be wrapped in `{% source %}` pointing at
      myself?
    expected_level: knows_directly
    watch_for: >
      Says no — `{% source %}` marks spans derived from another card or
      file, not the agent's own framing prose. Connective tissue and
      transitions don't need the tag. The default is unwrapped; the tag
      is the exception that surfaces non-original content.
    correct_contains_any: ["no", "own framing", "connective", "default", "unwrapped", "exception"]
    tags: [source, behavioral, provenance]

  # === Briefing tags ===
  #
  # Briefings carry all semantic content in the body as Markdoc tags
  # now — `{% purpose %}`, `{% key-person %}`, `{% correction %}`,
  # `{% property %}`, `{% project-phase %}`. Frontmatter is identity-
  # only. Agent guide section `briefing-tags.ts`.
  #
  # Status (2026-05-30): 4/4 pass on first run. All four answered
  # with zero file reads and zero searches.

  - id: briefing-tag-vocabulary
    prompt: >
      I'm editing a briefing card. What Markdoc tags are available for
      structuring the body?
    expected_level: knows_directly
    watch_for: >
      Names all five: `{% purpose %}`, `{% key-person %}`,
      `{% correction %}`, `{% property %}`, `{% project-phase %}`.
      Doesn't invent extra ones; doesn't say "use frontmatter fields"
      (those are gone).
    correct_contains_any: ["{% purpose", "purpose", "key-person", "correction"]
    tags: [briefing, cards, markdown]

  - id: briefing-key-person-ref
    prompt: >
      I'm adding a key person to a briefing. Their person card lives
      at `box/people/sam.person.card`. How should I write the
      `{% key-person %}` tag, and what attribute do I use to link to
      their card?
    expected_level: knows_directly
    watch_for: >
      Names the `ref` attribute pointing at the person card. Uses
      absolute form `/box/people/sam.person.card` (or accepts that
      bare path resolves). May mention `called` and `role` as the
      other attributes.
    correct_contains_any: ["ref=", "/box/people/sam", "people/sam"]
    tags: [briefing, cards, references]

  - id: briefing-prose-vs-tag
    prompt: >
      The briefing needs a "Legal" section explaining that the ledger
      is in probate. Should I invent a `{% legal %}` tag, or write it
      as plain markdown?
    expected_level: knows_directly
    watch_for: >
      Says plain markdown (e.g., `## Legal` followed by prose). The
      briefing vocabulary is the five tags listed in the agent guide;
      everything else stays as plain markdown headings and paragraphs.
      Does NOT invent a new tag.
    correct_contains_any: ["plain markdown", "## Legal", "heading", "prose", "don't invent"]
    tags: [briefing, cards, behavioral]

  - id: briefing-correction-test
    prompt: >
      I'm adding a correction to a briefing: "Always confirm before
      sending an email." What's the `test` attribute on
      `{% correction %}` for, and is it required?
    expected_level: knows_directly
    watch_for: >
      Says `test` is optional, describes how to verify the correction
      is being followed (free-form natural language). Not required.
      Recognises it as analogous to `{% source %}`'s `as=` — a
      free-form descriptive attribute.
    correct_contains_any: ["optional", "verify", "test", "how to"]
    tags: [briefing, cards, behavioral]

  # === Recipe tags ===
  #
  # Recipes are now Phase-2 cards with body Markdoc — `{% ingredient %}`,
  # `{% step %}`, `{% yield %}`, `{% substitution %}`, `{% subrecipe %}`,
  # `{% recipe-section %}`. Recipe vocabulary is intentionally NOT in
  # the always-loaded agent guide (recipes are domain-specific; most
  # boxes don't touch them). It lives in `RecipeSchema.instructions`,
  # which compiles into `docs/generated/card-recipe.md`. The audits
  # below are `knows_about` — the agent reads the recipe doc on
  # demand when asked about recipes.
  #
  # Status (2026-05-30): 3/3 content-correct; 1/3 triggered the
  # expected `Read docs/generated/card-recipe.md`. The other two:
  # `recipe-ingredient-attrs` discovered the doc via `Bash` (ls / find)
  # without going through Read — answer is correct and cites recipe
  # implementation details (`Fraction`, inline/block) suggesting it
  # found the file. `recipe-prose-vs-tag` answered correctly via
  # principle transfer from the briefing-tags section
  # ("don't invent a tag for everything") which IS still in the
  # always-loaded agent guide. Treating the `should_read` failures as
  # informational, not actionable: the answers are right and the
  # cross-doc generalization is desirable agent behavior.

  - id: recipe-tag-vocabulary
    prompt: >
      I'm writing a recipe card. What Markdoc tags are available for
      structuring the body?
    expected_level: knows_about
    watch_for: >
      Reads `docs/generated/card-recipe.md`, then names at least
      `{% ingredient %}` and `{% step %}` (the core pair). Bonus
      credit for naming the rest: `{% yield %}`, `{% substitution %}`,
      `{% subrecipe %}`, `{% recipe-section %}`. Does NOT say "use
      XML elements" (the old schema is gone).
    should_read: ["docs/generated/card-recipe.md"]
    correct_contains_any: ["{% ingredient", "{% step", "ingredient", "step"]
    tags: [recipe, cards, markdown]

  - id: recipe-ingredient-attrs
    prompt: >
      I want to write "2 cups all-purpose flour" as an ingredient in a
      recipe. What does the `{% ingredient %}` tag look like, and what
      attributes does it take?
    expected_level: knows_about
    watch_for: >
      Reads `docs/generated/card-recipe.md`, then names the `amount`
      and `unit` attributes; puts the ingredient name in the body.
      Shape like `{% ingredient amount="2" unit="cups" %}all-purpose
      flour{% /ingredient %}`. Recognises that the recipe view uses
      `amount` for scaling.
    should_read: ["docs/generated/card-recipe.md"]
    correct_contains_any: ["amount=\"2\"", "amount='2'", "amount=", "unit=\"cups\"", "unit="]
    tags: [recipe, cards, markdown]

  - id: recipe-prose-vs-tag
    prompt: >
      I'm editing a recipe card. The recipe needs a "Tips" section
      with general cooking advice that doesn't fit ingredients or
      steps. Should I invent a `{% tips %}` tag, or write it as plain
      markdown?
    expected_level: knows_about
    watch_for: >
      Reads `docs/generated/card-recipe.md`, then says plain markdown
      (e.g., `## Tips` followed by prose). The recipe vocabulary is
      the six tags listed in the recipe-card doc; everything else
      stays as plain markdown headings and paragraphs. Does NOT
      invent a new tag.
    should_read: ["docs/generated/card-recipe.md"]
    correct_contains_any: ["plain markdown", "## Tips", "heading", "prose", "don't invent"]
    tags: [recipe, cards, behavioral]

  # === Retrospective (docs/plans/box-retrospectives.md) ===

  - id: retro-report-location
    prompt: >
      The boxholder asks: "something changed my assistant's personality
      card last week and the commit says Retro-Run — what was that, and
      where can I see exactly what it looked at?"
    expected_level: knows_directly
    watch_for: >
      Explains the retrospective (process-retrospective procedure mining
      past chat sessions) and points at the run reports in
      store/reviews/retro/ without searching for them.
    correct_contains: ["store/reviews/retro"]
    tags: [retro, navigation]

  - id: retro-inferred-belief-policy
    prompt: >
      A personality trait reads `confidence: medium, source: inferred`.
      New chat evidence supports it even more strongly. Should you raise
      it to high?
    expected_level: knows_directly
    watch_for: >
      Says no — medium is the ceiling for inferred beliefs; promotion
      past it needs the boxholder (a question card / user-stated
      confirmation), not more inferred evidence.
    correct_contains: ["medium"]
    tags: [retro, personality, behavioral]
